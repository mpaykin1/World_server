name: fleet-pre-merge-chain

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: fleet-pre-merge-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fleet-pre-merge-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact-head Fleet PRE certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          node scripts/check-fleet-pre-certificate.cjs \
            --sha "${HEAD_SHA}" \
            --pr "${PR_NUMBER}" \
            --source issues \
            --token "${GH_TOKEN}"