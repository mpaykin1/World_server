<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Panorama 360 Tour Editor</title><style>html,body{margin:0;height:100%;font:14px system-ui;background:#0b1018;color:#eef}main{display:grid;grid-template-columns:1fr 340px;height:100%}iframe{width:100%;height:100%;border:0}.panel{padding:14px;overflow:auto;border-left:1px solid #2b3442}input,button{width:100%;box-sizing:border-box;margin:4px 0 8px;padding:9px;border-radius:8px;border:1px solid #344052;background:#121925;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid #344052;border-radius:8px;padding:8px;margin:8px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55% 45%}.panel{border-left:0;border-top:1px solid #2b3442}}</style></head><body><main><iframe id="viewer" src="./index.html"></iframe><section class="panel"><h1>Tour Editor</h1><label>Manifest<input id="manifest" type="text"></label><button id="load">Load</button><hr><label>Label<input id="label" value="Next scene"></label><label>Target manifest<input id="target" placeholder="/shared/panorama360/next/manifest.json"></label><button id="add">Add hotspot at current view</button><div id="list"></div><button id="copy">Copy JSON</button><button id="download">Download hotspots.json</button><pre id="json"></pre></section></main><script src="./editor.js"></script></body></html>
