# Cloud Run declarative manifest for the "world-sandbox" slot.
# Same image/build as world-navigator (one codebase, one Supabase project) -
# only WORLD_SLOT and the entrypoint override differ, plus optional
# sandbox-only fault injection. See cloudrun-service-navigator.yaml for the
# shared setup notes (Cloud Build trigger, Secret Manager references).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: world-sandbox
  labels:
    world-slot: sandbox
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/world-sandbox:latest # replaced by the source-based Cloud Build trigger
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
          env:
            - name: WORLD_SLOT
              value: sandbox
            - name: WORLD_SANDBOX_ENTRYPOINT
              value: /apps/dark-void-scene/
            - name: WORLD_MAX_RSS_MB
              value: "1024"
            - name: WORLD_MAX_HEAP_MB
              value: "768"
            - name: SUPABASE_URL
              value: https://xlcdnlsyvxqtopmkweiy.supabase.co
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: world-supabase-publishable-key
                  key: latest
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: world-supabase-secret-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: world-gemini-api-key
                  key: latest
            # Sandbox-only: sends deliberate faults to /__test/fault/* for
            # resilience testing. Refused entirely on navigator by
            # cloudrun-entry.cjs even if accidentally set there.
            - name: WORLD_ENABLE_SANDBOX_FAULTS
              value: "0" # flip to "1" only for an explicit fault-injection test run
