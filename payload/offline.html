<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<title>World Server — offline</title>
<style>
html,body{height:100%;margin:0;background:#080b10;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
section{max-width:460px}
h1{font-size:24px;margin:0 0 12px}
p{opacity:.78;line-height:1.5}
button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700}
</style>
</head>
<body>
<main><section><h1>Нет соединения</h1><p>Сохранённые части приложения продолжают работать. Когда интернет вернётся, приложение автоматически получит актуальную версию.</p><button onclick="location.reload()">Повторить</button></section></main>
</body>
</html>
