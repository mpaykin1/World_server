name: Visual Baseline Candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'shared/**'
      - 'e2e/**'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run visual:candidates
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: visual-candidates/**
