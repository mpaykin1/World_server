name: Quality Auto-Fix PR

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic safe fixes
        run: node scripts/quality-autofix.js --apply
      - name: Verify candidate
        run: |
          npm run release:gate
          node --test test/quality-regression.test.js test/golden-physics.test.js test/quality-growth.test.js
      - name: Detect diff
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create quality branch and PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai/quality-autofix/${GITHUB_RUN_ID}"
          git config user.name "world-server-quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "fix(quality): deterministic regression auto-fixes"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH"             --title "fix(quality): automated safe regression fixes"             --body "Generated by Quality Auto-Fix. All deterministic release gates passed before this PR was opened."
