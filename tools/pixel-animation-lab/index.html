<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Animation Lab</title><style>html,body{margin:0;background:#111;color:#eee;font:14px system-ui;height:100%;overflow:hidden}canvas{width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;left:8px;top:8px;padding:8px;background:#000b;border-radius:8px;white-space:pre;font-family:monospace;z-index:2}</style><canvas id="c"></canvas><div id="hud">loading</div><script src="/shared/pixel-animation-engine.js"></script><script src="/shared/pixel-animation-webgpu.js"></script><script src="/shared/pixel-animation-runtime.js"></script><script src="/shared/pixel-animation-auto-profile.js"></script><script>(async()=>{const c=document.querySelector('#c'),hud=document.querySelector('#hud');const q=new URLSearchParams(location.search),n=Math.min(20000,Math.max(1,+q.get('n')||5000));const e=await PixelAnimationRuntime.create(c,{gridSegments:6});addEventListener('resize',()=>e.resize());e.resize();const tile=document.createElement('canvas');tile.width=16;tile.height=16;const x=tile.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#0000';x.clearRect(0,0,16,16);x.fillStyle='#f80';x.fillRect(3,2,10,12);x.fillStyle='#ff0';x.fillRect(6,4,4,8);x.fillStyle='#f00';x.fillRect(2,6,12,4);await e.loadAtlas(tile);for(let i=0;i<n;i++)e.spawn({x:(i%200)*18,y:Math.floor(i/200)*18,w:16,h:16,profile:i%7===0?'fire':i%5===0?'bird':'glass',seed:i/Math.max(1,n)});e.setCamera({x:0,y:0,w:innerWidth,h:innerHeight});e.start();setInterval(()=>{hud.textContent=JSON.stringify(e.stats(),null,2)},250)})();</script>
