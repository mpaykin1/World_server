name: automation-watchdog
# Независимый сторож пяти автозадач ChatGPT. Не зависит от ChatGPT.
# Нет коммитов в master дольше порога -> красный прогон + issue "Автозадачи простаивают".
# Появился коммит -> issue закрывается. Код игр не трогает.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check last master commit age
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_HOURS: '3'
        run: |
          set -euo pipefail
          last=$(gh api "repos/${{ github.repository }}/commits?sha=master&per_page=1" --jq '.[0].commit.committer.date')
          sha=$(gh api "repos/${{ github.repository }}/commits?sha=master&per_page=1" --jq '.[0].sha[0:8]')
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "last master commit $sha at $last, age ${age}h"
          title="Автозадачи простаивают (сторож)"
          num=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ "$age" -ge "$THRESHOLD_HOURS" ]; then
            body="Последний коммит в master: $sha, $last UTC. Простой: ${age} ч при пороге ${THRESHOLD_HOURS} ч. Проверьте раздел Задачи в ChatGPT и последний запуск каждой из пяти задач. Запись обновляется каждый час и закроется сама, когда появится новый коммит."
            if [ -z "$num" ]; then
              gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"
            else
              gh issue comment "$num" -R "${{ github.repository }}" --body "Всё ещё простой: ${age} ч (последний коммит $sha)."
            fi
            echo "::error::Автозадачи простаивают ${age} ч"
            exit 1
          elif [ -n "$num" ]; then
            gh issue close "$num" -R "${{ github.repository }}" --comment "Новый коммит $sha, простой снят (${age} ч)."
          fi
