name: Gap Closure Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gap-closure-loop
  cancel-in-progress: false

jobs:
  close-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Analyze and apply deterministic safe fixes
        env:
          QUALITY_BASE_URL: https://world-server.vercel.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gap-closure-engine.js --apply

      - name: Regenerate canonical evidence
        run: |
          npm run project:review
          npm run quality:world
          npm run quality:regression
          npm run quality:perceptual

      - name: Re-check gap closure gate
        env:
          QUALITY_BASE_URL: https://world-server.vercel.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gap-closure-engine.js --gate=release

      - name: Verify repository
        run: |
          npm run check
          npm run golden:check
          npm run quality:stability

      - name: Detect safe patch
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create winner-only branch and PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai/gap-closure/${GITHUB_RUN_ID}"
          git config user.name "world-server-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "fix(quality): close verified system gaps"
          git push origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "fix(quality): verified gap closure" \
            --body "Generated by Gap Closure Loop. Safe deterministic fixes only. Master is never pushed or auto-merged. Canonical quality gates were rerun after patching."

      - name: Surface unresolved gaps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let s={openGapCount:0,releaseBlockerCount:0};
          try{s=JSON.parse(fs.readFileSync('GAP_CLOSURE_STATUS.json','utf8'))}catch{}
          if(!s.openGapCount) process.exit(0);
          const title='Gap Closure: unresolved quality gaps';
          const body=`Open gaps: ${s.openGapCount}\nRelease blockers: ${s.releaseBlockerCount}\n\nInspect GAP_CLOSURE_REPORT.json. A gap may be closed only by fresh verification evidence.`;
          fs.writeFileSync('/tmp/gap-body.txt',body);
          NODE
          if [ -f /tmp/gap-body.txt ]; then
            EXISTING="$(gh issue list --state open --search "Gap Closure: unresolved quality gaps in:title" --json number --jq '.[0].number // empty')"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file /tmp/gap-body.txt
            else
              gh issue create --title "Gap Closure: unresolved quality gaps" --body-file /tmp/gap-body.txt
            fi
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-closure-evidence
          path: |
            GAP_CLOSURE_REPORT.json
            GAP_CLOSURE_STATUS.json
            PROJECT_QUALITY_REVIEW.json
            WORLD_QUALITY_AUTOPILOT_STATUS.json
            QUALITY_REGRESSION_REPORT.json
          if-no-files-found: warn
