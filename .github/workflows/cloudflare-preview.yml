name: Cloudflare Exact-Head Preview

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: authority
        name: Detect Cloudflare deployment authority
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy isolated exact-head worker
        id: deploy
        if: steps.authority.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || 'manual' }}"
          OUTPUT="$(npm run deploy:cloudflare:production -- --name "world-server-pr-${PR_NUMBER}")"
          printf '%s\n' "$OUTPUT"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.(workers|pages)\.dev' | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify Cloudflare stack and security
        if: steps.authority.outputs.configured == 'true'
        run: node scripts/verify-cloudflare-stack.cjs "${{ steps.deploy.outputs.url }}" "$GITHUB_SHA"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact-head Cloudflare playable delivery
        if: steps.authority.outputs.configured == 'true'
        run: npm run delivery:verify -- "${{ steps.deploy.outputs.url }}/apps/voxel-world/" --expected-sha="$GITHUB_SHA" --game --inventory-id=voxel-world
      - name: Fail closed when Cloudflare credentials are unavailable
        if: steps.authority.outputs.configured != 'true'
        shell: bash
        run: |
          echo "BLOCKED: Cloudflare credentials are required for Cloudflare-critical exact-head verification." >&2
          exit 1
