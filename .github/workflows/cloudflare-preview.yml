name: Cloudflare Exact-Head Preview

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: authority
        name: Detect Cloudflare deployment authority
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy isolated exact-head worker
        id: deploy
        if: steps.authority.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || 'manual' }}"
          OUTPUT="$(npx wrangler@4.45.0 deploy --name "world-server-pr-${PR_NUMBER}" --var "WORLD_SERVER_DEPLOYED_SHA:${GITHUB_SHA}")"
          printf '%s\n' "$OUTPUT"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.(workers|pages)\.dev' | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify Cloudflare stack and security
        if: steps.authority.outputs.configured == 'true'
        run: node scripts/verify-cloudflare-stack.cjs "${{ steps.deploy.outputs.url }}" "$GITHUB_SHA"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact-head Cloudflare playable delivery
        if: steps.authority.outputs.configured == 'true'
        run: npm run delivery:verify -- "${{ steps.deploy.outputs.url }}/apps/voxel-world/" --expected-sha="$GITHUB_SHA" --game --inventory-id=voxel-world
      - name: Verify Netlify PR fallback when Cloudflare credentials are unavailable
        if: ${{ steps.authority.outputs.configured != 'true' && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://deploy-preview-${{ github.event.pull_request.number }}--world-server.netlify.app"
          for i in {1..18}; do
            if curl -fsS "$URL/apps/voxel-world/" >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS "$URL/apps/voxel-world/" >/dev/null
          npm run delivery:verify -- "$URL/apps/voxel-world/" --game --inventory-id=voxel-world
          PLAYWRIGHT_BASE_URL="$URL" npx playwright test e2e/golden-world-fleet.spec.js --project=desktop-chromium --project=mobile-chromium
      - name: Report unconfigured manual run
        if: ${{ steps.authority.outputs.configured != 'true' && github.event_name != 'pull_request' }}
        run: echo "Cloudflare credentials unavailable and no PR preview exists; verification skipped."
