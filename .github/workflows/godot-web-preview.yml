name: Godot Web Build & Vercel Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy canonical world-server to Vercel"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: godot-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Godot 4 & Export Templates
        run: |
          mkdir -p /tmp/godot_setup
          cd /tmp/godot_setup
          curl -L -s -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot_setup/Godot_v4.3-stable_linux.x86_64" >> $GITHUB_ENV

          curl -L -s -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/
          echo "[Godot Setup] Godot 4.3 binary and Web export templates installed successfully."

      - name: Run Godot Web Export & Artifact Validation
        run: node scripts/godot-web-build.js

      - name: Run Web-Native Equivalence Check
        run: node scripts/compare-worldgen.js

      - name: Decide deploy policy
        id: deploy-policy
        shell: bash
        run: |
          DEPLOY=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy }}" = "true" ]; then
            DEPLOY=true
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "[Deploy Policy] event=${{ github.event_name }} ref=${{ github.ref }} deploy=$DEPLOY"

      - name: Verify Vercel release configuration
        if: steps.deploy-policy.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is required for an explicit release."
            exit 1
          fi
          echo "[Vercel Config] release token detected."

      - name: Deploy canonical Vercel Preview
        id: deploy
        if: steps.deploy-policy.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_itmMhMILAlqU6yLs7xnsvbo1
          VERCEL_PROJECT_ID: prj_XsKyvMHpuNomoPBxuOD8vd26Fi3y
        run: |
          echo "[Vercel Deploy] Explicit release to canonical world-server project."
          PREVIEW_OUTPUT=$(npx vercel deploy --token="$VERCEL_TOKEN" --yes 2>&1)
          echo "$PREVIEW_OUTPUT"
          URL=$(echo "$PREVIEW_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1 || true)
          if [ -z "$URL" ]; then
            echo "::error::Vercel deploy completed without a Preview URL."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "GODOT_WEB_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "[Vercel Deploy] Preview URL: $URL"

      - name: HTTP Smoke Check against released Preview
        if: steps.deploy-policy.outputs.deploy == 'true' && steps.deploy.outputs.preview_url != ''
        run: |
          URL="${{ steps.deploy.outputs.preview_url }}/apps/godot-web/"
          echo "[HTTP Smoke] Probing $URL ..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL")
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::HTTP probe failed with status $STATUS for $URL"
            exit 1
          fi
          echo "[HTTP Smoke] PASS - Status 200 for $URL"

      - name: Install Playwright Browsers
        if: steps.deploy-policy.outputs.deploy == 'true' && steps.deploy.outputs.preview_url != ''
        run: npx playwright install --with-deps chromium

      - name: Playwright Smoke Check against released Preview
        if: steps.deploy-policy.outputs.deploy == 'true' && steps.deploy.outputs.preview_url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
        run: npx playwright test e2e/godot-web-smoke.spec.js --project=desktop-chromium

      - name: Upload Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-build-evidence
          path: |
            GODOT_WEB_BUILD_REPORT.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
