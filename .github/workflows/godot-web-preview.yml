name: Godot Web Ephemeral Preview & Vercel Release

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy canonical world-server to Vercel"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: godot-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-web:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Godot 4 & Export Templates
        run: |
          mkdir -p /tmp/godot_setup
          cd /tmp/godot_setup
          curl -L --fail --retry 3 -s -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot_setup/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 -s -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Run Godot Web Export & Artifact Validation
        run: node scripts/godot-web-build.js

      - name: Run Web-Native Equivalence Check
        run: node scripts/compare-worldgen.js

      - name: Start isolated preview server
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/world-server-preview/apps/godot-web
          cp -a apps/godot-web/. /tmp/world-server-preview/apps/godot-web/
          cd /tmp/world-server-preview
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/world-server-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/apps/godot-web/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/world-server-http.log || true
          exit 1

      - name: Create quota-free Cloudflare test URL
        id: tunnel
        if: github.event_name == 'pull_request'
        run: |
          curl -L --fail --retry 3 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 > /tmp/cloudflared.log 2>&1 &
          URL=""
          for i in $(seq 1 75); do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -n 1 || true)
            if [ -n "$URL" ] && curl -fsS "$URL/apps/godot-web/" >/dev/null; then
              break
            fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log || true
            echo "::error::Cloudflare Quick Tunnel did not produce a public URL."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "## REAL TEST URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/apps/godot-web/" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=REAL TEST URL::$URL/apps/godot-web/"
          echo "REAL_TEST_URL=$URL/apps/godot-web/"

      - name: Publish real test URL to PR
        if: github.event_name == 'pull_request' && steps.tunnel.outputs.preview_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.tunnel.outputs.preview_url }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="REAL_TEST_URL: ${PREVIEW_URL}/apps/godot-web/\n\nTemporary isolated Godot Web preview. It stays online while this workflow is running (about 40 minutes). No Vercel quota is used."

      - name: Install Playwright browser
        if: github.event_name == 'pull_request' && steps.tunnel.outputs.preview_url != ''
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke check against real preview
        if: github.event_name == 'pull_request' && steps.tunnel.outputs.preview_url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.tunnel.outputs.preview_url }}
        run: npx playwright test e2e/godot-web-smoke.spec.js --project=desktop-chromium

      - name: Decide Vercel release policy
        id: deploy-policy
        run: |
          DEPLOY=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy }}" = "true" ]; then DEPLOY=true; fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel release configuration
        if: steps.deploy-policy.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is required for explicit release."; exit 1; }

      - name: Deploy canonical Vercel Preview
        id: deploy
        if: steps.deploy-policy.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_itmMhMILAlqU6yLs7xnsvbo1
          VERCEL_PROJECT_ID: prj_XsKyvMHpuNomoPBxuOD8vd26Fi3y
        run: |
          PREVIEW_OUTPUT=$(npx vercel deploy --token="$VERCEL_TOKEN" --yes 2>&1)
          echo "$PREVIEW_OUTPUT"
          URL=$(echo "$PREVIEW_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1 || true)
          test -n "$URL" || { echo "::error::Vercel deploy produced no Preview URL."; exit 1; }
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: HTTP smoke check against explicit Vercel release
        if: steps.deploy-policy.outputs.deploy == 'true' && steps.deploy.outputs.preview_url != ''
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ steps.deploy.outputs.preview_url }}/apps/godot-web/")
          test "$STATUS" -eq 200

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-build-evidence
          path: |
            GODOT_WEB_BUILD_REPORT.json
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Keep real test URL alive for manual testing
        if: always() && github.event_name == 'pull_request' && steps.tunnel.outputs.preview_url != ''
        timeout-minutes: 41
        run: |
          echo "REAL_TEST_URL=${{ steps.tunnel.outputs.preview_url }}/apps/godot-web/"
          sleep 2400
