name: REFERENCE3D Blender Smoke

on:
  pull_request:
    paths:
      - 'lib/reference-3d-agent.js'
      - 'services/ai3d-worker/tools/reference3d_blender.py'
      - 'test/reference-3d-agent.test.js'
      - 'test/reference3d-blender-contract.test.js'
      - 'shared/pixel3d/**'
      - 'apps/pixel3d-multiview/**'
      - '.github/workflows/reference3d-blender-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused JavaScript contracts
        run: npm run reference3d:check
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version
      - name: Create selected materialized smoke mesh
        run: |
          cat > /tmp/reference3d_make_scene.py <<'PY'
          import bpy
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          bpy.ops.mesh.primitive_cube_add(size=2.0, location=(0, 0, 1))
          obj = bpy.context.active_object
          obj.name = 'REFERENCE3D_SMOKE_CUBE'
          material = bpy.data.materials.new('REFERENCE3D_SMOKE_MATERIAL')
          material.diffuse_color = (0.24, 0.52, 0.82, 1.0)
          obj.data.materials.append(material)
          obj.select_set(True)
          bpy.context.view_layer.objects.active = obj
          bpy.ops.wm.save_as_mainfile(filepath='/tmp/reference3d-smoke.blend')
          PY
          blender --background --python /tmp/reference3d_make_scene.py
      - name: Run real export and isolated re-import verification
        run: |
          blender /tmp/reference3d-smoke.blend --background \
            --python services/ai3d-worker/tools/reference3d_blender.py -- \
            --out /tmp/reference3d-smoke.glb \
            --report /tmp/reference3d-report.json \
            --cleanup --ensure-uv --decimate-ratio 1.0
      - name: Assert Blender evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/reference3d-report.json').read_text())
          assert report['tool'] == 'REFERENCE3D_BLENDER_FINALIZER'
          assert report['selectionScoped'] is True
          assert report['userVerdict'] == 'UNSET'
          assert Path('/tmp/reference3d-smoke.glb').stat().st_size > 0
          failed = [name for name, ok in report['verification']['checks'].items() if not ok]
          assert not failed, failed
          print(json.dumps(report['verification'], indent=2))
          PY
