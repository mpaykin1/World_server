name: Quality Canary Deploy

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote verified canary to production
        required: true
        default: false
        type: boolean
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: config
        name: Detect Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_CLI_VERSION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel canary not configured; deployment gates skipped without false CI failure."
          fi
      - name: Install pinned Vercel CLI
        if: steps.config.outputs.configured == 'true'
        run: npm install -g "vercel@${{ vars.VERCEL_CLI_VERSION }}"
      - name: Pull preview environment
        if: steps.config.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Local prebuilt candidate
        if: steps.config.outputs.configured == 'true'
        run: |
          npm run release:gate
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"
      - id: deploy
        name: Deploy immutable preview
        if: steps.config.outputs.configured == 'true'
        run: |
          URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Browser gate against canary
        if: steps.config.outputs.configured == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: Canary HTTP smoke
        if: steps.config.outputs.configured == 'true'
        env:
          QUALITY_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/post-deploy-smoke.js

  promote:
    needs: canary
    if: needs.canary.outputs.configured == 'true' && (github.ref == 'refs/heads/master' || inputs.promote == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g "vercel@${{ vars.VERCEL_CLI_VERSION }}"
      - name: Promote exact verified artifact
        run: vercel promote "${{ needs.canary.outputs.url }}" --yes --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Post-production smoke
        id: smoke
        continue-on-error: true
        env:
          QUALITY_BASE_URL: https://world-server.vercel.app
        run: node scripts/post-deploy-smoke.js
      - name: Automatic rollback on failed post-smoke
        if: steps.smoke.outcome == 'failure'
        run: |
          vercel rollback --yes --token="${{ secrets.VERCEL_TOKEN }}"
          exit 1
