name: Quality Canary Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Mirror the CPU test dependencies required by the protected CI workflow.
      # A clean canary runner must not depend on preinstalled Python packages.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Voxel City verifier dependencies
        run: python -m pip install 'pillow>=11,<13' 'numpy>=2,<3' 'requests>=2.32,<3'
      - id: authority
        name: Detect Cloudflare deployment authority
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail closed when Cloudflare credentials are unavailable
        if: steps.authority.outputs.configured != 'true'
        shell: bash
        run: |
          echo "BLOCKED: Cloudflare credentials are required for a meaningful quality canary." >&2
          exit 1
      - name: Release gate
        run: npm run release:gate
      - id: deploy
        name: Deploy immutable Cloudflare canary
        shell: bash
        run: |
          set -euo pipefail
          export WORKERS_CI_COMMIT_SHA="$SOURCE_SHA"
          OUTPUT="$(npm run deploy:cloudflare:production -- --name "world-server-canary-${GITHUB_RUN_ID}")"
          printf '%s\n' "$OUTPUT"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.(workers|pages)\.dev' | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify Cloudflare stack and exact SHA
        run: node scripts/verify-cloudflare-stack.cjs "${{ steps.deploy.outputs.url }}" "$SOURCE_SHA"
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser gate against Cloudflare canary
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test
      - name: Verify playable delivery
        run: npm run delivery:verify -- "${{ steps.deploy.outputs.url }}/apps/voxel-world/" --expected-sha="$SOURCE_SHA" --game --inventory-id=voxel-world
      - name: Canary HTTP smoke
        env:
          QUALITY_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/post-deploy-smoke.js
