name: Linux Container Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Cloud Run image
        run: docker build -f google-ai-studio/Dockerfile -t world-server:proof .
      - name: Run container and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -e WORLD_SLOT=sandbox -e PORT=8080 -p 18080:8080 world-server:proof)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz > /tmp/readyz.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          cat /tmp/readyz.json
          curl --fail --silent --show-error http://127.0.0.1:18080/apps/catalog/ -o /tmp/catalog.html
          test -s /tmp/catalog.html          root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)"
          test "$root_status" = "302"
          docker stop -t 12 "$cid" >/dev/null
          exit_code="$(docker inspect --format='{{.State.ExitCode}}' "$cid")"
          oom="$(docker inspect --format='{{.State.OOMKilled}}' "$cid")"
          test "$exit_code" = "0"
          test "$oom" = "false"
          echo "Linux/container proof PASS: readyz, catalog asset, root redirect, graceful SIGTERM, no OOM."