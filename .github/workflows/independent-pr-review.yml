# Retired: mandatory two-model independent review.
# Kept as a historical marker; no automatic or manual triggers.
# Standard CI, regression, secret scanning and merge conflict checks remain separate.
name: Independent PR Review (retired)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Retired workflow; no review is run'
        required: false
jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Dual-review gate retired by maintainer request.'
