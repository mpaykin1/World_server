name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect AI3D Voxel City impact
        id: ai3d-impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "${BASE:-}" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No reliable base SHA; running the AI3D autoplay gate conservatively."
            exit 0
          fi

          if ! CHANGED="$(git diff --name-only "$BASE" "$HEAD")"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Unable to calculate impact safely; running the AI3D autoplay gate conservatively."
            exit 0
          fi

          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(apps/ai3d-voxel-city/|e2e/ai3d-voxel-city-autoplay\.spec\.js$|shared/|server\.js$|playwright\.config\.js$|package(-lock)?\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "AI3D Voxel City is impacted; its autoplay test remains a hard gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "AI3D Voxel City is unrelated to this change; its autoplay test will not block publication."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI3D worker Python deps (needed for CPU tests)
        run: pip install pillow numpy requests
      - run: npm ci --ignore-scripts || npm install
      - name: Sentry build + static invariants (hard)
        run: |
          npm run build:sentry
          node scripts/inject-sentry-runtime.js
          node scripts/check-sentry-runtime.js
      - run: npm run check
      - run: python -m py_compile services/ai3d-worker/server.py services/ai3d-worker/ai3d/*.py services/ai3d-worker/ai3d/plugins/*.py services/ai3d-worker/tools/*.py services/ai3d-worker/scripts/e2e-smoke.py
      - name: AI3D discovery smoke
        run: node scripts/discover-ai3d-engines.js && test -f services/ai3d-worker/third_party/local-inventory.json
      - name: AI3D E2E smoke (image->job->engine->artifact->validation, 100% via CPU volumetric)
        run: python services/ai3d-worker/scripts/e2e-smoke.py
      - name: AI3D evidence gate (hard)
        run: python scripts/check-ai3d-claims.py
      - name: AI3D final delivery policy (hard)
        run: node scripts/check-ai3d-delivery-policy.js
      - name: AI3D V4 combined integration (hard)
        run: node scripts/check-ai3d-v4-combined.js
      - name: WORLD SERVER Golden Standard source/release gate (hard)
        run: npm run release:gate
      - name: Install Playwright browsers (chromium + webkit for iPhone emulation)
        run: npx playwright install --with-deps chromium webkit
      - name: Sentry runtime smoke (Playwright) - window.WorldServerSentry + ingest (hard)
        run: npx playwright test e2e/sentry-smoke.spec.js --project=desktop-chromium --retries=2
      - name: AI3D Voxel City autoplay (hard only when impacted)
        if: steps.ai3d-impact.outputs.run == 'true'
        run: npx playwright test e2e/ai3d-voxel-city-autoplay.spec.js --project=desktop-chromium --retries=2
      - name: AI3D Voxel City autoplay skipped for unrelated change
        if: steps.ai3d-impact.outputs.run != 'true'
        run: echo "AI3D Voxel City is not impacted; publication is not blocked by an unrelated world-specific browser test."

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts || npm install
      - name: Build Sentry runtime for LHCI pages
        run: |
          npm run build:sentry
          node scripts/inject-sentry-runtime.js
      - name: Run Lighthouse CI (ubuntu-latest, port 3100, cross-platform no shell quotes)
        run: npx lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn

  agent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check AGENTS.md exists
        run: |
          test -f AGENTS.md || (echo "ERROR: AGENTS.md missing in repo root" && exit 1)
      - name: Check secrets not committed
        run: |
          echo "Scanning for accidental secrets..."
          # .env files must not be tracked (except .env.example)
          if git ls-files | grep -E '^\.env(\.|$)' | grep -v '^\.env\.example$'; then
            echo "ERROR: .env file tracked (should be ignored)"
            exit 1
          fi
          # Hardcoded secret keys outside allowlist
          if grep -R --include="*.js" --include="*.json" --include="*.md" -n "SUPABASE_SECRET_KEY\s*=" . | grep -v ".env.example" | grep -v "AGENTS.md" | grep -v ".github"; then
            echo "ERROR: SUPABASE_SECRET_KEY assignment found in repo"
            exit 1
          fi
          if grep -R --include="*.js" --include="*.ts" -n "sk-[a-zA-Z0-9]\{20\}" .; then
            echo "ERROR: possible API key pattern found"
            exit 1
          fi
          echo "Secrets check passed"
      - name: Validate branch and PR rules (informational)
        run: |
          echo "Branch: $GITHUB_REF_NAME, Event: $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR base: ${{ github.base_ref }}, head: ${{ github.head_ref }}"
            if [ "${{ github.base_ref }}" != "master" ]; then
              echo "WARNING: PR target is not master (expected master)"
            fi
            if [ "${{ github.head_ref }}" = "master" ]; then
              echo "ERROR: PR from master branch is forbidden"
              exit 1
            fi
          fi
          if [ "$GITHUB_REF_NAME" = "master" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "NOTICE: direct push to master detected — protect master with branch protection rule (Require pull request)"
          fi
          echo "Branch/PR check done"
