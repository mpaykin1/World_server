name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI3D worker Python deps (needed for CPU tests)
        run: pip install pillow numpy requests
      - run: npm ci --ignore-scripts || npm install
      - name: Sentry build + static invariants (hard)
        run: |
          npm run build:sentry
          node scripts/inject-sentry-runtime.js
          node scripts/check-sentry-runtime.js
      - run: npm run check
      - run: python -m py_compile services/ai3d-worker/server.py services/ai3d-worker/ai3d/*.py services/ai3d-worker/ai3d/plugins/*.py services/ai3d-worker/tools/*.py services/ai3d-worker/scripts/e2e-smoke.py
      - name: AI3D discovery smoke
        run: node scripts/discover-ai3d-engines.js && test -f services/ai3d-worker/third_party/local-inventory.json
      - name: AI3D E2E smoke (image->job->engine->artifact->validation, 100% via CPU volumetric)
        run: python services/ai3d-worker/scripts/e2e-smoke.py
      - name: AI3D evidence gate (hard)
        run: python scripts/check-ai3d-claims.py
      - name: AI3D final delivery policy (hard)
        run: node scripts/check-ai3d-delivery-policy.js
      - name: AI3D V4 combined integration (hard)
        run: node scripts/check-ai3d-v4-combined.js
      - name: WORLD SERVER Golden Standard source/release gate (hard)
        run: npm run release:gate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Sentry runtime smoke (Playwright) - window.WorldServerSentry + ingest (hard)
        run: npx playwright test e2e/sentry-smoke.spec.js --project=desktop-chromium
      - name: AI3D Voxel City autoplay (Playwright) ai3d-voxel-city-autoplay (hard)
        run: npx playwright test

  agent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check AGENTS.md exists
        run: |
          test -f AGENTS.md || (echo "ERROR: AGENTS.md missing in repo root" && exit 1)
      - name: Check secrets not committed
        run: |
          echo "Scanning for accidental secrets..."
          # .env files must not be tracked (except .env.example)
          if git ls-files | grep -E '^\.env(\.|$)' | grep -v '^\.env\.example$'; then
            echo "ERROR: .env file tracked (should be ignored)"
            exit 1
          fi
          # Hardcoded secret keys outside allowlist
          if grep -R --include="*.js" --include="*.json" --include="*.md" -n "SUPABASE_SECRET_KEY\s*=" . | grep -v ".env.example" | grep -v "AGENTS.md" | grep -v ".github"; then
            echo "ERROR: SUPABASE_SECRET_KEY assignment found in repo"
            exit 1
          fi
          if grep -R --include="*.js" --include="*.ts" -n "sk-[a-zA-Z0-9]\{20\}" .; then
            echo "ERROR: possible API key pattern found"
            exit 1
          fi
          echo "Secrets check passed"
      - name: Validate branch and PR rules (informational)
        run: |
          echo "Branch: $GITHUB_REF_NAME, Event: $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR base: ${{ github.base_ref }}, head: ${{ github.head_ref }}"
            if [ "${{ github.base_ref }}" != "master" ]; then
              echo "WARNING: PR target is not master (expected master)"
            fi
            if [ "${{ github.head_ref }}" = "master" ]; then
              echo "ERROR: PR from master branch is forbidden"
              exit 1
            fi
          fi
          if [ "$GITHUB_REF_NAME" = "master" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "NOTICE: direct push to master detected — protect master with branch protection rule (Require pull request)"
          fi
          echo "Branch/PR check done"
