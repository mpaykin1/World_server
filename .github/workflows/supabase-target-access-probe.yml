name: Supabase target access probe

# Read-only credential smoke test scoped to existing migration branch.
# Never echo tokens, database contents, or API error bodies.
on:
  push:
    branches:
      - ai/supabase-owned-migration-20261016
    paths:
      - .github/workflows/supabase-target-access-probe.yml
      - lib/supabase-migration-postgres.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-management-access:
    name: Target management access (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TARGET_PROJECT_REF: xlcdnlsyvxqtopmkweiy
      TARGET_ORGANIZATION_ID: ayoxcnfmwbpmvwhdeljs
    steps:
      - name: Checkout migration probe library
        uses: actions/checkout@v4

      - name: Check GitHub secret is configured (value never printed)
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is configured (value withheld)."

      - name: Verify existing target project via Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/supabase-target-project.json"
          status="$(curl --silent --show-error --max-time 25 --retry 1 \
            --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}")"
          if [ "$status" != 200 ]; then
            echo "::error::Target project management API returned HTTP $status (response intentionally withheld)."
            exit 1
          fi
          python3 - "$response" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              project = json.load(handle)
          expected_ref = os.environ["TARGET_PROJECT_REF"]
          expected_org = os.environ["TARGET_ORGANIZATION_ID"]
          if project.get("id", project.get("ref")) != expected_ref:
              print("::error::Target project ref mismatch")
              sys.exit(1)
          actual_org = project.get("organization_id")
          if not actual_org and isinstance(project.get("organization"), dict):
              actual_org = project["organization"].get("id")
          print("Target project name:", project.get("name", "UNKNOWN"))
          print("Target organization ID:", actual_org if actual_org else "NOT_RETURNED")
          if actual_org and actual_org != expected_org:
              print("::error::Target organization mismatch; stopping to prevent wrong-target operation")
              sys.exit(1)
          if not actual_org:
              print("::warning::Management API did not return an organization ID; project ref confirmed.")
          print("PASS: Authenticated read-only management query for expected TARGET.")
          print("TARGET ref:", expected_ref)
          print("Organization matches expected org.")
          print("Target status:", project.get("status", "UNKNOWN"))
          PY

      - name: Query TARGET database catalog via Supabase read-only Management API
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/target-read-only-query.json"
          response="$RUNNER_TEMP/target-read-only-result.json"
          python3 - "$request" <<'PY'
          import json, sys
          query = ("SELECT count(*)::integer AS public_tables "
                   "FROM pg_catalog.pg_tables WHERE schemaname = 'public'")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"query": query}, handle)
          PY
          status="$(curl --silent --show-error --max-time 30 --retry 1 \
            --output "$response" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$request" \
            "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}/database/query/read-only")"
          if [ "$status" != 200 ] && [ "$status" != 201 ]; then
            echo "::error::Target read-only SQL API returned HTTP $status (response intentionally withheld)."
            exit 1
          fi
          python3 - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          rows = data if isinstance(data, list) else data.get("data", data.get("result", []))
          if not isinstance(rows, list) or not rows or not isinstance(rows[0], dict):
              print("::error::Unexpected read-only SQL response structure")
              sys.exit(1)
          tables = rows[0].get("public_tables")
          if not isinstance(tables, int) or tables < 0:
              print("::error::Target catalog count is invalid")
              sys.exit(1)
          print("PASS: TARGET read-only SQL catalog query completed.")
          print("TARGET public tables:", tables)
          PY

      - name: Check full-backup connection prerequisites (presence only)
        shell: bash
        env:
          SOURCE_DB_URL: ${{ secrets.WS_SOURCE_DATABASE_URL }}
          TARGET_DB_URL: ${{ secrets.WS_TARGET_DATABASE_URL }}
        run: |
          if [ -n "$SOURCE_DB_URL" ]; then
            echo "SOURCE_DB_URL: CONFIGURED (connectivity not yet verified)"
          else
            echo "::warning::SOURCE_DB_URL: MISSING; full SOURCE pg_dump not possible with current workflow."
          fi
          if [ -n "$TARGET_DB_URL" ]; then
            echo "TARGET_DB_URL: CONFIGURED (connectivity not yet verified)"
          else
            echo "::warning::TARGET_DB_URL: MISSING; full TARGET pg_dump/restore not possible with current workflow."
          fi
          echo "No connection string values are printed or used."

      - name: Trust official Supabase database root CA for native client
        shell: bash
        run: |
          set -euo pipefail
          ca_file="$RUNNER_TEMP/supabase-prod-ca-2021.crt"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt" \
            --output "$ca_file"
          openssl x509 -in "$ca_file" -noout >/dev/null
          subject="$(openssl x509 -in "$ca_file" -subject -noout)"
          if [[ "$subject" != *"Supabase Root 2021 CA"* ]]; then
            echo "::error::Downloaded certificate did not identify Supabase Root 2021 CA"
            exit 1
          fi
          echo "WS_PG_SSLROOTCERT=$ca_file" >> "$GITHUB_ENV"
          echo "Official Supabase CA available for PostgreSQL verify-full."

      - name: Verify native TARGET PostgreSQL session with TLS and read-only SQL
        shell: bash
        env:
          WS_TARGET_DATABASE_URL: ${{ secrets.WS_TARGET_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$WS_TARGET_DATABASE_URL" ]; then
            echo "::error::WS_TARGET_DATABASE_URL missing. No native PostgreSQL test was performed."
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::psql client is not installed on runner."
            exit 1
          fi
          # Reuse the migration library's target-identity guard, TLS verify-full,
          # read-only session configuration, and suppressed database diagnostics.
          node <<'NODE'
          try {
            const pg = require('./lib/supabase-migration-postgres.cjs');
            const conn = pg.connection('target');
            const result = pg.readSql(conn, [
              "SELECT json_build_object('database', current_database(), 'server_version', current_setting('server_version_num')::integer, 'public_tables', (SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public'))"
            ]).trim();
            const resultObject = JSON.parse(result);
            if (resultObject.database !== 'postgres' || !Number.isInteger(resultObject.public_tables)) {
              throw new Error('Unexpected target database identity or table count');
            }
            console.log('PASS: Native TARGET PostgreSQL session over verified TLS, read-only SQL');
            console.log('TARGET public tables:', resultObject.public_tables);
            console.log('PostgreSQL server major:', Math.floor(resultObject.server_version / 10000));
            console.log('No database changes performed.');
          } catch (error) {
            let classification = 'UNCLASSIFIED';
            if (/missing or invalid|must identify|does not attest|ambiguous connection/.test(String(error.message))) {
              classification = 'INVALID_CONNECTION_CONFIGURATION';
            } else {
              // Classify a second read-only connection without printing stderr,
              // whose diagnostics may contain hostnames and credentials.
              try {
                const { spawnSync } = require('node:child_process');
                const pg = require('./lib/supabase-migration-postgres.cjs');
                const conn = pg.connection('target');
                const result = spawnSync('psql', ['-X', '--no-psqlrc', '-q', '-t', '-A', '-v', 'ON_ERROR_STOP=1', '-c', 'SELECT 1'], {
                  env: pg.pgEnvironment(conn), encoding: 'utf8', timeout: 20000
                });
                const detail = String(result.stderr || '');
                if (/password authentication failed|authentication failed/i.test(detail)) classification = 'PASSWORD_REJECTED';
                else if (/no password supplied|fe_sendauth/i.test(detail)) classification = 'PASSWORD_MISSING';
                else if (/certificate.*does not match|hostname mismatch|does not match host name/i.test(detail)) classification = 'TLS_HOSTNAME_MISMATCH';
                else if (/root certificate file|could not load root certificate|could not read root certificate/i.test(detail)) classification = 'TLS_ROOT_CERT_FILE';
                else if (/certificate has expired|certificate expired/i.test(detail)) classification = 'TLS_CERTIFICATE_EXPIRED';
                else if (/certificate verify failed|self-signed certificate|unable to get local issuer certificate|certificate chain/i.test(detail)) classification = 'TLS_CERTIFICATE_TRUST';
                else if (/SSL error|SSL SYSCALL|TLS alert|handshake failure/i.test(detail)) classification = 'TLS_PROTOCOL_OR_HANDSHAKE';
                else if (/unsupported startup parameter|unsupported parameter|unsupported option/i.test(detail)) classification = 'POOLER_STARTUP_OPTIONS';
                else if (/could not translate host|Name or service not known|Temporary failure in name resolution/i.test(detail)) classification = 'DNS';
                else if (/timeout expired|timed out|ETIMEDOUT/i.test(detail) || result.error?.code === 'ETIMEDOUT') classification = 'NETWORK_TIMEOUT';
                else if (/Network is unreachable|Connection refused|No route to host/i.test(detail)) classification = 'NETWORK_UNREACHABLE';
                else if (/role .* does not exist|database .* does not exist/i.test(detail)) classification = 'DATABASE_IDENTITY';
                else if (result.status === 0) classification = 'SECONDARY_PSQL_CONNECTION_OK_READSQL_FAILED';
                else if (result.error?.code === 'ENOENT') classification = 'PSQL_MISSING';
              } catch (_) {
                classification = 'DIAGNOSTIC_UNAVAILABLE';
              }
            }
            console.log('Native target connection failure category:', classification);
            console.error('::error::Native TARGET PostgreSQL read-only connection failed; credentials and raw errors withheld.');
            process.exitCode = 1;
          }
          NODE

      - name: Record safe verification summary
        if: always()
        shell: bash
        run: |
          echo "Scope: management access check only. No pg_dump, restore, migration, deletion or cutover performed."
          echo "OWNER_VERDICT_PENDING / NO_CUTOVER."
