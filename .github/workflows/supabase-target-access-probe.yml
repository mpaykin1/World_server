name: Supabase target access probe

# Read-only credential smoke test scoped to existing migration branch.
# Never echo tokens, database contents, or API error bodies.
on:
  push:
    branches:
      - ai/supabase-owned-migration-20261016
    paths:
      - .github/workflows/supabase-target-access-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-management-access:
    name: Target management access (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TARGET_PROJECT_REF: xlcdnlsyvxqtopmkweiy
      TARGET_ORGANIZATION_ID: ayoxcnfmwbpmwwhdeljs
    steps:
      - name: Check GitHub secret is configured (value never printed)
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is configured (value withheld)."

      - name: Verify existing target project via Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/supabase-target-project.json"
          status="$(curl --silent --show-error --max-time 25 --retry 1 \
            --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${TARGET_PROJECT_REF}")"
          if [ "$status" != 200 ]; then
            echo "::error::Target project management API returned HTTP $status (response intentionally withheld)."
            exit 1
          fi
          python3 - "$response" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              project = json.load(handle)
          expected_ref = os.environ["TARGET_PROJECT_REF"]
          expected_org = os.environ["TARGET_ORGANIZATION_ID"]
          if project.get("id", project.get("ref")) != expected_ref:
              print("::error::Target project ref mismatch")
              sys.exit(1)
          if project.get("organization_id") != expected_org:
              print("::error::Target organization mismatch")
              sys.exit(1)
          print("PASS: Authenticated read-only management query for expected TARGET.")
          print("TARGET ref:", expected_ref)
          print("Organization matches expected org.")
          print("Target status:", project.get("status", "UNKNOWN"))
          PY

      - name: Record safe verification summary
        if: always()
        shell: bash
        run: |
          echo "Scope: management access check only. No pg_dump, restore, migration, deletion or cutover performed."
          echo "OWNER_VERDICT_PENDING / NO_CUTOVER."
