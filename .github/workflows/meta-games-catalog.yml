name: META GAMES catalog validation
on:
  pull_request:
    paths:
      - 'architecture/meta-games-platform/**'
      - '.github/workflows/meta-games-catalog.yml'
  push:
    branches: [master]
    paths:
      - 'architecture/meta-games-platform/**'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node architecture/meta-games-platform/catalog.mjs validate
      - run: node architecture/meta-games-platform/catalog.mjs games
      - name: Enforce exact audited license subset
        run: |
          node --input-type=module -e "
            import {listAssets} from './architecture/meta-games-platform/catalog.mjs';
            const assets = listAssets();
            const expected=['observer-mobile-input','observer-story'];
            if(JSON.stringify(assets.map(x=>x.id).sort())!==JSON.stringify(expected) ||
                assets.some(x=>x.license_id!=='LicenseRef-Owner-Grant-META-GAMES-2026-11-06'))
              process.exit(1);
          "
