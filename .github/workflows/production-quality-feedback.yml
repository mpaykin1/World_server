name: Production Quality Feedback

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull real production quality evidence
        id: prod
        continue-on-error: true
        env:
          QUALITY_BASE_URL: https://world-server.mmmpaykin.workers.dev
          QUALITY_FRESH_HOURS: 6
        run: node scripts/production-quality-pull.js
      - name: Classify production quality verdict
        id: verdict
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let verdict = 'FATAL';
          try {
            verdict = JSON.parse(fs.readFileSync('PRODUCTION_QUALITY_REPORT.json', 'utf8')).verdict || verdict;
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'verdict=' + verdict + '\n');
          console.log('[PRODUCTION_QUALITY] workflow verdict=' + verdict);
          NODE
      - name: Warn when fresh production evidence is unavailable
        if: steps.verdict.outputs.verdict == 'INCONCLUSIVE'
        run: echo "::warning::No fresh production sessions in the current evidence window; this is not classified as a regression."
      - name: Open/update production quality blocker
        if: steps.verdict.outputs.verdict == 'BLOCK' || steps.verdict.outputs.verdict == 'FATAL'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Production quality regression detected"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          BODY="The scheduled production-feedback gate found a runtime quality violation. Inspect the workflow artifact/log and PRODUCTION_QUALITY_REPORT.json. Do not raise the quality baseline until this is resolved."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1
      - name: Close recovered production quality blocker
        if: steps.verdict.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Production quality regression detected"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Production quality feedback recovered on Cloudflare production; the latest evidence window is PASS."
            gh issue close "$EXISTING" --reason completed
          fi
