name: Golden World Fleet Gate

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'shared/**'
      - 'e2e/golden-world-fleet.spec.js'
      - 'e2e/autodemo-capabilities.spec.js'
      - '.github/workflows/golden-world-fleet.yml'
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'shared/**'
      - 'e2e/golden-world-fleet.spec.js'
      - 'e2e/autodemo-capabilities.spec.js'
      - '.github/workflows/golden-world-fleet.yml'

permissions:
  contents: read

jobs:
  all-world-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install render browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify every playable world on four representative profiles
        id: render
        continue-on-error: true
        run: >-
          npx playwright test e2e/golden-world-fleet.spec.js
          --project=desktop-chromium
          --project=mobile-chromium
          --project=mobile-webkit
          --project=tablet-chromium
          --project=mobile-webkit
          --project=tablet-chromium
      - name: Verify canonical AutoDemo capabilities on desktop and mobile
        run: >-
          npx playwright test e2e/autodemo-capabilities.spec.js
          --project=desktop-chromium
          --project=mobile-chromium
      - name: Measure visible Golden technology
        continue-on-error: true
        env:
          GOLDEN_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: golden-world-fleet-evidence.json
        run: >-
          npx playwright test e2e/golden-painting-visibility.spec.js
          --project=desktop-chromium
          --project=mobile-chromium
          --project=mobile-webkit
          --project=tablet-chromium
          --reporter=line,json
      - name: Enforce machine-readable visibility floor
        id: visibility_floor
        continue-on-error: true
        env:
          GOLDEN_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/summarize-golden-visibility.cjs
      - name: Retain exact-SHA visibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-visibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            golden-world-fleet-evidence.json
            golden-world-fleet-evidence-summary.json
          if-no-files-found: error
      - name: Enforce render and visibility gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.render.outcome }}" = success
          test "${{ steps.visibility_floor.outcome }}" = success
