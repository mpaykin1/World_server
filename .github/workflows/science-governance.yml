name: Science 100 Governance

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  science-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Science 100 / VNO policy integrity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function fail(message) {
            console.error(`SCIENCE VNO FAIL: ${message}`);
            process.exitCode = 1;
          }

          for (const file of ['AI_START_HERE.md', '.ai/project-context-index.json', 'SCIENCE_STANDARD.md', '.ai/science-governance.json', '.ai/vno-cycle.json', '.ai/vno-scoring.json', 'data/vno-gameplay-systems.json', 'scripts/check-vno-cycle.js', 'scripts/check-vno-scoring.js', 'scripts/check-ai-context-discovery.js', 'AGENTS.md']) {
            if (!fs.existsSync(file)) fail(`${file} is required`);
          }
          if (process.exitCode) process.exit(process.exitCode);

          const policy = JSON.parse(fs.readFileSync('.ai/science-governance.json', 'utf8'));
          const standard = fs.readFileSync('SCIENCE_STANDARD.md', 'utf8');
          const agents = fs.readFileSync('AGENTS.md', 'utf8');
          const vno = JSON.parse(fs.readFileSync('.ai/vno-cycle.json', 'utf8'));

          if (policy.target !== 100) fail('global target must remain 100');
          if (policy.acronym !== 'ВНО' || vno.acronym !== 'ВНО') fail('canonical principle name must remain ВНО');
          if (policy.scoreAggregation !== 'minimum') fail('readiness must use non-compensating minimum aggregation');
          if (!String(policy.formula || '').includes('min(REPRODUCIBILITY, INDEPENDENCE, FALSIFICATION)')) {
            fail('canonical readiness formula is missing or changed');
          }

          for (const pillar of ['reproducibility', 'independence', 'falsification']) {
            if (!policy.pillars?.[pillar]) fail(`missing pillar: ${pillar}`);
            if (policy.pillars?.[pillar]?.target !== 100) fail(`${pillar} target must remain 100`);
            if (!Array.isArray(policy.pillars?.[pillar]?.requirements) || policy.pillars[pillar].requirements.length < 5) {
              fail(`${pillar} requirements are unexpectedly weak`);
            }
          }

          const hard = policy.hardRules || {};
          if (hard.preserveNegativeResults !== true) fail('negative results must be preserved');
          if (hard.allowThresholdChangesAfterHoldout !== false) fail('post-holdout threshold changes must remain forbidden');
          if (hard.allowSelfCertificationAsFinalEvidence !== false) fail('self-certification cannot become final evidence');
          if (hard.allowCodePassToMeanRealWorldLaw !== false) fail('code PASS cannot equal a real-world law');
          if (hard.requireExplicitPercentMeaning !== true) fail('scientific percentages must keep explicit meanings');
          if (hard.preferTestMostLikelyToDisproveStrongestClaim !== true) fail('falsification-first next-step rule must remain enabled');
          if (hard.nextTaskOptimizesWeakestPillar !== true) fail('weakest-pillar optimization must remain enabled');
          if (hard.evaluateEveryCanonicalGameplaySystem !== true) fail('every canonical gameplay system must be evaluated');
          if (hard.allowHonestNotApplicable !== true) fail('honest NOT_APPLICABLE must remain allowed');
          if (hard.allowOneSystemToCertifyAnother !== false) fail('one gameplay system cannot certify another');
          if (hard.requireAge5UserExplanation !== true) fail('age-5 user communication must remain mandatory');
          if (hard.requireMethodImprovementBeforeNextLoop !== true || hard.requireLoopBackToDiscovery !== true) fail('VNO must improve method and loop back to discovery');
          if (hard.cloudFirst !== true || hard.reuseExistingOrchestration !== true) fail('VNO must stay cloud-first and reuse existing orchestration');
          if (hard.desktopClutterAllowed !== false || hard.computerSlowdownAllowed !== false) fail('desktop clutter/slowdown must remain forbidden');

          const levels = Object.keys(policy.evidenceLevels || {});
          if (levels.join(',') !== 'D0,D1,D2,D3,D4,D5,D6,D7') fail('D0-D7 evidence ladder must remain complete');

          const lifecycle = policy.lifecycle || [];
          for (const required of ['DISCOVERY', 'PREREGISTRATION', 'FREEZE', 'BLIND_HOLDOUT', 'RED_TEAM', 'INDEPENDENT_REIMPLEMENTATION', 'REPLICATION', 'CONFIRMATION']) {
            if (!lifecycle.includes(required)) fail(`lifecycle stage missing: ${required}`);
          }

          const vnoLoop = policy.vnoGameplayLoop || [];
          for (const required of ['TAKE_DISCOVERY', 'DEVELOP_NEXT_HYPOTHESIS', 'TRANSLATE_TO_GAMEPLAY', 'PROVE_IN_CODE', 'MAXIMIZE_VNO', 'IMPROVE_THE_METHOD', 'LOOP_AGAIN']) {
            if (!vnoLoop.includes(required)) fail(`VNO gameplay loop stage missing: ${required}`);
          }

          const percentFields = new Set(policy.requiredScientificPercentFields || []);
          for (const field of ['CODE_EXPERIMENT_CONFIRMATION', 'REPRODUCIBILITY', 'INDEPENDENCE', 'FALSIFICATION', 'SCIENCE_READINESS', 'EVIDENCE_LEVEL']) {
            if (!percentFields.has(field)) fail(`required reporting field missing: ${field}`);
          }

          for (const token of [
            'SCIENCE_READINESS = min(REPRODUCIBILITY, INDEPENDENCE, FALSIFICATION)',
            'Independent implementation',
            'True blind protocol',
            'Red Team Scientist',
            'Adversarial tests',
            'Negative results are evidence',
            'D0 — Idea',
            'D7 — External scientific evidence'
          ]) {
            if (!standard.includes(token)) fail(`canonical standard lost required rule: ${token}`);
          }

          for (const token of [
            'SCIENCE_STANDARD.md',
            '.ai/science-governance.json',
            '100% reproducibility + 100% independence + 100% falsification',
            'BLIND_HOLDOUT',
            'RED_TEAM',
            'INDEPENDENT_REIMPLEMENTATION'
          ]) {
            if (!agents.includes(token)) fail(`AGENTS.md no longer mandates scientific integrity token: ${token}`);
          }

          if (!process.exitCode) {
            console.log('SCIENCE VNO PASS: reproducibility, independence, falsification and the gameplay loop are intact.');
          }
          NODE

      - name: Validate seven-step VNO gameplay loop
        run: node scripts/check-vno-cycle.js

      - name: Validate anti-gaming VNO scoring
        run: node scripts/check-vno-scoring.js

      - name: Validate universal AI context discovery
        run: node scripts/check-ai-context-discovery.js

      - name: Reject explicit code-PASS-as-real-world-proof claims
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['SCIENCE_STANDARD.md', 'AGENTS.md', '.ai/science-governance.json', '.ai/vno-cycle.json', '.ai/vno-scoring.json'];
          const forbidden = [
            /pass:true\s+(proves|is\s+proof|is\s+scientifically\s+proven)/i,
            /pass:true.{0,40}means.{0,40}(real[- ]world|law)/i,
            /100%\s+scientifically\s+proven.{0,50}because.{0,50}pass:true/i
          ];
          let failed = false;
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            for (const pattern of forbidden) {
              if (pattern.test(text)) {
                console.error(`SCIENCE VNO FAIL: ${file} contains an explicit code-PASS-as-real-world-proof claim matching ${pattern}`);
                failed = true;
              }
            }
          }
          if (failed) process.exit(1);
          console.log('Scientific claim wording guard passed');
          NODE
