name: Manual Fast Lane Minecraft Link

on:
  push:
    branches:
      - ai/chatgpt/minecraft-prokopiy-import-20261003
  workflow_dispatch:

concurrency:
  group: manual-fast-lane-minecraft-link
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Fail closed if Cloudflare authority is missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy stable exact-head manual worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          export WORKERS_CI_COMMIT_SHA="$SOURCE_SHA"
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));x.triggers={crons:[]};fs.writeFileSync('.wrangler-preview.jsonc',JSON.stringify(x,null,2));"
          OUTPUT="$(npm run deploy:cloudflare:production -- --name world-server-pr-manual --config .wrangler-preview.jsonc)"
          printf '%s\n' "$OUTPUT"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.(workers|pages)\.dev' | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Wait for exact-head activation
        run: node scripts/wait-for-cloudflare-deploy.cjs "${{ steps.deploy.outputs.url }}" "$SOURCE_SHA"
      - name: Verify Cloudflare identity
        run: node scripts/verify-cloudflare-stack.cjs "${{ steps.deploy.outputs.url }}" "$SOURCE_SHA"
      - name: Inspect Golden inventory endpoint
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base = process.env.BASE_URL;
          const response = await fetch(base + '/api/apps?all=1');
          const text = await response.text();
          console.log('inventory-http=' + response.status);
          console.log(text.slice(0, 8000));
          if (!response.ok) process.exit(2);
          const data = JSON.parse(text);
          const ids = Array.isArray(data.inventory) ? data.inventory.map(x => x.id) : [];
          console.log('inventory-ids=' + JSON.stringify(ids));
          if (!ids.includes('prokopiy-minecraft-mvp')) process.exit(3);
          NODE
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
      - name: Install browser verification runtimes
        run: npx playwright install --with-deps chromium
      - name: Verify generic Minecraft delivery
        run: npm run delivery:verify -- "${{ steps.deploy.outputs.url }}/apps/prokopiy-minecraft-mvp/" --expected-sha="$SOURCE_SHA" --game --ready-global=ProkopiyMinecraftMVP --inventory-id=prokopiy-minecraft-mvp
      - name: Verify Minecraft gameplay acceptance
        run: node scripts/verify-prokopiy-minecraft-successor.cjs "${{ steps.deploy.outputs.url }}/apps/prokopiy-minecraft-mvp/"
