name: Quality Auto-Fix PR

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Apply deterministic safe fixes
        run: node scripts/quality-autofix.js --apply
      # Only files the auto-fix actually changed make a PR. The release gate below rewrites
      # dozens of report JSONs on every run; committing those opened a report-only PR every
      # day (#483 … #504, all with `changes: []`), and each one had to be closed by hand.
      - name: Detect real fixes
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          node -e "const r=require('./AUTOFIX_REPORT.json');const files=[...new Set((r.changes||[]).filter(c=>c.applied).map(c=>c.file))];require('fs').writeFileSync(process.env.RUNNER_TEMP+'/autofix-files.txt',files.map(f=>f+'\n').join(''));console.log('[AUTOFIX] fixed files: '+files.length);"
          if [ -s "$RUNNER_TEMP/autofix-files.txt" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify candidate
        run: |
          npm run release:gate
          node --test test/quality-regression.test.js test/golden-physics.test.js test/quality-growth.test.js
      - name: Create quality branch and PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="ai/quality-autofix/${GITHUB_RUN_ID}"
          git config user.name "world-server-quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          xargs -a "$RUNNER_TEMP/autofix-files.txt" -d '\n' git add --
          git commit -m "fix(quality): deterministic regression auto-fixes"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "fix(quality): automated safe regression fixes" \
            --body "Generated by Quality Auto-Fix. Only files changed by data/autofix-recipes.json are included; all deterministic release gates passed before this PR was opened."
