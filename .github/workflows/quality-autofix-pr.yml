name: Quality Auto-Fix PR

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'

concurrency:
  group: world-server-shared-pr-writer
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admission — no new bot tail when five PRs are already open
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length')"
          if [ "$COUNT" -ge 5 ]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "PR budget full ($COUNT); no new auto-fix PR"
          else
            echo "admitted=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.admit.outputs.admitted == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.admit.outputs.admitted == 'true'
      - name: Install Python test dependencies
        if: steps.admit.outputs.admitted == 'true'
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Apply deterministic safe fixes
        if: steps.admit.outputs.admitted == 'true'
        run: node scripts/quality-autofix.js --apply
      - name: Admit only actual source patches, not JSON report churn
        id: patch
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('AUTOFIX_REPORT.json', 'utf8'));
          if (!Array.isArray(report.changes) || !Array.isArray(report.errors) || report.errors.length) {
            throw Error('Malformed or failing auto-fix report');
          }
          const files = [...new Set(report.changes.filter(item => item.applied === true)
            .map(item => item.file).filter(file => typeof file === 'string'
              && /^(apps|test|e2e)\/[A-Za-z0-9._/-]+$/.test(file)
              && !file.split('/').includes('..')))];
          fs.writeFileSync(process.env.RUNNER_TEMP + '/autofix-source-paths.txt',
            files.join('\n') + (files.length ? '\n' : ''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'changed=' + (files.length ? 'true' : 'false') + '\n');
          console.log('Source fixes:', files.length, '; auto-generated reports are excluded');
          NODE
      - name: Verify candidate source fix
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm run release:gate
          node --test test/quality-regression.test.js test/golden-physics.test.js test/quality-growth.test.js
      - name: Commit only fixed source and create a single PR
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length')"
          if [ "$COUNT" -ge 5 ]; then
            echo "::error::PR budget exhausted before write; no branch created"
            exit 73
          fi
          mapfile -t FIXED < "${RUNNER_TEMP}/autofix-source-paths.txt"
          test "${#FIXED[@]}" -gt 0
          git add -- "${FIXED[@]}"
          if git diff --cached --quiet; then
            echo "::error::Report claimed a change, but no source diff was staged"
            exit 73
          fi
          BRANCH="ai/quality-autofix/${GITHUB_RUN_ID}"
          git config user.name "world-server-quality-bot"
          git config user.email "quality-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "fix(quality): deterministic source regression repair"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "fix(quality): deterministic source repair" \
            --body "Generated by Quality Auto-Fix. Actual source files only; candidate release gate passed."
