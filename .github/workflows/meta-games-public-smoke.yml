name: META GAMES public HTTPS smoke
on:
  pull_request:
    paths:
      - '.github/workflows/meta-games-public-smoke.yml'
      - 'architecture/meta-games-platform/mcp/live-smoke.mjs'
      - 'architecture/meta-games-platform/mcp/worker.mjs'
      - 'architecture/meta-games-platform/ASSET_INDEX.json'
      - 'architecture/meta-games-platform/STATE.json'
  workflow_dispatch:
    inputs:
      verify_netlify_production:
        description: 'Probe production Netlify after confirming its deployment'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
      - ai/chatgpt/meta-games-netlify-20261103
    paths:
      - '.github/workflows/meta-games-public-smoke.yml'
      - 'architecture/meta-games-platform/mcp/live-smoke.mjs'
      - 'architecture/meta-games-platform/mcp/render-server.mjs'
      - 'architecture/meta-games-platform/mcp/worker.mjs'
      - 'architecture/meta-games-platform/ASSET_INDEX.json'
      - 'architecture/meta-games-platform/STATE.json'
      - 'netlify/functions/meta-games-mcp.mts'
      - 'netlify/functions/meta-games-health.mts'
jobs:
  live:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Render against the last MCP-relevant master commit
        env:
          META_GAMES_EXPECTED_REF: ${{ github.event_name == 'pull_request' && 'origin/master' || 'HEAD' }}
        run: node architecture/meta-games-platform/mcp/live-smoke.mjs
      - name: Verify production Netlify HTTPS after merge
        if: github.event_name == 'workflow_dispatch' && inputs.verify_netlify_production
        env:
          META_GAMES_MCP_BASE: https://world-server.netlify.app
        run: node architecture/meta-games-platform/mcp/live-smoke.mjs
