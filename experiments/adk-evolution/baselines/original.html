<style>
/* Layout concept: a live 3D diorama fills the screen; pixel HUD hugs the corners,
   title and end cards sit low-left like film title cards. Single dark world. */
:root {
  --ink: #120d1c;
  --ink-soft: rgba(18, 13, 28, .72);
  --paper: #f8eec8;
  --paper-dim: rgba(248, 238, 200, .62);
  --gold: #ffd246;
  --gold-deep: #8a4a16;
  --ember: #ff8a3d;
  --rose: #df3a40;
  --shade: #ff4fd8;
  --font-display: "Pixelify Sans", "Lucida Console", "Courier New", monospace;
  --font-ui: "Pixelify Sans", "Lucida Console", "Courier New", monospace;
  --hud-pad-t: max(14px, env(safe-area-inset-top, 0px));
  --hud-pad-r: max(16px, env(safe-area-inset-right, 0px));
  --hud-pad-b: max(14px, env(safe-area-inset-bottom, 0px));
  --hud-pad-l: max(16px, env(safe-area-inset-left, 0px));
  --px: 3;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); }
body { margin: 0; font-family: var(--font-ui); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; background: var(--ink); }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none;
  padding: var(--hud-pad-t) var(--hud-pad-r) var(--hud-pad-b) var(--hud-pad-l); }
.hud-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.hearts { display: flex; gap: 2px; }
.heart { display: block; width: calc(16px * var(--px)); height: calc(16px * var(--px));
  background-image: var(--img-hearts); background-repeat: no-repeat;
  background-size: calc(48px * var(--px)) calc(16px * var(--px)); image-rendering: pixelated;
  filter: drop-shadow(0 3px 0 rgba(18, 13, 28, .55)); }
.heart[data-v="2"] { background-position: 0 0; }
.heart[data-v="1"] { background-position: calc(-16px * var(--px)) 0; }
.heart[data-v="0"] { background-position: calc(-32px * var(--px)) 0; }
.heart.hit { animation: hit .5s steps(2) 1; }
@keyframes hit { 0% { transform: translate(-3px, 2px) } 50% { transform: translate(3px, -2px) } 100% { transform: none } }
.coins { display: flex; align-items: center; gap: 8px; font-size: calc(10px * var(--px)); line-height: 1;
  text-shadow: 0 3px 0 var(--ink); font-variant-numeric: tabular-nums; }
.coins b { font-weight: 700; color: var(--gold); }
.coins span { color: var(--paper-dim); }
.coins.bump b { animation: bump .35s ease-out 1; display: inline-block; }
@keyframes bump { 0% { transform: scale(1.6) } 100% { transform: scale(1) } }
.coin-ico { display: block; width: calc(14px * var(--px)); height: calc(14px * var(--px));
  background-image: var(--img-coin); background-size: calc(56px * var(--px)) calc(14px * var(--px));
  image-rendering: pixelated; animation: spin .55s steps(4) infinite; filter: drop-shadow(0 3px 0 rgba(18, 13, 28, .55)); }
@keyframes spin { to { background-position: calc(-56px * var(--px)) 0; } }
.timer { font-size: calc(7px * var(--px)); color: var(--paper-dim); text-shadow: 0 2px 0 var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.minimap { position: absolute; top: var(--hud-pad-t); right: var(--hud-pad-r); width: 132px; height: 132px;
  image-rendering: pixelated; background: var(--ink); opacity: .92;
  box-shadow: 0 0 0 2px rgba(248, 238, 200, .28), 0 0 0 5px rgba(18, 13, 28, .55); }
.toast { position: absolute; left: 50%; top: 17%; transform: translateX(-50%); max-width: min(92vw, 760px);
  text-align: center; font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 2.8vw, 34px);
  letter-spacing: .03em; text-wrap: balance; color: var(--paper);
  text-shadow: 0 3px 0 var(--ink), 0 0 22px rgba(255, 138, 61, .6); opacity: 0; transition: opacity .6s; }
.toast.show { opacity: 1; animation: flick 1.1s steps(1) 1; }
.toast.warn { color: #ffd6f6; text-shadow: 0 3px 0 var(--ink), 0 0 24px rgba(255, 79, 216, .75); }
@keyframes flick { 0% { opacity: .15 } 7% { opacity: 1 } 11% { opacity: .35 } 16% { opacity: 1 } 58% { opacity: .8 } 62% { opacity: 1 } }

/* ---------- corner tools ---------- */
.tools { position: fixed; right: var(--hud-pad-r); bottom: var(--hud-pad-b); display: flex; gap: 8px; z-index: 6; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; cursor: pointer;
  color: var(--paper); background: var(--ink-soft); border: 0; box-shadow: inset 0 0 0 2px rgba(248, 238, 200, .3); }
.icon-btn:hover { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
.icon-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.icon-btn svg { width: 22px; height: 22px; shape-rendering: crispEdges; }
.icon-btn[aria-pressed="true"] .on { display: none; }
.icon-btn[aria-pressed="false"] .off { display: none; }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: flex-start; gap: 18px; padding: var(--hud-pad-t) var(--hud-pad-r) calc(var(--hud-pad-b) + 64px) var(--hud-pad-l);
  padding-left: max(var(--hud-pad-l), 6vw); background: linear-gradient(to top, rgba(18, 13, 28, .9), rgba(18, 13, 28, .35) 45%, rgba(18, 13, 28, 0) 70%); }
.screen.center { justify-content: center; align-items: center; text-align: center; padding-left: var(--hud-pad-l);
  background: radial-gradient(ellipse at center, rgba(18, 13, 28, .78), rgba(18, 13, 28, .45) 70%); }
.eyebrow { margin: 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--paper-dim); }
.title { margin: 0; display: flex; flex-direction: column; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(48px, 10vw, 132px); line-height: .86; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.title span { color: var(--paper); text-shadow: 0 6px 0 var(--ink); }
.title .dusk { background: linear-gradient(180deg, var(--gold) 0%, var(--ember) 48%, var(--rose) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
  filter: drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 0 26px rgba(255, 138, 61, .45)); animation: glow 5s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 0 40px rgba(255, 79, 216, .45)); } }
.lede { margin: 0; max-width: 34ch; font-size: clamp(17px, 1.6vw, 21px); line-height: 1.4; color: var(--paper); text-shadow: 0 2px 0 var(--ink); }
.row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.btn { pointer-events: auto; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 22px;
  letter-spacing: .04em; padding: 13px 26px 12px; color: var(--ink); background: var(--gold); border: 0;
  box-shadow: 0 5px 0 var(--gold-deep), 0 0 32px rgba(255, 210, 70, .35); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--gold-deep), 0 0 40px rgba(255, 210, 70, .5); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
.btn.ghost { color: var(--paper); background: var(--ink-soft); box-shadow: inset 0 0 0 2px rgba(248, 238, 200, .45); }
.hint { font-size: 15px; color: var(--paper-dim); }
.keys { margin: 4px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, auto)); gap: 8px 22px; font-size: 15px; color: var(--paper-dim); }
.keys div { display: flex; align-items: center; gap: 8px; min-width: 0; }
kbd { font-family: var(--font-ui); font-size: 13px; color: var(--paper); padding: 3px 7px 2px; background: var(--ink-soft);
  box-shadow: inset 0 0 0 2px rgba(248, 238, 200, .3), 0 2px 0 rgba(0, 0, 0, .5); }
.best { margin: 0; font-size: 15px; color: var(--gold); min-height: 1em; }
.card-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 7vw, 92px); line-height: .9;
  text-transform: uppercase; color: var(--gold); text-shadow: 0 6px 0 var(--ink), 0 0 36px rgba(255, 138, 61, .5); }
.card-title.lost { color: #ffd6f6; text-shadow: 0 6px 0 var(--ink), 0 0 36px rgba(255, 79, 216, .55); }
.stats { display: flex; gap: 28px; margin: 6px 0 4px; flex-wrap: wrap; justify-content: center; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 34px; color: var(--paper); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--paper-dim); }

/* ---------- touch ---------- */
.touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
.stick { position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%;
  box-shadow: inset 0 0 0 2px rgba(248, 238, 200, .35); background: rgba(18, 13, 28, .22); opacity: 0; transition: opacity .2s; }
.stick.on { opacity: 1; }
.knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
  background: rgba(248, 238, 200, .5); box-shadow: 0 0 18px rgba(255, 210, 70, .4); }
.jump { position: absolute; right: calc(var(--hud-pad-r) + 4px); bottom: calc(var(--hud-pad-b) + 64px); width: 88px; height: 88px;
  border-radius: 50%; pointer-events: auto; touch-action: none; border: 0; font-family: var(--font-display); font-size: 16px;
  font-weight: 700; color: var(--ink); background: rgba(255, 210, 70, .85); box-shadow: 0 5px 0 var(--gold-deep), 0 0 30px rgba(255, 210, 70, .35); }
.jump:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep); }

.loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--ink);
  font-size: 20px; letter-spacing: .08em; color: var(--paper-dim); transition: opacity 1.2s; }
.loading.gone { opacity: 0; pointer-events: none; }

.screen.center .lede { max-width: 46ch; text-wrap: balance; }
@media (max-width: 720px) {
  :root { --px: 2.25; }
  .timer { display: none; }
  .minimap { width: 92px; height: 92px; }
  .keys { display: none; }
  .hud-row { gap: 14px; }
  .screen { padding-left: var(--hud-pad-l); }
}
@media (pointer: coarse) { .keys { display: none; } }
@media (max-height: 560px) {
  .screen { gap: 10px; padding-bottom: calc(var(--hud-pad-b) + 12px); }
  .title { font-size: clamp(34px, 8vh, 64px); }
  .eyebrow, .keys { display: none; }
  .lede { font-size: 15px; }
  .card-title { font-size: clamp(32px, 10vh, 60px); }
  .stat b { font-size: 24px; }
  .minimap { width: 84px; height: 84px; }
  .jump { width: 76px; height: 76px; bottom: calc(var(--hud-pad-b) + 58px); }
}
@media (prefers-reduced-motion: reduce) {
  .toast.show, .heart.hit, .coins.bump b, .title .dusk { animation: none; }
  .coin-ico { animation-duration: 1.6s; }
}
</style>

<section class="screen" id="scrTitle" hidden>
  <p class="eyebrow">16×16 · 20 монет · 3 сердца</p>

/* -----------------------------------------------------------------------------
   1 · Math kit
----------------------------------------------------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);          // frame-rate independent easing factor
const rr = (a, b) => a + (b - a) * Math.random();
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function makeNoise(rand) {
  const perm = new Uint8Array(512), val = new Float32Array(256), p = [];
  for (let i = 0; i < 256; i++) { p.push(i); val[i] = rand(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const n2 = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = val[perm[perm[X] + Y]], b = val[perm[perm[X + 1] + Y]];
    const c = val[perm[perm[X] + Y + 1]], d = val[perm[perm[X + 1] + Y + 1]];
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
  return (x, y, oct = 4) => {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) { s += amp * n2(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
    return s / norm;
  };
}

/* -----------------------------------------------------------------------------
   2 · World constants
----------------------------------------------------------------------------- */
const W = 64, D = 64, H = 26;          // voxel grid (x, z, y)
const SEA = 3.8;                       // water surface height
const HP_MAX = 6;                      // half-hearts
const BLOCKED = 99;
const B = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, PLANK: 4, SAND: 5, LEAVES: 6, BRICK: 7, BARK: 8 };
const TL = { grass: 0, dirt: 1, stone: 2, wood: 3, sand: 4, leaves: 5, water: 6, brick: 7, grassSide: 8, bark: 9, logTop: 10, stone2: 11 };
const FACE_TILES = [];                  // [top, side, bottom]
FACE_TILES[B.GRASS] = [TL.grass, TL.grassSide, TL.dirt];
FACE_TILES[B.DIRT] = [TL.dirt, TL.dirt, TL.dirt];
FACE_TILES[B.STONE] = [TL.stone, TL.stone2, TL.stone];
FACE_TILES[B.PLANK] = [TL.wood, TL.wood, TL.wood];
FACE_TILES[B.SAND] = [TL.sand, TL.sand, TL.sand];
FACE_TILES[B.LEAVES] = [TL.leaves, TL.leaves, TL.leaves];
FACE_TILES[B.BRICK] = [TL.brick, TL.brick, TL.brick];
FACE_TILES[B.BARK] = [TL.logTop, TL.bark, TL.logTop];
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* -----------------------------------------------------------------------------
   3 · Island generator (deterministic per seed)
----------------------------------------------------------------------------- */
function generateWorld(seed) {
  const rand = mulberry32(seed);
  const fbm = makeNoise(rand);
  const R = (a, b) => a + (b - a) * rand();
  const RI = (a, b) => Math.floor(a + (b - a + 1) * rand());
  const vox = new Uint8Array(W * H * D);
  const at = (x, y, z) => x + W * (z + D * y);
  const ci = (x, z) => x + z * W;
  const inb = (x, z) => x >= 0 && z >= 0 && x < W && z < D;
  const hgt = new Int16Array(W * D), stand = new Int16Array(W * D), kind = new Uint8Array(W * D);
  // kind: 0 free · 1 path · 2 plaza · 5 structure · 6 pier
  const cx = W / 2, cz = D / 2;

  // 1. heightfield: noisy radial island
  const ox = R(0, 300), oz = R(0, 300);
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const nx = (x + 0.5 - cx) / (W * 0.5), nz = (z + 0.5 - cz) / (D * 0.5);
    const d = Math.hypot(nx, nz) + (fbm(x * 0.07 + ox, z * 0.07 + oz, 3) - 0.5) * 0.5;
    const mask = 1 - smooth(0.3, 0.86, d);
    const hills = smooth(0.25, 0.75, fbm(x * 0.055 + oz, z * 0.055 + ox, 4));
    hgt[ci(x, z)] = Math.max(1, Math.round(1 + mask * (0.42 + 0.8 * hills) * 8.4));
  }

  // 2. beacon hill: the highest ground near the centre becomes a paved plaza
  let tx = cx | 0, tz = cz | 0, bestS = -1e9;
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const r = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
    if (r > 8) continue;
    const s = hgt[ci(x, z)] - r * 0.1;
    if (s > bestS) { bestS = s; tx = x; tz = z; }
  }
  const HP = clamp(hgt[ci(tx, tz)], 8, 10);
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const r = Math.hypot(x - tx, z - tz), i = ci(x, z);
    if (r < 3.4) { hgt[i] = HP; kind[i] = 2; }
    else { const hill = HP - 1 - Math.floor((r - 3.4) / 1.4); if (hill > hgt[i]) hgt[i] = hill; }
  }
  // 3. relax: no natural step is taller than one block, so the whole island is walkable
  for (let it = 0; it < 60; it++) {
    let changed = false;
    for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
      const i = ci(x, z);
      const m = Math.min(x > 0 ? hgt[i - 1] : 1, x < W - 1 ? hgt[i + 1] : 1, z > 0 ? hgt[i - W] : 1, z < D - 1 ? hgt[i + W] : 1);
      if (hgt[i] > m + 1) { hgt[i] = m + 1; changed = true; }
    }
    if (!changed) break;
  }

  // 4. spawn: a beach that looks inland toward the beacon
  let sx = -1, sz = -1, bestSp = 1e9;
  for (let z = 3; z < D - 3; z++) for (let x = 3; x < W - 3; x++) {

    let lx = -1, lz = -1;
    for (let s = 0; s < 34; s++) {

      if (h === 4) { lx = x; lz = z; } else if (h <= 2 && lx >= 0) break;

    for (let a = -3; a <= 3 && clear; a++) for (let b = -3; b <= 3; b++) {

    }

  for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) vox[at(tx + a, HP + 8, tz + b)] = B.BRICK;
  vox[at(tx, HP + 8, tz)] = B.STONE;

    for (let k = 1; k < lb; k++) cells.push([x0, z0 + k * dzr]);

      const i = ci(x, z), hh = k === 0 ? 2 : RI(1, 3);
      for (let y = hgt[i]; y < base + hh; y++) vox[at(x, y, z)] = B.STONE;
      underGrassToDirt(x, z);
      stand[i] = base + hh; kind[i] = 5;

    for (let b = -2; b <= 2; b++) for (let a = -2; a <= 2; a++) {

    if (!inb(x, z)) return false;

    return reach[i] > 0 && s >= 4 && s < H - 3 && kind[i] !== 2 && vox[at(x, s + 2, z)] === 0
      && Math.hypot(x - sx, z - sz) > 4.5 && !coins.some(c => c.cx === x && c.cz === z);
  };
  const addCoin = (x, z) => coins.push({ cx: x, cz: z, x: x + 0.5, y: stand[ci(x, z)], z: z + 0.5 });

      let dmin = Math.hypot(c[0] - sx, c[1] - sz) * 0.7;

  for (let n = 0; n < 3; n++) {
    const c = spread(cand.filter(([x, z]) => !coins.some(o => o.cx === x && o.cz === z)), hearts, coins);

  // 14. where shades rise: deep water hugging the coast
  const seaSpots = [];
  for (let z = 2; z < D - 2; z++) for (let x = 2; x < W - 2; x++) {
    if (hgt[ci(x, z)] > 2 || kind[ci(x, z)] === 6) continue;
    let land = false;
    for (let b = -3; b <= 3 && !land; b++) for (let a = -3; a <= 3; a++) if (inb(x + a, z + b) && hgt[ci(x + a, z + b)] >= 4) { land = true; break; }
    if (land) seaSpots.push([x, z]);
  }
  const landCells = [];
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) if (reach[ci(x, z)] && stand[ci(x, z)] >= 4) landCells.push([x, z]);

  return {
    seed, vox, hgt, stand, kind, reach, at, ci, piers, trees, rocks, ruins, seaSpots, landCells, coins, hearts,
    tower: { x: tx, z: tz, base: HP, door },
    beacon: new THREE.Vector3(tx + 0.5, HP + 9, tz + 0.5),
    ring: new THREE.Vector3(tx + 0.5 + door[0] * 2.55, HP, tz + 0.5 + door[1] * 2.55),
    spawn: new THREE.Vector3(sx + 0.5, hgt[ci(sx, sz)], sz + 0.5),

  g.index = base.index;
  g.setAttribute('position', base.attributes.position);
  g.setAttribute('uv', base.attributes.uv);
  const out = {};
  for (const name in attrs) {

    const a = new THREE.InstancedBufferAttribute(arr, size);
    a.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute(name, a); out[name] = a;

  if (G.toastT > 0) { G.toastT -= dt; if (G.toastT <= 0) hud.toast.classList.remove('show'); }
  if (G.state === 'play') {
    G.play += dt;
    G.timerT -= dt;
    if (G.timerT <= 0) { G.timerT = 0.25; hud.timer.textContent = fmtTime(G.play); }
  }
  G.mmT -= dt;
  if (G.mmT <= 0 && !hud.root.hidden) { G.mmT = 0.1; drawMinimap(); }
}

/* -----------------------------------------------------------------------------
   22 · Buttons, mute, fullscreen
----------------------------------------------------------------------------- */
function updateMuteBtn() { $('btnMute').setAttribute('aria-pressed', String(SFX.muted)); }
function toggleMute() {
  SFX.setMuted(!SFX.muted); updateMuteBtn();
  try { localStorage.setItem('isle.muted', SFX.muted ? '1' : '0'); } catch (e) { /* storage may be blocked */ }
}
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      const p = req && req.call(el);
      if (p && p.catch) p.catch(() => {});
    } else {
      const ex = d.exitFullscreen || d.webkitExitFullscreen;
      const p = ex && ex.call(d);
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) { /* fullscreen is optional */ }
}
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('btnFull').hidden = true;
$('btnStart').addEventListener('click', startGame);
$('btnResume').addEventListener('click', () => setPaused(false));
$('btnRestart').addEventListener('click', () => restart(false));
$('btnAgain').addEventListener('click', () => restart(false));
$('btnNew').addEventListener('click', () => restart(true));
$('btnMute').addEventListener('click', () => { SFX.init(); toggleMute(); });
$('btnFull').addEventListener('click', toggleFullscreen);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play') setPaused(true); if (SFX.ctx) SFX.ctx.suspend(); }
  else if (SFX.ctx) SFX.ctx.resume();
});
if (IS_TOUCH) { $('startHint').textContent = 'левый палец — идти, правый — камера'; }

/* -----------------------------------------------------------------------------
   23 · Main loop (delta-time everywhere; nothing is tied to frame count)
----------------------------------------------------------------------------- */
let last = 0, booted = false;
function perfMonitor(dt) {
  if (perf.lock) return;
  perf.acc += dt; perf.frames++;
  if (perf.acc >= 2) {
    const fps = perf.frames / perf.acc; perf.acc = 0; perf.frames = 0;
    let s = perf.scale;
    if (fps < 48 && s > 0.5) s = Math.max(0.5, Math.round((s - 0.1) * 100) / 100);
    else if (fps > 58 && s < 0.9) s = Math.min(0.9, Math.round((s + 0.05) * 100) / 100);
    if (s !== perf.scale) { perf.scale = s; resize(); }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const raw = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016;
  last = now;
  const dt = raw * G.timeScale;
  G.time += raw;
  U.time.value = G.time;
  pollPad();
  glow.update(raw); dust.update(raw);
  if (G.state === 'play' || G.state === 'dead' || G.state === 'victory') updatePlayer(dt);
  if (G.state === 'play') updatePickups(dt);
  else if (coinObj) { syncPickups(coins, coinObj); syncPickups(heartsP, heartObj); }
  if (G.state !== 'paused') updateShades(dt);
  updateFlow(raw);
  updateEnvironment(raw);
  updateBeacon(raw);
  updateCamera(raw);
  updateHeroMesh(raw);
  updateWisp(raw);
  updateLeaves(raw);
  renderShades();
  updatePost(raw);
  updateHUD(raw);
  glow.flush(); dust.flush();
  composer.render(raw);
  perfMonitor(raw);
}
function start(data) {
  if (booted) return;
  booted = true;
  data = data || {};
  try { SFX.muted = localStorage.getItem('isle.muted') === '1'; } catch (e) { /* storage may be blocked */ }
  if (typeof data.muted === 'boolean') SFX.muted = data.muted;
  updateMuteBtn();
  buildWorld(Number.isFinite(data.seed) ? data.seed : DEFAULT_SEED);
  resetRun();
  G.state = 'title';
  const b = world.beacon, a = G.sunAz + 1.0;
  rig.pos.set(b.x + Math.cos(a) * 34, b.y + 5, b.z + Math.sin(a) * 34);
  rig.look.set(b.x, b.y - 4.5, b.z);
  requestAnimationFrame(frame);
  setTimeout(() => {
    loadingEl.classList.add('gone');
    $('scrTitle').hidden = false;
    $('best').textContent = G.best !== null ? `Рекорд этого острова — ${fmtTime(G.best)}` : '';
    setTimeout(() => loadingEl.remove(), 1400);
  }, 350);
}
try { window.claude?.hot?.snapshot?.(() => ({ seed: G.seed, muted: SFX.muted })); } catch (e) { /* viewer hook is optional */ }
const hot = window.claude?.hot;
if (hot?.ready) { try { hot.ready(start); } catch (e) { start({}); } } else start(hot?.data ?? {});
setTimeout(() => start({}), 2500);

// small handle for debugging / automated checks
window.__isle = {
  G, player, rig, perf, get world() { return world; }, startGame, win, hurt: () => hurt(1),
  setTod(v) { G.todT = G.tod = v; },
  get coins() { return coins; },
  rebuild(seed) { buildWorld(seed); resetRun(); },
  sim(dt, x, z, jump) { simDir = [x, z]; if (jump) { if (!player.jumpHeld) onJumpPress(); } else onJumpRelease(); updatePlayer(dt); updatePickups(dt); updateShades(dt); updateBeacon(dt); simDir = null; },
  shadeNear(dx = 3, dz = 3) { spawnShade(); const s = shades[shades.length - 1]; s.segs.forEach((sg, k) => sg.set(player.pos.x + dx + k * 0.3, player.pos.y + 1.2, player.pos.z + dz)); s.state = 'wander'; s.alpha = 1; s.t = 2; },
  collectAll(keepOne) { coins.forEach((c, i) => { if (c.alive && !(keepOne && i === coins.length - 1)) collectCoin(i); }); },
  teleport(x, z) { const s = world.stand[Math.floor(x) + Math.floor(z) * W]; player.pos.set(x, Math.min(s, H - 2), z); player.vel.set(0, 0, 0); },
};
