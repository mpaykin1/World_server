<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Creature Civilizations — Offline</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111b;color:#fff;font:13px system-ui}canvas{display:block;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 6px #000}#actions{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}button{background:#142637ed;color:#fff;border:1px solid #9ac9d7;border-radius:12px;padding:9px;font-size:11px}#talk{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#102031dd;border:1px solid #58778b;padding:8px 14px;border-radius:12px;min-width:170px;text-align:center}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>СУЩЕСТВА · ЦИВИЛИЗАЦИИ</span><span id="status"></span></div><div id="talk">Мир просыпается…</div><div id="actions"><button id="add">+ СУЩЕСТВА</button><button id="construct">СТРОИТЬ</button><button id="attack">ВОЙНА</button><button id="peace">МИР</button><button id="history">ИСТОРИЯ</button><button id="pause">ПАУЗА</button><button id="save">СОХР.</button><button id="load">ЗАГР.</button><button id="newgame">НОВАЯ ИГРА</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});if(!ctx){document.getElementById('talk').textContent='Canvas 2D недоступен';return}const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];let w=0,h=0,dpr=1,t=0,camX=0,camY=0,zoom=.72,mode='watch',speechAt=0,paused=false,ended=false,frameCount=0,fps=0,fpsStart=performance.now();const agents=[],houses=[],sparks=[];const STORE='world-server-creatures-save-v1';const RESOURCE_NODES=[{x:-500,y:-130,ore:100,cap:100},{x:-270,y:150,ore:100,cap:100},{x:270,y:-150,ore:100,cap:100},{x:500,y:130,ore:100,cap:100}];const BUILD_COST=7;const REPRO_COST=12;let birthTimer=0;const relations=[-60,-60];let elapsedSave=0;const particles=[];const HISTORY=[];const MEMORY_LIMIT=5;const teams=[{x:-360,y:0,color:'#8cefff',stock:0},{x:360,y:0,color:'#ff8fba',stock:0}];const words=['Здесь будет наш дом.','Я нашёл кристаллы!','Нам нужна новая башня.','Соседи приближаются.','Я защищу поселение.','Посмотри на небо.','Построим мост!','Собираем ресурсы.'];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function creature(team,x,y){const seed=Math.random()*9999,legs=2+(Math.random()*3|0)*2,arms=2+(Math.random()*2|0)*2,eyes=1+(Math.random()*4|0),wing=Math.random()>.6;return {team,x,y,tx:x,ty:y,seed,legs,arms,eyes,wing,size:R(13,23),speed:R(29,44),hp:100,cargo:0,role:pick(['собиратель','строитель','страж']),work:R(1,5),cool:0,alive:true,kind:Math.random(),name:pick(['Ар','Нор','Син','Вир','Эл','Тор','Зир','Мир'])+(Math.random()*90|0)}}function add(team,n){if(agents.length>=180)return;for(let i=0;i<Math.min(n,180-agents.length);i++)agents.push(creature(team,teams[team].x+R(-90,90),R(-110,110)))}function house(team,x,y){if(houses.length>=120)return;houses.push({team,x,y,type:Math.random()>.45?'tower':'hut',size:R(20,32)})}for(let f=0;f<2;f++){house(f,teams[f].x,0);house(f,teams[f].x+45,40);add(f,14)}function text(s){$('talk').textContent=s}function bubble(a,s){if(t-speechAt<2)return;speechAt=t;const msg=a.name+': «'+s+'»';HISTORY.push({t:Math.floor(t),message:msg});if(HISTORY.length>MEMORY_LIMIT)HISTORY.shift();text(msg)}function update(dt){if(paused||ended)return;t+=dt;for(const n of RESOURCE_NODES)n.ore=Math.min(n.cap,n.ore+dt*.08);birthTimer+=dt;const living=[[],[]];for(const a of agents)if(a.alive)living[a.team].push(a);for(const a of agents){if(!a.alive)continue;a.work-=dt;a.cool-=dt;let foe=null,best=1e10;for(const b of living[1-a.team]){if(!b.alive)continue;const d=(a.x-b.x)**2+(a.y-b.y)**2;if(d<best){best=d;foe=b}}const danger=foe&&best<(a.role==='страж'?16000:9500)&&relations[a.team]<0;const role=a.role||'собиратель';const defender=best<20000&&houses.some(h=>h.team===a.team&&(a.x-h.x)**2+(a.y-h.y)**2<11000);if(relations[a.team]<0&&(mode==='war'||danger)&&foe){a.tx=foe.x;a.ty=foe.y;if(best<1400&&a.cool<=0){a.cool=R(.6,1.4);foe.hp-=R(13,28)*(defender?1.15:1)*(role==='страж'?1.2:1);sparks.push({x:foe.x,y:foe.y,team:a.team,life:.6});if(foe.hp<=0)foe.alive=false;if(Math.random()<.12)bubble(a,'Защищайте наших!')}}else if(a.work<=0){a.work=R(2,5);const base=teams[a.team];const carrying=Number(a.cargo)||0;const atBase=(a.x-base.x)**2+(a.y-base.y)**2<6400;if(carrying>0){if(atBase){base.stock+=carrying;a.cargo=0;if(Math.random()<.1)bubble(a,'Доставил '+carrying+' кристаллов.')}else{a.tx=base.x;a.ty=base.y}}else{let node=null,dist=Infinity;for(const n of RESOURCE_NODES){if(n.ore<1)continue;const d=(n.x-a.x)**2+(n.y-a.y)**2;if(d<dist){dist=d;node=n}}if(node){if(dist<2500){const amount=Math.min(Math.floor(node.ore),role==='собиратель'?3:1);node.ore-=amount;a.cargo=amount;a.tx=base.x;a.ty=base.y}else{a.tx=node.x;a.ty=node.y}}else{a.tx=base.x;a.ty=base.y}}if(a.cargo>0&&Math.random()<.08){particles.push({x:a.x,y:a.y,life:1,color:'#8effaf'})}if(role==='строитель'&&atBase&&teams[a.team].stock>=BUILD_COST&&houses.length<120){teams[a.team].stock-=BUILD_COST;house(a.team,base.x+R(-120,120),base.y+R(-120,120));if(Math.random()<.5)bubble(a,'Я построил новый дом!')}else if(Math.random()<.12)bubble(a,pick(words))}const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d>4){const speed=Math.min(d,dt*(a.speed||36)*(role==='страж'?1.08:1));a.x+=dx/d*speed;a.y+=dy/d*speed}}elapsedSave+=dt;if(elapsedSave>45){elapsedSave=0;try{localStorage.setItem(STORE,JSON.stringify({version:1,t,camX,camY,zoom,mode,teams,relations,agents,houses,HISTORY,birthTimer,resourceOre:RESOURCE_NODES.map(n=>n.ore)}))}catch(e){}}for(let f=0;f<2;f++){const alive=living[f].filter(a=>a.alive).length;if(alive>0&&alive<65&&birthTimer>=15&&teams[f].stock>=REPRO_COST&&agents.length<176){teams[f].stock-=REPRO_COST;add(f,2);if(Math.random()<.25)text('В поселении '+(f===0?'ЛЮМЕН':'НОКТ')+' родились новые жители.')}if(alive===0&&teams[f].stock>=3&&agents.length<=177){teams[f].stock-=3;add(f,3)}else if(alive===0&&(teams[f].stock<3||agents.length>177)&&t>30&&relations[f]<0){ended=true;text('Победа '+(f===0?'НОКТ':'ЛЮМЕН')+'! Нажми НОВАЯ ИГРА.')}}if(birthTimer>=15)birthTimer=0;for(let i=agents.length-1;i>=0;i--)if(!agents[i].alive)agents.splice(i,1);if(sparks.length>150)sparks.splice(0,sparks.length-150);if(particles.length>150)particles.splice(0,particles.length-150);for(let i=particles.length-1;i>=0;i--){particles[i].life-=dt;if(particles[i].life<=0)particles.splice(i,1)}for(let i=sparks.length-1;i>=0;i--){sparks[i].life-=dt;if(sparks[i].life<=0)sparks.splice(i,1)}$('status').textContent=(living[0].filter(a=>a.alive).length+living[1].filter(a=>a.alive).length)+' существ · '+houses.length+' построек · '+Math.floor(teams[0].stock)+' / '+Math.floor(teams[1].stock)+' ресурсов · '+fps+' FPS'}
function shape(a){const s=a.size,ph=t*4+a.seed,flap=Math.sin(ph)*.35;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.sin(ph*.25)*.07);ctx.strokeStyle=teams[a.team].color;ctx.fillStyle='#060d14';ctx.lineWidth=2.4;ctx.shadowColor=teams[a.team].color;ctx.shadowBlur=9;for(let i=0;i<a.legs;i++){const ang=i/a.legs*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(ang)*s*.4,s*.3);ctx.quadraticCurveTo(Math.cos(ang)*s*1.2,s*.8,Math.cos(ang)*s*(1.2+flap),s*(1.6+Math.sin(ph+i)*.25));ctx.stroke()}for(let i=0;i<a.arms;i++){const side=i%2?-1:1;ctx.beginPath();ctx.moveTo(side*s*.55,-s*.2);ctx.lineTo(side*s*(1.2+flap),-s*(.3+i*.1));ctx.lineTo(side*s*1.45,-s*(.1+i*.1));ctx.stroke()}if(a.wing){ctx.beginPath();ctx.moveTo(-s*.4,-s*.3);ctx.quadraticCurveTo(-s*2,-s*(2+flap),-s*2.3,-s*.5);ctx.lineTo(-s*.6,s*.2);ctx.moveTo(s*.4,-s*.3);ctx.quadraticCurveTo(s*2,-s*(2+flap),s*2.3,-s*.5);ctx.lineTo(s*.6,s*.2);ctx.stroke()}ctx.beginPath();ctx.ellipse(0,0,s*.7,s*(a.kind>.5?1.1:.8),Math.sin(a.seed)*.25,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-s*.9,s*(.35+a.kind*.2),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=teams[a.team].color;for(let i=0;i<a.eyes;i++){const x=(i-(a.eyes-1)/2)*s*.22;ctx.beginPath();ctx.arc(x,-s*.98,s*.075,0,7);ctx.fill()}ctx.restore()}
function draw(){ctx.fillStyle='#07121d';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-camX*zoom,h/2-camY*zoom);ctx.scale(zoom,zoom);const left=(camX-w/(2*zoom)),right=camX+w/(2*zoom),top=camY-h/(2*zoom),bottom=camY+h/(2*zoom);ctx.strokeStyle='#183341';ctx.lineWidth=1;for(let x=Math.floor(left/45)*45;x<right;x+=45){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}for(let y=Math.floor(top/45)*45;y<bottom;y+=45){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}for(const n of RESOURCE_NODES){ctx.save();ctx.translate(n.x,n.y);ctx.shadowColor='#70f6ca';ctx.shadowBlur=20;ctx.fillStyle=n.ore>=1?'#32ac96':'#334a55';ctx.strokeStyle=n.ore>=1?'#b5fff2':'#62717c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(15,-4);ctx.lineTo(8,18);ctx.lineTo(-12,16);ctx.lineTo(-17,-3);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#e8fff7';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(Math.floor(n.ore),0,34);ctx.restore()}for(const h of houses){if(h.x<left-100||h.x>right+100||h.y<top-100||h.y>bottom+100)continue;ctx.save();ctx.translate(h.x,h.y);ctx.strokeStyle=teams[h.team].color;ctx.fillStyle='#142333';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor=ctx.strokeStyle;if(h.type==='tower'){ctx.fillRect(-h.size*.4,-h.size*1.6,h.size*.8,h.size*1.6);ctx.strokeRect(-h.size*.4,-h.size*1.6,h.size*.8,h.size*1.6);ctx.beginPath();ctx.moveTo(-h.size*.7,-h.size*1.6);ctx.lineTo(0,-h.size*2.2);ctx.lineTo(h.size*.7,-h.size*1.6);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-h.size,-h.size*.3);ctx.lineTo(0,-h.size*1.6);ctx.lineTo(h.size,-h.size*.3);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeRect(-h.size*.7,-h.size*.3,h.size*1.4,h.size*.8)}ctx.restore()}for(const a of agents)if(a.alive&&a.x>left-80&&a.x<right+80&&a.y>top-80&&a.y<bottom+80)shape(a);for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,(1-p.life)*15+3,0,7);ctx.fill();ctx.globalAlpha=1}for(const s of sparks){ctx.strokeStyle=teams[s.team].color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,(1-s.life)*50,0,7);ctx.stroke()}ctx.restore();const v=ctx.createRadialGradient(w*.5,h*.5,50,w*.5,h*.5,Math.max(w,h)*.75);v.addColorStop(0,'#00000000');v.addColorStop(1,'#000b18c0');ctx.fillStyle=v;ctx.fillRect(0,0,w,h)}
let prev=performance.now();function loop(now){frameCount++;if(now-fpsStart>1000){fps=Math.round(frameCount*1000/(now-fpsStart));frameCount=0;fpsStart=now}const dt=Math.max(0,Math.min(.05,(now-prev)/1000));prev=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);let pointer=null,drag=0;let activePointers=new Map(),pinchDistance=0;function pos(e){return{x:e.clientX,y:e.clientY}}c.addEventListener('pointerdown',e=>{activePointers.set(e.pointerId,pos(e));if(activePointers.size===1){pointer=pos(e);drag=0}else{pointer=null;drag=100;const p=[...activePointers.values()];pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,pos(e));if(activePointers.size>=2){const p=[...activePointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchDistance>0)zoom=Math.max(.45,Math.min(2.2,zoom*distance/pinchDistance));pinchDistance=distance;drag=100;return}if(!pointer)return;const p=pos(e),dx=p.x-pointer.x,dy=p.y-pointer.y;camX-=dx/zoom;camY-=dy/zoom;drag+=Math.abs(dx)+Math.abs(dy);pointer=p});c.addEventListener('pointerup',e=>{activePointers.delete(e.pointerId);if(drag<8&&mode==='build'&&!paused&&!ended){const x=(e.clientX-w/2)/zoom+camX,y=(e.clientY-h/2)/zoom+camY,team=x<0?0:1;if(houses.length>=120){text('Достигнут предел построек.')}else if(teams[team].stock<BUILD_COST){text('Недостаточно ресурсов: нужно '+BUILD_COST+'.')}else{teams[team].stock-=BUILD_COST;house(team,x,y);text('Постройка завершена. Потрачено '+BUILD_COST+' ресурсов.')}}pointer=null;pinchDistance=0});c.addEventListener('pointercancel',e=>{activePointers.delete(e.pointerId);pointer=null;pinchDistance=0});c.addEventListener('wheel',e=>{zoom=Math.max(.45,Math.min(2.2,zoom*(e.deltaY>0?.9:1.1)))},{passive:true});$('history').onclick=()=>{text(HISTORY.length?HISTORY.map(x=>x.message).join(' | '):'История событий пока пуста.')};$('peace').onclick=()=>{const atPeace=relations[0]<0;relations[0]=relations[1]=atPeace?60:-60;mode=atPeace?'watch':'war';text(atPeace?'Заключено перемирие. Цивилизации строят и добывают ресурсы.':'Перемирие расторгнуто. Война возобновилась.')};$('add').onclick=()=>{add(0,4);add(1,4);text('Прибыли новые существа!')};$('construct').onclick=()=>{mode=mode==='build'?'watch':'build';text('Коснись земли, чтобы построить сооружение.')};$('attack').onclick=()=>{if(relations[0]>=0){text('Сначала расторгни перемирие.');return}mode=mode==='war'?'watch':'war';text(mode==='war'?'Началась война!':'Войска вернулись к своим делам.')};function save(){try{localStorage.setItem(STORE,JSON.stringify({version:1,t,camX,camY,zoom,mode,teams,relations,agents:agents.map(a=>({...a})),houses,HISTORY,birthTimer,resourceOre:RESOURCE_NODES.map(n=>n.ore)}));text('Мир сохранён.')}catch(e){text('Сохранение недоступно в этом браузере.')}}function load(){try{const raw=localStorage.getItem(STORE);if(!raw){text('Сохранение не найдено.');return}const d=JSON.parse(raw);if(d.version!==1||!Array.isArray(d.agents)||!Array.isArray(d.houses)||d.agents.length>180||d.houses.length>120||!Array.isArray(d.teams)||d.teams.length!==2)throw Error('invalid save');const nextTime=Number(d.t),nextX=Number(d.camX),nextY=Number(d.camY);if(![nextTime,nextX,nextY].every(Number.isFinite))throw Error('invalid camera');const restoredAgents=[];for(const a of d.agents){if(!a||![a.x,a.y,a.tx,a.ty,a.hp,a.team].every(Number.isFinite)||![0,1].includes(a.team))throw Error('invalid agent');restoredAgents.push(a)}const restoredHouses=[];for(const h of d.houses){if(!h||![h.x,h.y,h.size,h.team].every(Number.isFinite)||![0,1].includes(h.team))throw Error('invalid building');restoredHouses.push(h)}t=nextTime;camX=nextX;camY=nextY;zoom=Math.max(.45,Math.min(2.2,Number(d.zoom)||.72));mode=['watch','war','build'].includes(d.mode)?d.mode:'watch';for(let i=0;i<2;i++){teams[i].stock=Number(d.teams[i].stock)||0;relations[i]=Number.isFinite(Number(d.relations?.[i]))?Number(d.relations[i]):-60;}agents.splice(0,agents.length,...restoredAgents);houses.splice(0,houses.length,...restoredHouses);birthTimer=Number.isFinite(d.birthTimer)?Math.max(0,Math.min(15,d.birthTimer)):0;if(Array.isArray(d.resourceOre)&&d.resourceOre.length===RESOURCE_NODES.length)for(let i=0;i<RESOURCE_NODES.length;i++)if(Number.isFinite(d.resourceOre[i]))RESOURCE_NODES[i].ore=Math.max(0,Math.min(RESOURCE_NODES[i].cap,d.resourceOre[i]));HISTORY.length=0;for(const m of (Array.isArray(d.HISTORY)?d.HISTORY:[]).slice(-MEMORY_LIMIT))if(typeof m.message==='string')HISTORY.push(m);ended=false;paused=false;text('Мир восстановлен.')}catch(e){text('Не удалось загрузить сохранение.')}}$('save').onclick=save;$('load').onclick=load;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'ПРОДОЛЖИТЬ':'ПАУЗА'};$('newgame').onclick=()=>{agents.length=0;houses.length=0;sparks.length=0;particles.length=0;HISTORY.length=0;ended=false;paused=false;t=0;birthTimer=0;elapsedSave=0;mode='watch';for(const n of RESOURCE_NODES)n.ore=n.cap;zoom=.72;camX=0;camY=0;for(let f=0;f<2;f++){teams[f].stock=0;relations[f]=-60;house(f,teams[f].x,0);house(f,teams[f].x+45,40);add(f,14)}text('Новый мир создан.')};
})();
</script></body></html>
