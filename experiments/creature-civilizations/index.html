<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Creature Civilizations — Offline Prototype</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111b;color:#fff;font:13px system-ui}canvas{display:block;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 6px #000}#actions{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}button{background:#142637ed;color:#fff;border:1px solid #9ac9d7;border-radius:12px;padding:9px;font-size:11px}#talk{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#102031dd;border:1px solid #58778b;padding:8px 14px;border-radius:12px;min-width:170px;text-align:center}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>СУЩЕСТВА · ЦИВИЛИЗАЦИИ</span><span id="status"></span></div><div id="talk">Мир просыпается…</div><div id="actions"><button id="add">+ СУЩЕСТВА</button><button id="construct">СТРОИТЬ</button><button id="attack">ВОЙНА</button><button id="peace">МИР</button><button id="history">ИСТОРИЯ</button><button id="pause">ПАУЗА</button><button id="save">СОХР.</button><button id="load">ЗАГР.</button><button id="newgame">НОВАЯ ИГРА</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});if(!ctx){document.getElementById('talk').textContent='Canvas 2D недоступен';return}const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];let w=0,h=0,dpr=1,t=0,camX=0,camY=0,zoom=1,mode='watch',speechAt=0,paused=false,ended=false,frameCount=0,fps=0,fpsStart=performance.now();const agents=[],houses=[],sparks=[];const STORE='world-server-creatures-save-v1';const relations=[-60,-60];let elapsedSave=0;const particles=[];const HISTORY=[];const MEMORY_LIMIT=5;const teams=[{x:-360,y:0,color:'#8cefff',stock:0},{x:360,y:0,color:'#ff8fba',stock:0}];const words=['Здесь будет наш дом.','Я нашёл кристаллы!','Нам нужна новая башня.','Соседи приближаются.','Я защищу поселение.','Посмотри на небо.','Построим мост!','Собираем ресурсы.'];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function creature(team,x,y){const seed=Math.random()*9999,legs=2+(Math.random()*3|0)*2,arms=2+(Math.random()*2|0)*2,eyes=1+(Math.random()*4|0),wing=Math.random()>.6;return {team,x,y,tx:x,ty:y,seed,legs,arms,eyes,wing,size:R(13,23),hp:100,work:R(1,5),cool:0,alive:true,kind:Math.random(),name:pick(['Ар','Нор','Син','Вир','Эл','Тор','Зир','Мир'])+(Math.random()*90|0)}}function add(team,n){for(let i=0;i<n;i++)agents.push(creature(team,teams[team].x+R(-90,90),R(-110,110)))}function house(team,x,y){houses.push({team,x,y,type:Math.random()>.45?'tower':'hut',size:R(20,32)})}for(let f=0;f<2;f++){house(f,teams[f].x,0);house(f,teams[f].x+45,40);add(f,14)}function text(s){$('talk').textContent=s}function bubble(a,s){if(t-speechAt<2)return;speechAt=t;const msg=a.name+': «'+s+'»';HISTORY.push({t:Math.floor(t),message:msg});if(HISTORY.length>MEMORY_LIMIT)HISTORY.shift();text(msg)}function update(dt){if(paused||ended)return;t+=dt;for(const a of agents){if(!a.alive)continue;a.work-=dt;a.cool-=dt;const opponents=agents.filter(b=>b.alive&&b.team!==a.team);let foe=null,best=1e10;for(const b of opponents){const d=(a.x-b.x)**2+(a.y-b.y)**2;if(d<best){best=d;foe=b}}const danger=foe&&best<9500&&relations[a.team]<0;const defender=houses.some(h=>h.team===a.team&&(a.x-h.x)**2+(a.y-h.y)**2<11000);if((mode==='war'||danger)&&foe){a.tx=foe.x;a.ty=foe.y;if(best<1400&&a.cool<=0){a.cool=R(.6,1.4);foe.hp-=R(13,28)*(defender?1.15:1);sparks.push({x:foe.x,y:foe.y,team:a.team,life:.6});if(foe.hp<=0)foe.alive=false;if(Math.random()<.12)bubble(a,'Защищайте наших!')}}else if(a.work<=0){a.work=R(2,5);a.tx=teams[a.team].x+R(-210,210);a.ty=R(-190,190);teams[a.team].stock++;if(Math.random()<.08){particles.push({x:a.x,y:a.y,life:1,color:'#8effaf'})}if(teams[a.team].stock>=7&&houses.length<120){teams[a.team].stock-=7;house(a.team,a.x,a.y);if(Math.random()<.5)bubble(a,'Я построил новый дом!')}else if(Math.random()<.12)bubble(a,pick(words))}const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d>4){const speed=Math.min(d,dt*R(30,43));a.x+=dx/d*speed;a.y+=dy/d*speed}}elapsedSave+=dt;if(elapsedSave>45){elapsedSave=0;try{localStorage.setItem(STORE,JSON.stringify({version:1,t,camX,camY,zoom,mode,teams,relations,agents,houses,HISTORY}))}catch(e){}}for(let f=0;f<2;f++){const alive=agents.filter(a=>a.alive&&a.team===f).length;if(alive===0&&teams[f].stock>=3){teams[f].stock-=3;add(f,3)}if(alive===0&&teams[f].stock<3&&t>30){ended=true;text('Победа '+(f===0?'НОКТ':'ЛЮМЕН')+'! Нажми НОВАЯ ИГРА.')}}for(let i=particles.length-1;i>=0;i--){particles[i].life-=dt;if(particles[i].life<=0)particles.splice(i,1)}for(let i=sparks.length-1;i>=0;i--){sparks[i].life-=dt;if(sparks[i].life<=0)sparks.splice(i,1)}$('status').textContent=agents.filter(a=>a.alive).length+' существ · '+houses.length+' построек · '+fps+' FPS'}
function shape(a){const s=a.size,ph=t*4+a.seed,flap=Math.sin(ph)*.35;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.sin(ph*.25)*.07);ctx.strokeStyle=teams[a.team].color;ctx.fillStyle='#060d14';ctx.lineWidth=2.4;ctx.shadowColor=teams[a.team].color;ctx.shadowBlur=9;for(let i=0;i<a.legs;i++){const ang=i/a.legs*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(ang)*s*.4,s*.3);ctx.quadraticCurveTo(Math.cos(ang)*s*1.2,s*.8,Math.cos(ang)*s*(1.2+flap),s*(1.6+Math.sin(ph+i)*.25));ctx.stroke()}for(let i=0;i<a.arms;i++){const side=i%2?-1:1;ctx.beginPath();ctx.moveTo(side*s*.55,-s*.2);ctx.lineTo(side*s*(1.2+flap),-s*(.3+i*.1));ctx.lineTo(side*s*1.45,-s*(.1+i*.1));ctx.stroke()}if(a.wing){ctx.beginPath();ctx.moveTo(-s*.4,-s*.3);ctx.quadraticCurveTo(-s*2,-s*(2+flap),-s*2.3,-s*.5);ctx.lineTo(-s*.6,s*.2);ctx.moveTo(s*.4,-s*.3);ctx.quadraticCurveTo(s*2,-s*(2+flap),s*2.3,-s*.5);ctx.lineTo(s*.6,s*.2);ctx.stroke()}ctx.beginPath();ctx.ellipse(0,0,s*.7,s*(a.kind>.5?1.1:.8),Math.sin(a.seed)*.25,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-s*.9,s*(.35+a.kind*.2),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=teams[a.team].color;for(let i=0;i<a.eyes;i++){const x=(i-(a.eyes-1)/2)*s*.22;ctx.beginPath();ctx.arc(x,-s*.98,s*.075,0,7);ctx.fill()}ctx.restore()}
function draw(){ctx.fillStyle='#07121d';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-camX*zoom,h/2-camY*zoom);ctx.scale(zoom,zoom);const left=(camX-w/(2*zoom)),right=camX+w/(2*zoom),top=camY-h/(2*zoom),bottom=camY+h/(2*zoom);ctx.strokeStyle='#183341';ctx.lineWidth=1;for(let x=Math.floor(left/45)*45;x<right;x+=45){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}for(let y=Math.floor(top/45)*45;y<bottom;y+=45){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}for(const h of houses){ctx.save();ctx.translate(h.x,h.y);ctx.strokeStyle=teams[h.team].color;ctx.fillStyle='#142333';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor=ctx.strokeStyle;if(h.type==='tower'){ctx.fillRect(-h.size*.4,-h.size*1.6,h.size*.8,h.size*1.6);ctx.strokeRect(-h.size*.4,-h.size*1.6,h.size*.8,h.size*1.6);ctx.beginPath();ctx.moveTo(-h.size*.7,-h.size*1.6);ctx.lineTo(0,-h.size*2.2);ctx.lineTo(h.size*.7,-h.size*1.6);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-h.size,-h.size*.3);ctx.lineTo(0,-h.size*1.6);ctx.lineTo(h.size,-h.size*.3);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeRect(-h.size*.7,-h.size*.3,h.size*1.4,h.size*.8)}ctx.restore()}for(const a of agents)if(a.alive)shape(a);for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,(1-p.life)*15+3,0,7);ctx.fill();ctx.globalAlpha=1}for(const s of sparks){ctx.strokeStyle=teams[s.team].color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,(1-s.life)*50,0,7);ctx.stroke()}ctx.restore();const v=ctx.createRadialGradient(w*.5,h*.5,50,w*.5,h*.5,Math.max(w,h)*.75);v.addColorStop(0,'#00000000');v.addColorStop(1,'#000b18c0');ctx.fillStyle=v;ctx.fillRect(0,0,w,h)}
let prev=performance.now();function loop(now){frameCount++;if(now-fpsStart>1000){fps=Math.round(frameCount*1000/(now-fpsStart));frameCount=0;fpsStart=now}const dt=Math.min(.05,(now-prev)/1000);prev=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);let pointer=null,drag=0;function pos(e){return{x:e.clientX,y:e.clientY}}c.addEventListener('pointerdown',e=>{pointer=pos(e);drag=0;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!pointer)return;const p=pos(e),dx=p.x-pointer.x,dy=p.y-pointer.y;camX-=dx/zoom;camY-=dy/zoom;drag+=Math.abs(dx)+Math.abs(dy);pointer=p});c.addEventListener('pointerup',e=>{if(drag<8&&mode==='build'){const x=(e.clientX-w/2)/zoom+camX,y=(e.clientY-h/2)/zoom+camY,team=x<0?0:1;house(team,x,y);text('Новое сооружение построено.')}pointer=null});c.addEventListener('wheel',e=>{zoom=Math.max(.45,Math.min(2.2,zoom*(e.deltaY>0?.9:1.1)))},{passive:true});$('history').onclick=()=>{text(HISTORY.length?HISTORY.map(x=>x.message).join(' | '):'История событий пока пуста.')};$('peace').onclick=()=>{const atPeace=relations[0]<0;relations[0]=relations[1]=atPeace?60:-60;mode=atPeace?'watch':'war';text(atPeace?'Заключено перемирие. Цивилизации строят и добывают ресурсы.':'Перемирие расторгнуто. Война возобновилась.')};$('add').onclick=()=>{add(0,4);add(1,4);text('Прибыли новые существа!')};$('construct').onclick=()=>{mode=mode==='build'?'watch':'build';text('Коснись земли, чтобы построить сооружение.')};$('attack').onclick=()=>{mode=mode==='war'?'watch':'war';text(mode==='war'?'Началась война!':'Войска вернулись к своим делам.')};function save(){try{localStorage.setItem(STORE,JSON.stringify({version:1,t,camX,camY,zoom,mode,teams,relations,agents:agents.map(a=>({...a})),houses,HISTORY}));text('Мир сохранён.')}catch(e){text('Сохранение недоступно в этом браузере.')}}function load(){try{const raw=localStorage.getItem(STORE);if(!raw){text('Сохранение не найдено.');return}const d=JSON.parse(raw);if(d.version!==1||!Array.isArray(d.agents)||!Array.isArray(d.houses)||d.agents.length>300||d.houses.length>300)throw Error('invalid save');t=Number(d.t)||0;camX=Number(d.camX)||0;camY=Number(d.camY)||0;zoom=Math.max(.45,Math.min(2.2,Number(d.zoom)||1));mode=['watch','war','build'].includes(d.mode)?d.mode:'watch';for(let i=0;i<2;i++){teams[i].stock=Number(d.teams[i].stock)||0;relations[i]=Number(d.relations?.[i])||-60;}agents.length=0;for(const a of d.agents)agents.push(a);houses.length=0;for(const h of d.houses)houses.push(h);HISTORY.length=0;for(const m of (Array.isArray(d.HISTORY)?d.HISTORY:[]).slice(-MEMORY_LIMIT))if(typeof m.message==='string')HISTORY.push(m);ended=false;paused=false;text('Мир восстановлен.')}catch(e){text('Не удалось загрузить сохранение.')}}$('save').onclick=save;$('load').onclick=load;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'ПРОДОЛЖИТЬ':'ПАУЗА'};$('newgame').onclick=()=>{agents.length=0;houses.length=0;sparks.length=0;HISTORY.length=0;ended=false;paused=false;t=0;for(let f=0;f<2;f++){teams[f].stock=0;relations[f]=-60;house(f,teams[f].x,0);house(f,teams[f].x+45,40);add(f,14)}text('Новый мир создан.')};
})();
</script></body></html>
