<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#141419">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:,">
    <title>Лаборатория существ · World Server</title>
    <link rel="stylesheet" href="./world-shell.css">
    <script defer src="./world-shell.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Courier New',monospace;background:#F0F0F5;overflow:hidden}
        #canvas-container{width:100vw;height:100vh}
        #info{position:absolute;top:20px;left:20px;background:rgba(255,255,255,.92);padding:15px;border:2px solid #141419;font-size:12px;width:320px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 18px 50px rgba(20,20,25,.10);z-index:5}
        #info h3{margin-bottom:10px;color:#141419}
        #info p{margin:5px 0;color:#646469}
        .control{margin:10px 0}
        .control label{display:block;margin-bottom:5px;color:#141419;font-weight:bold}
        .control input[type="range"]{width:100%}
        .control button{margin:5px 4px 0 0;padding:6px 12px;background:#141419;color:#F0F0F5;border:none;cursor:pointer;font-family:inherit}
        .control button:hover{background:#3a3a44}
        .btn-row{display:flex;gap:6px;margin-top:8px}
        .btn-row button{flex:1}
        .control select{width:100%;padding:7px;background:#fff;border:1px solid #141419;font-family:inherit}
        .section-title{margin:12px 0 6px;color:#141419;font-weight:bold;border-top:1px solid #c9c9d2;padding-top:9px}
        .control input[type="checkbox"]{width:auto;margin-right:6px;vertical-align:middle}
        .mini-note{font-size:10px;color:#646469;line-height:1.35;margin-top:4px}
        #saveBtn{display:none}
        #assetInfo{font-size:10px;color:#646469;line-height:1.4;margin-top:8px}
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h3 id="charName">Крокодил</h3>
        <p>Стиль: Графический скетч (Уголь)</p>
        <p id="polyInfo">Полигоны: —</p>
        <div class="control">
            <label>Класс генерации</label>
            <select id="category">
                <option value="reptile">Рептилия / наземный враг</option>
                <option value="fish">Рыба / подводное существо</option>
                <option value="dragon">Летающий дракон</option>
                <option value="dragon_fire">Дракон, пышущий огнём</option>
                <option value="human">Человек / хранитель</option>
                <option value="human_sword">Человек с мечом</option>
                <option value="human_torch">Человек с GLSL-факелом</option>
                <option value="human_gun">Человек с фантастическим оружием</option>
                <option value="croc_teeth">Крокодил с зубастой пастью</option>
                <option value="ship">Космический корабль</option>
                <option value="steampunk_vehicle">Стимпанк-машина</option>
                <option value="creature">Существо / гуманоидный монстр</option>
                <option value="monster">Монстр / многоглазая пасть</option>
            </select>
        </div>
        <div class="control">
            <label>Вращение: <span id="rotation-value">0°</span></label>
            <input type="range" id="rotation" min="0" max="360" value="0">
        </div>
        <div class="control">
            <label>Скорость: <span id="speed-value">1.0</span>x</label>
            <input type="range" id="speed" min="0" max="4" step="0.1" value="1.0">
        </div>
        <div class="control">
            <label>Размах: <span id="amplitude-value">1.0</span></label>
            <input type="range" id="amplitude" min="0" max="2.5" step="0.1" value="1.0">
        </div>
        <div class="control">
            <label>Штриховка: <span id="hatching-value">2.5</span></label>
            <input type="range" id="hatching" min="0" max="3" step="0.1" value="2.5">
        </div>
        <div class="control">
            <label>Плотность: <span id="density-value">2.0</span></label>
            <input type="range" id="density" min="0.5" max="4" step="0.1" value="2.0">
        </div>
        <div class="control">
            <button id="toggleAnim">⏸ Пауза</button>
        </div>
        <div class="section-title">Материал / Шейдер (единая система)</div>
        <div class="control">
            <label>Пресет</label>
            <select id="shaderPreset">
                <option value="rainbow">Вивид (Rainbow Sketch)</option>
                <option value="crystal">Кристалл / витраж</option>
                <option value="armor">Броня / эмаль</option>
            </select>
        </div>
        <div class="control">
            <label>Глянец: <span id="gloss-value">0.35</span></label>
            <input type="range" id="gloss" min="0" max="1" step="0.01" value="0.35">
        </div>
        <div class="control">
            <label>Шероховатость: <span id="roughness-value">0.45</span></label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.45">
        </div>
        <div class="control">
            <label>Металл: <span id="metallic-value">0.00</span></label>
            <input type="range" id="metallic" min="0" max="1" step="0.01" value="0.00">
        </div>
        <div class="control">
            <label><input type="checkbox" id="saturatedColors" checked> Насыщенные цвета</label>
        </div>
        <div class="section-title">Текстуры / Скины</div>
        <div class="control">
            <label>Скин</label>
            <select id="skinPreset">
                <option value="segmented">Радужный сегментный</option>
                <option value="scales">Чешуя / резьба</option>
                <option value="runes">Руны / гравировка</option>
            </select>
        </div>
        <div class="control">
            <label>Масштаб: <span id="skinScale-value">1.00</span></label>
            <input type="range" id="skinScale" min="0.35" max="3" step="0.05" value="1.00">
        </div>
        <div class="control">
            <label>Детализация: <span id="detail-value">1.30</span></label>
            <input type="range" id="detail" min="0" max="3" step="0.05" value="1.30">
        </div>
        <div class="control">
            <label><input type="checkbox" id="normalMap" checked> Нормал-карта</label>
            <div class="mini-note">Цвет, резьба и свет применяются ко всем классам генерации.</div>
        </div>
        <div class="btn-row">
            <button id="newBtn">✦ Создать</button>
            <button id="saveBtn">💾 Save</button>
        </div>
        <div class="btn-row">
            <button id="saveUniversalBtn">💾 HTML</button>
            <button id="exportAssetBtn">⬡ Для игры</button>
        </div>
        <p id="assetInfo">HTML открывается самостоятельно. «Для игры» сохраняет JSON для THREE.ObjectLoader.</p>
        <p style="margin-top:12px;font-size:10px">Мышь: Вращение | Колесо: Зум</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        // === Сцена ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xF0F0F5);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 25, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 1.8;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === Глобальные параметры ===
        let animSpeed = 1.0;
        let animAmplitude = 1.0;
        let isAnimating = true;
        let globalTime = 0;
        let hatchingIntensity = 2.5;
        let hatchDensity = 2.0;
        let shaderPreset = 0.0;
        let skinPreset = 0.0;
        let skinScale = 1.0;
        let detailStrength = 1.3;
        let glossAmount = 0.35;
        let roughnessAmount = 0.45;
        let metallicAmount = 0.0;
        let saturatedColors = 1.0;
        let normalMapEnabled = 1.0;

        // ========== ШЕЙДЕРЫ (ОРИГИНАЛЬНЫЕ) ==========
        const vertexShader = `
            uniform float uTime;
            uniform float uAmplitude;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            varying vec3 vViewPosition;
            varying float vCurvature;

            vec3 rotateY(vec3 p, float angle) {
                float c = cos(angle);
                float s = sin(angle);
                return vec3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c);
            }

            vec3 rotateZ(vec3 p, float angle) {
                float c = cos(angle);
                float s = sin(angle);
                return vec3(p.x * c - p.y * s, p.x * s + p.y * c, p.z);
            }

            vec3 rotateX(vec3 p, float angle) {
                float c = cos(angle);
                float s = sin(angle);
                return vec3(p.x, p.y * c - p.z * s, p.y * s + p.z * c);
            }

            void main() {
                vec3 pos = position;
                vec3 norm = normal;

                // ХВОСТ
                if (pos.x < -5.0) {
                    float tailFactor = clamp((-pos.x - 5.0) / 15.0, 0.0, 1.0);
                    float tailWave = sin(uTime * 3.0 + pos.x * 0.25) * uAmplitude;
                    float tailWave2 = cos(uTime * 2.2 + pos.x * 0.18) * uAmplitude;
                    pos.z += tailWave * tailFactor * 2.5;
                    pos.y += tailWave2 * tailFactor * 0.8;
                    float angle = atan(tailWave * tailFactor * 0.15);
                    norm = vec3(norm.x, norm.y * cos(angle) - norm.z * sin(angle), norm.y * sin(angle) + norm.z * cos(angle));
                }

                // ТЕЛО
                float walkFreq = 3.5;
                float breath = sin(uTime * 2.0) * uAmplitude * 0.03;
                float bodyBob = abs(sin(uTime * walkFreq)) * uAmplitude * 0.15;
                float bodySway = sin(uTime * walkFreq * 0.5) * uAmplitude * 0.1;
                if (pos.x > -6.0 && pos.x < 8.0) {
                    pos.y *= (1.0 + breath);
                    pos.z *= (1.0 + breath * 0.5);
                    pos.y += bodyBob * (1.0 - abs(pos.x) / 8.0);
                    pos.z += bodySway * (1.0 - abs(pos.x) / 8.0);
                }

                // ГОЛОВА
                if (pos.x > 6.0) {
                    float headFactor = clamp((pos.x - 6.0) / 10.0, 0.0, 1.0);
                    float headBob = sin(uTime * walkFreq + 0.5) * uAmplitude * 0.2;
                    float headTurn = sin(uTime * 0.6) * uAmplitude * 0.08;
                    float ca = cos(headTurn * headFactor);
                    float sa = sin(headTurn * headFactor);
                    float nx = pos.x * ca - pos.z * sa;
                    float nz = pos.x * sa + pos.z * ca;
                    pos.x = mix(pos.x, nx, headFactor);
                    pos.z = mix(pos.z, nz, headFactor);
                    pos.y += headBob * headFactor;
                    if (pos.y < 1.5 && pos.x > 10.0) {
                        float jawOpen = (sin(uTime * 1.2) * 0.5 + 0.5) * uAmplitude * 0.3;
                        vec3 jawPivot = vec3(12.5, 2.0, 0.0);
                        vec3 localJaw = pos - jawPivot;
                        localJaw = rotateZ(localJaw, -jawOpen * 0.4);
                        pos = localJaw + jawPivot;
                    }
                }

                float walkCycle = uTime * walkFreq;

                // ПЕРЕДНЯЯ ЛЕВАЯ
                if (pos.z > 2.5 && pos.x > 3.0 && pos.x < 10.0 && pos.y < 1.0) {
                    vec3 shoulder = vec3(5.0, -0.5, 4.0);
                    vec3 localPos = pos - shoulder;
                    float cycle = fract(walkCycle / 6.283 + 0.0);
                    float liftAmount, strideForward, kneeBend;
                    if (cycle < 0.6) {
                        float t = cycle / 0.6;
                        liftAmount = 0.0;
                        strideForward = mix(-1.5, 1.5, t) * uAmplitude;
                        kneeBend = -0.2 * uAmplitude;
                    } else {
                        float t = (cycle - 0.6) / 0.4;
                        liftAmount = sin(t * 3.14159) * 1.5 * uAmplitude;
                        strideForward = mix(1.5, -1.5, t) * uAmplitude;
                        kneeBend = -0.8 * sin(t * 3.14159) * uAmplitude;
                    }
                    float shoulderAngle = strideForward * 0.15;
                    localPos = rotateY(localPos, shoulderAngle);
                    localPos.y += liftAmount;
                    localPos.z += liftAmount * 0.3;
                    if (localPos.x > 0.5) {
                        vec3 elbow = vec3(1.0, 0.0, 0.0);
                        vec3 forearm = localPos - elbow;
                        forearm = rotateY(forearm, kneeBend);
                        localPos = forearm + elbow;
                    }
                    pos = localPos + shoulder;
                    norm = rotateY(norm, shoulderAngle);
                }

                // ПЕРЕДНЯЯ ПРАВАЯ
                if (pos.z < -2.5 && pos.x > 2.0 && pos.x < 8.0 && pos.y < 1.0) {
                    vec3 shoulder = vec3(4.5, -0.5, -4.0);
                    vec3 localPos = pos - shoulder;
                    float cycle = fract(walkCycle / 6.283 + 0.5);
                    float liftAmount, strideForward, kneeBend;
                    if (cycle < 0.6) {
                        float t = cycle / 0.6;
                        liftAmount = 0.0;
                        strideForward = mix(-1.5, 1.5, t) * uAmplitude;
                        kneeBend = -0.2 * uAmplitude;
                    } else {
                        float t = (cycle - 0.6) / 0.4;
                        liftAmount = sin(t * 3.14159) * 1.5 * uAmplitude;
                        strideForward = mix(1.5, -1.5, t) * uAmplitude;
                        kneeBend = -0.8 * sin(t * 3.14159) * uAmplitude;
                    }
                    float shoulderAngle = strideForward * 0.15;
                    localPos = rotateY(localPos, shoulderAngle);
                    localPos.y += liftAmount;
                    localPos.z -= liftAmount * 0.3;
                    if (localPos.x > 0.5) {
                        vec3 elbow = vec3(0.5, 0.0, 0.0);
                        vec3 forearm = localPos - elbow;
                        forearm = rotateY(forearm, kneeBend);
                        localPos = forearm + elbow;
                    }
                    pos = localPos + shoulder;
                    norm = rotateY(norm, shoulderAngle);
                }

                // ЗАДНЯЯ ЛЕВАЯ
                if (pos.z > 2.5 && pos.x < -3.0 && pos.x > -11.0 && pos.y < 1.5) {
                    vec3 hip = vec3(-5.5, 0.0, 4.0);
                    vec3 localPos = pos - hip;
                    float cycle = fract(walkCycle / 6.283 + 0.5);
                    float liftAmount, strideBack, kneeBend;
                    if (cycle < 0.6) {
                        float t = cycle / 0.6;
                        liftAmount = 0.0;
                        strideBack = mix(1.5, -1.5, t) * uAmplitude;
                        kneeBend = -0.3 * uAmplitude;
                    } else {
                        float t = (cycle - 0.6) / 0.4;
                        liftAmount = sin(t * 3.14159) * 1.8 * uAmplitude;
                        strideBack = mix(-1.5, 1.5, t) * uAmplitude;
                        kneeBend = -1.0 * sin(t * 3.14159) * uAmplitude;
                    }
                    float hipAngle = strideBack * 0.12;
                    localPos = rotateY(localPos, hipAngle);
                    localPos.y += liftAmount;
                    localPos.z += liftAmount * 0.25;
                    if (localPos.x < -0.5) {
                        vec3 knee = vec3(-1.0, -0.5, 0.0);
                        vec3 shin = localPos - knee;
                        shin = rotateY(shin, kneeBend);
                        localPos = shin + knee;
                    }
                    pos = localPos + hip;
                    norm = rotateY(norm, hipAngle);
                }

                // ЗАДНЯЯ ПРАВАЯ
                if (pos.z < -2.5 && pos.x < -3.0 && pos.x > -11.0 && pos.y < 2.0) {
                    vec3 hip = vec3(-5.5, 0.5, -4.0);
                    vec3 localPos = pos - hip;
                    float cycle = fract(walkCycle / 6.283 + 0.0);
                    float liftAmount, strideBack, kneeBend;
                    if (cycle < 0.6) {
                        float t = cycle / 0.6;
                        liftAmount = 0.0;
                        strideBack = mix(1.5, -1.5, t) * uAmplitude;
                        kneeBend = -0.3 * uAmplitude;
                    } else {
                        float t = (cycle - 0.6) / 0.4;
                        liftAmount = sin(t * 3.14159) * 1.8 * uAmplitude;
                        strideBack = mix(-1.5, 1.5, t) * uAmplitude;
                        kneeBend = -1.0 * sin(t * 3.14159) * uAmplitude;
                    }
                    float hipAngle = strideBack * 0.12;
                    localPos = rotateY(localPos, hipAngle);
                    localPos.y += liftAmount;
                    localPos.z -= liftAmount * 0.25;
                    if (localPos.x < -0.5) {
                        vec3 knee = vec3(-1.0, -0.5, 0.0);
                        vec3 shin = localPos - knee;
                        shin = rotateY(shin, kneeBend);
                        localPos = shin + knee;
                    }
                    pos = localPos + hip;
                    norm = rotateY(norm, hipAngle);
                }

                // ГРЕБЕНЬ
                if (pos.y > 2.0 && pos.x < -8.0) {
                    float ridgePulse = sin(uTime * 4.0 + pos.x * 0.5) * uAmplitude * 0.1;
                    pos.y += ridgePulse;
                }

                // НОЗДРИ
                if (pos.x > 14.5 && abs(pos.z) < 1.0) {
                    float nostrilPulse = (sin(uTime * 1.5) * 0.5 + 0.5) * uAmplitude * 0.05;
                    pos.z *= (1.0 + nostrilPulse);
                }

                vUv = uv;
                vNormal = normalize(normalMatrix * norm);
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                vPosition = pos;
                vWorldPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
                vCurvature = pos.y;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            precision highp float;
            uniform float uTime;
            uniform float uHatchingIntensity;
            uniform float uHatchDensity;
            uniform float uShaderPreset;
            uniform float uSkinPreset;
            uniform float uSkinScale;
            uniform float uDetailStrength;
            uniform float uGloss;
            uniform float uRoughness;
            uniform float uMetallic;
            uniform float uSaturation;
            uniform float uNormalMap;
            uniform vec3 uDarkColor;
            uniform vec3 uMidColor;
            uniform vec3 uLightColor;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            varying vec3 vViewPosition;
            varying float vCurvature;

            float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
            float noise(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));vec2 u=f*f*(3.-2.*f);return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y;}
            float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=noise(p)*a;p*=2.03;a*=.5;}return s;}
            vec3 hsl2rgb(vec3 c){vec3 rgb=clamp(abs(mod(c.x*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);rgb=rgb*rgb*(3.-2.*rgb);return c.z+c.y*(rgb-.5)*(1.-abs(2.*c.z-1.));}
            float hatchLine(vec2 uv,float sc,float ang,float w){vec2 r=vec2(uv.x*cos(ang)-uv.y*sin(ang),uv.x*sin(ang)+uv.y*cos(ang));float n=fbm(uv*15.+ang);float h=abs(sin(r.x*sc+n*3.));return 1.-smoothstep(w,w+.16,h);}
            float carvedLines(vec2 uv){float a=hatchLine(uv,70.*uHatchDensity,.785,.08);float b=hatchLine(uv,55.*uHatchDensity,-.785,.06);float c=hatchLine(uv,95.*uHatchDensity,0.,.045);return clamp(max(max(a,b*.75),c*.45),0.,1.);}
            float outline(vec3 n,vec3 v){float e=1.-max(dot(n,v),0.);return smoothstep(.48,.86,e);}
            vec3 satMix(vec3 c,float s){float g=dot(c,vec3(.299,.587,.114));return mix(vec3(g),c,s);}

            void main(){
                vec3 N=normalize(vNormal);
                vec3 V=normalize(vViewPosition);
                float nd=(fbm(vWorldPosition.xz*(3.5+uDetailStrength*6.)+vWorldPosition.xy*.17)-.5)*uNormalMap*uDetailStrength*.35;
                N=normalize(N+vec3(nd*.45,nd*.25,nd*.35));

                vec3 L1=normalize(vec3(.65,1.0,.55));
                vec3 L2=normalize(vec3(-.55,.35,-.8));
                float diff=max(dot(N,L1),0.)*.88+max(dot(N,L2),0.)*.36;
                float rim=pow(1.-max(dot(V,N),0.),2.2)*(0.25+uGloss*.75);
                vec3 H=normalize(L1+V);
                float spec=pow(max(dot(N,H),0.),mix(14.,90.,uGloss))*(.18+uGloss*.72)*(1.-uRoughness*.7+uMetallic*.55);

                vec3 p=vWorldPosition*uSkinScale;
                float segment=floor((p.x+p.y*.38+p.z*.22)*.42);
                float band=floor((p.z*1.25+p.y*.32)*.74);
                float cell=hash(vec2(segment,band));
                float hue=fract(cell*.61803398875 + segment*.117 + band*.071 + uShaderPreset*.19);
                float region=fract((p.x*.09+p.y*.15+p.z*.05)+cell*.37);
                float edge=smoothstep(.02,.18,min(region,1.-region));
                float carve=carvedLines(vUv*vec2(2.2,1.5)+p.xy*.015);
                float scaleTex=fbm(vUv*(45.+uDetailStrength*42.)+vec2(cell*8.,segment*.25));

            }

            // === SNOUT (UPPER JAW) ===
            const snout = new THREE.CylinderGeometry(p.snoutR1, p.snoutR2, p.snoutL, 16);
            snout.rotateZ(Math.PI/2);
            snout.translate(p.snoutX, p.snoutY, 0);
            geos.push(snout);

            // snout curve (upward/downward tilt)
            if(Math.abs(p.snoutCurve)>0.05){
                const segs=8;
                for(let i=0;i<segs;i++){
                    const t=i/segs;
                    const segLen=p.snoutL/segs;
                    const r=mix(p.snoutR1,p.snoutR2,t);
                    const seg=new THREE.CylinderGeometry(r,r,segLen,12);
                    seg.rotateZ(Math.PI/2);
                    const xOff=p.snoutX-p.snoutL*0.5+segLen*(i+0.5);
                    const yOff=Math.sin(t*Math.PI)*p.snoutCurve*2;
                    seg.translate(xOff,p.snoutY+yOff,0);
                    const a=Math.cos(t*Math.PI)*p.snoutCurve*0.15;
                    seg.rotateZ(a);
                    geos.push(seg);
                }
            }

            // === EYES ===
            const eyeProtrusion=p.eyeProtrusion||0;
            const eyeL=new THREE.SphereGeometry(p.eyeR,16,16,0,Math.PI*2,0,Math.PI/2);
            eyeL.translate(p.eyeX,p.eyeY+eyeProtrusion,p.eyeZ);
            geos.push(eyeL);
            const eyeR=new THREE.SphereGeometry(p.eyeR,16,16,0,Math.PI*2,0,Math.PI/2);
            eyeR.translate(p.eyeX,p.eyeY+eyeProtrusion,-p.eyeZ);
            geos.push(eyeR);

            // brow ridge
            if(p.eyeProtrusion>0.2){
                for(let s=-1;s<=1;s+=2){
                    const browRidge=new THREE.CylinderGeometry(0.2*p.eyeR,0.4*p.eyeR,p.eyeR*1.5,6);
                    browRidge.rotateZ(s*0.15);
                    browRidge.translate(p.eyeX-0.3,p.eyeY+eyeProtrusion+0.2,s*p.eyeZ);
                    geos.push(browRidge);
                }
            }

            // === NOSTRILS ===
            const nz=p.nostrilZ;
            const nL=new THREE.ConeGeometry(p.nostrilR,p.nostrilH,8);
            nL.rotateX(Math.PI);
            nL.translate(p.nostrilX,p.nostrilY,nz);
            geos.push(nL);
            const nR=new THREE.ConeGeometry(p.nostrilR,p.nostrilH,8);
            nR.rotateX(Math.PI);
            nR.translate(p.nostrilX,p.nostrilY,-nz);
            geos.push(nR);

            // === NECK ===
            if(p.neckL>0.5){
                const neck=new THREE.CapsuleGeometry(p.neckR,p.neckL,12,16);
                neck.rotateZ(Math.PI/2);
                neck.rotateZ(p.neckAngle);
                neck.translate(p.neckX,p.neckY,0);
                geos.push(neck);
            }

            // === TORSO ===
            const torsoR1=p.torsoR1,torsoR2=p.torsoR2;
            const torso=new THREE.CapsuleGeometry(torsoR1,p.torsoL,16,32);
            torso.rotateZ(Math.PI/2);
            const arch=p.spineArch||0;
            torso.translate(p.torsoX,p.torsoY,0);
            geos.push(torso);

            // spine arch: add segmented spine bumps
            if(Math.abs(arch)>0.05){
                const segs=10;
                for(let i=0;i<segs;i++){
                    const t=(i/(segs-1)-0.5)*2;
                    const yOff=arch*(1-t*t)*2;
                    if(yOff>0.1){
                        const bump=new THREE.SphereGeometry(0.5,8,8);
                        bump.translate(p.torsoX+t*p.torsoL*0.5,p.torsoY+yOff+1,0);
                        bump.scale(1,0.5,2);
                        geos.push(bump);
                    }
                }
            }

            // === CHEST / BELLY SEGMENTATION ===
            if(p.bellySegCount>0){
                for(let i=0;i<p.bellySegCount;i++){
                    const t=(i/(p.bellySegCount-1||1)-0.5)*p.torsoL;
                    const seg=new THREE.BoxGeometry(1,0.2,p.torsoR1*1.5);
                    seg.translate(p.torsoX+t,p.torsoY-p.torsoR1*0.7,0);
                    geos.push(seg);
                }
            }

            // === SCUTES ===
            const sr=p.scuteRows;
            for(let i=0;i<sr;i++){
                const t=(i/(sr-1||1)-0.5)*p.torsoL;
                for(let j=-1;j<=1;j++){
                    let sc;
                    if(p.scuteType===1){
                        sc=new THREE.ConeGeometry(p.scuteW*0.6,p.scuteH*1.5,8);
                    }else if(p.scuteType===2){
                        sc=new THREE.BoxGeometry(p.scuteW*1.2,p.scuteH*0.4,p.scuteD*1.2);
                    }else{
                        sc=new THREE.BoxGeometry(p.scuteW,p.scuteH,p.scuteD);
                    }
                    sc.translate(p.torsoX+t,p.torsoY+(p.torsoR1||4)*0.9,j*(p.scuteD||1.5));
                    geos.push(sc);
                }
            }

            // === FRONT LEFT LEG ===
            const flUL=p.flUpperL,flR1=p.flUpperR1,flR2=p.flUpperR2,flA=p.flAngle;
            const flLL=p.flLowerL,flLR1=p.flLowerR1,flLR2=p.flLowerR2,flA2=p.flAngle2;
            const flFW=p.flFootW,flFH=p.flFootH,flFD=p.flFootD;

            const flUpper=new THREE.CylinderGeometry(flR1,flR2,flUL,12);
            flUpper.rotateZ(flA);
            flUpper.translate(p.torsoX+5,p.torsoY-p.torsoR1*0.3,4);
            geos.push(flUpper);

            const flLower=new THREE.CylinderGeometry(flLR1,flLR2,flLL,12);
            flLower.rotateZ(flA2);
            flLower.translate(p.torsoX+6,p.torsoY-p.torsoR1*0.3-3,5);
            geos.push(flLower);

            const flFoot=new THREE.BoxGeometry(flFW,flFH,flFD);
            flFoot.translate(p.torsoX+7,p.torsoY-p.torsoR1*0.3-5,5.5);
            geos.push(flFoot);

            // === FRONT RIGHT LEG ===
            const frUL=p.frUpperL,frR1=p.frUpperR1,frR2=p.frUpperR2,frA=p.frAngle;
            const frLL=p.frLowerL,frLR1=p.frLowerR1,frLR2=p.frLowerR2,frA2=p.frAngle2;
            const frFW=p.frFootW,frFH=p.frFootH,frFD=p.frFootD;

            const frUpper=new THREE.CylinderGeometry(frR1,frR2,frUL,12);
            frUpper.rotateZ(frA);
            frUpper.translate(p.torsoX+5,p.torsoY-p.torsoR1*0.3,-4);
            geos.push(frUpper);

            const frLower=new THREE.CylinderGeometry(frLR1,frLR2,frLL,12);
            frLower.rotateZ(frA2);
            frLower.translate(p.torsoX+4,p.torsoY-p.torsoR1*0.3-3,-4);
            geos.push(frLower);

            const frFoot=new THREE.BoxGeometry(frFW,frFH,frFD);
            frFoot.translate(p.torsoX+3.5,p.torsoY-p.torsoR1*0.3-5,-4);
            geos.push(frFoot);

            // === BACK LEFT LEG ===
            const blUL=p.blUpperL,blR1=p.blUpperR1,blR2=p.blUpperR2,blA=p.blAngle;
            const blLL=p.blLowerL,blLR1=p.blLowerR1,blLR2=p.blLowerR2,blA2=p.blAngle2;
            const blFW=p.blFootW,blFH=p.blFootH,blFD=p.blFootD;

            const blUpper=new THREE.CylinderGeometry(blR1,blR2,blUL,12);
            blUpper.rotateZ(blA);
            blUpper.translate(p.torsoX-5,p.torsoY-p.torsoR1*0.3,4);
            geos.push(blUpper);

            const blLower=new THREE.CylinderGeometry(blLR1,blLR2,blLL,12);
            blLower.rotateZ(blA2);
            blLower.translate(p.torsoX-7,p.torsoY-p.torsoR1*0.3-3,5);
            geos.push(blLower);

            const blFoot=new THREE.BoxGeometry(blFW,blFH,blFD);
            blFoot.translate(p.torsoX-8,p.torsoY-p.torsoR1*0.3-5,5.5);
            geos.push(blFoot);

            // === BACK RIGHT LEG ===
            const brUL=p.brUpperL,brR1=p.brUpperR1,brR2=p.brUpperR2,brA=p.brAngle;
            const brLL=p.brLowerL,brLR1=p.brLowerR1,brLR2=p.brLowerR2,brA2=p.brAngle2;
            const brFW=p.brFootW,brFH=p.brFootH,brFD=p.brFootD;

            const brUpper=new THREE.CylinderGeometry(brR1,brR2,brUL,12);
            brUpper.rotateZ(brA);
            brUpper.translate(p.torsoX-5,p.torsoY-p.torsoR1*0.3,-4);
            geos.push(brUpper);

            const brLower=new THREE.CylinderGeometry(brLR1,brLR2,brLL,12);
            brLower.rotateZ(brA2);
            brLower.translate(p.torsoX-7,p.torsoY-p.torsoR1*0.3-3,-5);
            geos.push(brLower);

            const brFoot=new THREE.BoxGeometry(brFW,brFH,brFD);
            brFoot.translate(p.torsoX-8,p.torsoY-p.torsoR1*0.3-5,-5.5);
            geos.push(brFoot);

            // === CLAWS (ALL FEET) ===
            const clawPositions=[
                [p.torsoX+7,p.torsoY-p.torsoR1*0.3-5,5.5],
                [p.torsoX+3.5,p.torsoY-p.torsoR1*0.3-5,-4],
                [p.torsoX-8,p.torsoY-p.torsoR1*0.3-5,5.5],
                [p.torsoX-8,p.torsoY-p.torsoR1*0.3-5,-5.5]
            ];
            for(let fi=0;fi<clawPositions.length;fi++){
                const [cx,cy,cz]=clawPositions[fi];
                for(let i=0;i<p.clawCount;i++){
                    const off=(i-(p.clawCount-1)/2)*0.35;
                    const claw=new THREE.ConeGeometry(p.clawR,p.clawL,8);
                    const curve=p.clawCurve||0;
                    claw.rotateZ(-Math.PI/2+curve);
                    claw.translate(cx,cy,cz+off);
                    geos.push(claw);
                }
            }

            // === TAIL ===
            const tailType=p.tailType;
            const segs=p.tailSeg||16;
            const tBaseR=p.tailBaseR,tBaseL=p.tailBaseL;
            const tMidR1=p.tailMidR1,tMidR2=p.tailMidR2,tMidL=p.tailMidL;
            const tTipR=p.tailTipR,tTipL=p.tailTipL;

            // tail base
            const tb=new THREE.ConeGeometry(tBaseR,tBaseL,16);
            tb.rotateZ(Math.PI/2);
            tb.translate(p.torsoX-4-p.torsoL*0.5,p.torsoY,0);
            geos.push(tb);

            // tail mid (segmented for whip/taper)
            const tailOffX=p.torsoX-4-p.torsoL*0.5-tBaseL*0.5;
            const tm=new THREE.CylinderGeometry(tMidR1,tMidR2,tMidL,16);
            tm.rotateZ(Math.PI/2);
            tm.rotateY(-Math.PI/12);
            tm.translate(tailOffX-tMidL*0.5,p.torsoY-0.5,1);
            geos.push(tm);

            // tail ridges
            const trc=p.tailRidgeCount;
            const ridgeBaseX=tailOffX;
            for(let i=0;i<trc;i++){
                const rd=new THREE.BoxGeometry(p.ridgeW,p.ridgeH,p.ridgeD);
                rd.translate(ridgeBaseX-i*(tMidL/trc),p.torsoY+1,1-i*0.15);
                geos.push(rd);
            }

            // tail tip based on type
            const tipX=tailOffX-tMidL-1;
            if(tailType===0||tailType===3){
                // taper / whip
                const tipLen=tailType===3?tTipL*1.5:tTipL;
                const tipR=tailType===3?tTipR*0.6:tTipR;
                const tt=new THREE.ConeGeometry(tipR,tipLen,16);
                tt.rotateZ(Math.PI/2);
                tt.rotateY(-Math.PI/10);
                tt.translate(tipX,p.torsoY-1,2);
                geos.push(tt);
            }else if(tailType===1){
                // club
                const club=new THREE.SphereGeometry(p.tailClubR||2.5,16,16);
                club.scale(1.2,0.8,1);
                club.translate(tipX,p.torsoY-0.5,1);
                geos.push(club);
                const spike=new THREE.ConeGeometry(tTipR*0.5,tTipL*0.6,8);
                spike.rotateZ(-Math.PI/4);
                spike.translate(tipX+2,p.torsoY+1,1);
                geos.push(spike);
            }else if(tailType===2){
                // paddle
                const padW=p.tailPaddleW||3;
                const paddle=new THREE.BoxGeometry(tTipL*0.8,0.15,padW);
                paddle.rotateY(-Math.PI/12);
                paddle.translate(tipX,p.torsoY-0.5,1);
                geos.push(paddle);
                const padTop=new THREE.CylinderGeometry(0.3,0.5,tTipL*0.6,8);
                padTop.rotateZ(-Math.PI/4);
                padTop.translate(tipX-1,p.torsoY+1,1);
                geos.push(padTop);
            }else if(tailType===4){
                // spike
                const spikeShaft=new THREE.CylinderGeometry(tMidR1*0.5,tTipR,tTipL*1.5,12);
                spikeShaft.rotateZ(Math.PI/2);
                spikeShaft.rotateY(-Math.PI/8);
                spikeShaft.translate(tipX-1,p.torsoY-0.5,2);
                geos.push(spikeShaft);
                for(let s=0;s<4;s++){
                    const sSpike=new THREE.ConeGeometry(0.3,1,8);
                    const sa=s*Math.PI/2;
                    sSpike.translate(tipX-1+Math.cos(sa)*0.5,p.torsoY-0.5+Math.sin(sa)*0.5,2+Math.cos(sa+1)*0.5);
                    geos.push(sSpike);
                }
            }

            // === DORSAL SPIKES ===
            for(let row=0;row<p.spikeRows;row++){
                const rowOff=row*1.2;
                for(let i=0;i<p.spikeCountPerRow;i++){
                    const t=(i/(p.spikeCountPerRow-1||1)-0.5)*p.torsoL;
                    for(let s=-1;s<=1;s+=2){
                        const sp=new THREE.ConeGeometry(0.5*p.spikeSize,2*p.spikeSize,8);
                        sp.rotateZ(s*p.spikeAngle);
                        sp.translate(p.torsoX+t,p.torsoY+(p.torsoR1||4)*0.8,s*rowOff);
                        geos.push(sp);
                    }
                }
            }

            // === SPINE CREST ===
            for(let i=0;i<p.spineCrestCount;i++){
                const t=(i/(p.spineCrestCount-1||1)-0.5)*p.torsoL;
                const crest=new THREE.ConeGeometry(0.3, p.spineCrestHeight, 6);
                crest.translate(p.torsoX+t,p.torsoY+(p.torsoR1||4)*0.9+p.spineCrestHeight*0.4,0);
                geos.push(crest);
            }

            // === HORNS ===
            const ht=p.hornType;
            if(ht>0){
                const hCount=p.hornCount||2;
                for(let i=0;i<hCount;i++){
                    const t=(i/(hCount-1||1)-0.5);
                    const h=new THREE.ConeGeometry(p.hornBase,p.hornLen*(1-0.3*Math.abs(t)),12);
                    if(ht===1){
                        // brow horns
                        h.rotateX(-0.5+t*0.3);
                        h.translate(p.skullX+0.5,p.skullY+p.skullH*0.6,t*p.skullD*0.8);
                    }else if(ht===2){
                        // nose horn
                        h.rotateX(-0.8);
                        h.translate(p.nostrilX-1,p.nostrilY+0.5,t*0.3);
                    }else if(ht===3){
                        // cheek horns
                        h.rotateX(-0.3+t*0.5);
                        h.translate(p.skullX-0.5,p.skullY-p.skullH*0.2,t*p.skullD);
                    }else if(ht===4){
                        // frill
                        h.scale(1.5,1,1);
                        h.rotateX(Math.PI*0.3);
                        h.translate(p.skullX-1,p.skullY+p.skullH*0.3,t*p.skullD*0.6);
                    }else if(ht===5){
                        // crown
                        h.rotateX(-0.2);
                        h.translate(p.skullX+t*1.5,p.skullY+p.skullH*1.2,t*0.5);
                    }
                    geos.push(h);
                }
            }

            // === DORSAL PLATES / SAIL ===
            const pt=p.plateType;
            if(pt>0){
                const pc=p.plateCount;
                for(let i=0;i<pc;i++){
                    const t=(i/(pc-1||1)-0.5)*p.torsoL;
                    if(pt===1){
                        // plates
                        const pl=new THREE.BoxGeometry(p.plateWidth,p.plateHeight,p.plateThickness);
                        pl.translate(p.torsoX+t,p.torsoY+(p.torsoR1||4)*0.8+p.plateHeight*0.5,0);
                        geos.push(pl);
                    }else if(pt===2){
                        // sail (fin)
                        const sailH=p.plateHeight+rng(-0.3,0.3);
                        const sail=new THREE.BoxGeometry(p.plateWidth*1.5+i*0.1,sailH,0.1);
                        sail.translate(p.torsoX+t,p.torsoY+(p.torsoR1||4)*0.8+sailH*0.5,0);
                        geos.push(sail);
                        // sail support rays
                        for(let r=-1;r<=1;r+=2){
                            const ray=new THREE.CylinderGeometry(0.05,0.08,sailH,4);
                            ray.translate(p.torsoX+t+r*0.3,p.torsoY+(p.torsoR1||4)*0.8+sailH*0.5,0);
                            geos.push(ray);
                        }
                    }else if(pt===3){
                        // ridge plates (tortoise-like)
                        const rpl=new THREE.ConeGeometry(p.plateWidth*0.6,p.plateHeight*0.8,6);
                        rpl.translate(p.torsoX+t,p.torsoY+(p.torsoR1||4)*0.7+p.plateHeight*0.4,0);
                        geos.push(rpl);
                        const rpl2=rpl.clone();
                        rpl2.translate(0,0,p.plateWidth*0.8);
                        geos.push(rpl2);
                        const rpl3=rpl.clone();
                        rpl3.translate(0,0,-p.plateWidth*0.8);
                        geos.push(rpl3);
                    }
                }
            }

            // === TEETH (UPPER) ===
            const tc=p.toothCount||6;
            const ts=p.toothSize||0.3;
            const tShape=p.toothShape||0;
            addTeeth(p.snoutX-1,p.snoutY-0.5-ts*0.5,0,tc,ts,tShape,1,p.snoutR1*0.6,0.2);
            addTeeth(p.snoutX-1,p.snoutY-0.5-ts*0.5,0,tc,ts,tShape,-1,p.snoutR1*0.6,0.2);

            // === LOWER JAW (SEPARATE GEOMETRY) ===
            const jR1=p.jawR1,jR2=p.jawR2,jL=p.jawL,jX=p.jawX,jY=p.jawY;
            const jawLower=new THREE.CylinderGeometry(jR1,jR2,jL,16);
            jawLower.rotateZ(Math.PI/2);
            jawLower.translate(jX,jY,0);
            jawGeos.push(jawLower);

            // lower teeth
            addTeeth(p.snoutX-1,p.snoutY-1-ts*0.5,0,tc,ts,tShape,1,p.snoutR1*0.5,0.2);
            addTeeth(p.snoutX-1,p.snoutY-1-ts*0.5,0,tc,ts,tShape,-1,p.snoutR1*0.5,0.2);

            // === TONGUE ===
            if(p.hasTongue){
                const tl=new THREE.CylinderGeometry(p.tongueWidth*0.3,p.tongueWidth,p.tongueLen,8);
                tl.rotateZ(Math.PI/2);
                tl.translate(jX+1,p.jawY-0.5,0);
                tl.rotateZ(0.1);
                jawGeos.push(tl);
                const tf=new THREE.SphereGeometry(p.tongueWidth,8,8);
                tf.scale(1,0.5,1);
                tf.translate(jX+1+p.tongueLen*0.5,p.jawY-0.5+0.3,0);
                jawGeos.push(tf);
            }

            // === MERGE BODY ===
            const mergedBody=mergeGeometries(geos);
            const mergedJaw=mergeGeometries(jawGeos);

            const polyCount=mergedBody.index?mergedBody.index.count/3:mergedBody.attributes.position.count/3;
            const jawPolyCount=mergedJaw.index?mergedJaw.index.count/3:mergedJaw.attributes.position.count/3;
            document.getElementById('polyInfo').textContent='Полигоны: '+(Math.round(polyCount+jawPolyCount));

            const bodyMesh=new THREE.Mesh(mergedBody,mat);
            bodyMesh.castShadow=true;
            meshGroup.add(bodyMesh);

            // === JAW PIVOT ===
            jawPivot=new THREE.Group();
            jawPivot.name='jawPivot';
            jawPivot.position.set(p.jawHingeX||p.skullX,p.jawHingeY||p.skullY-0.5,0);
            meshGroup.add(jawPivot);

            const jawMat=new THREE.ShaderMaterial({
                uniforms: rainbowUniformPack(p),
                vertexShader,fragmentShader
            });

            const jawMeshObj=new THREE.Mesh(mergedJaw,jawMat);
            jawMeshObj.position.set(-(p.jawHingeX||p.skullX),-(p.jawHingeY||p.skullY-0.5),0);
            jawPivot.add(jawMeshObj);

            scene.add(meshGroup);
            document.getElementById('charName').textContent=p.name;
        }

        // ========== MULTI-CLASS PROCEDURAL GENERATORS ==========
        function paletteFor(category){
            return rainbowPaletteFor(category);
        }

        function sketchMaterial(p){
            return new THREE.ShaderMaterial({
                uniforms: rainbowUniformPack(p),
                vertexShader,fragmentShader
            });
        }

        const energyVertexShader=`
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vLocal;
            void main(){
                vUv=uv;vNormal=normal;vLocal=position;
                gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
            }
        `;
        const energyFragmentShader=`
            precision highp float;
            uniform float uTime;
            uniform float uVariant;
            uniform float uMode;
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vLocal;
            float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
            float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
            void main(){
                vec2 q=vUv-.5;
                float radial=1.-smoothstep(.12,.72,length(q));
                float n=noise(vUv*(5.+uVariant*3.)+vec2(0.,-uTime*(1.5+uVariant*.4)));
                float pulse=.72+.28*sin(uTime*(4.+uVariant)+uVariant*7.);
                float pattern=radial;
                if(uMode<.5) pattern*=.72+.28*n;
                else if(uMode<1.5) pattern*=smoothstep(.05,.82,n+vUv.y*.55)*smoothstep(.02,.38,vUv.y);
                else if(uMode<2.5) pattern*=smoothstep(.25,.8,n+abs(sin(atan(q.y,q.x)*(3.+uVariant))));

            if(ankleR)ankleR.rotation.set(-(hipR?hipR.rotation.x:0)*.16-(kneeR?kneeR.rotation.x:0)*.68,0,0);
            if(shoulderL)shoulderL.rotation.set(-walk*.5,bodyWave*.04,.1);if(shoulderR)shoulderR.rotation.set(walk*.5,-bodyWave*.04,-.1);
            if(elbowL)elbowL.rotation.set(.22+Math.max(0,walk)*.48,0,.04);if(elbowR)elbowR.rotation.set(.22+Math.max(0,-walk)*.48,0,-.04);
            if(handL)handL.rotation.z=Math.sin(t*1.37)*.09*a;if(handR)handR.rotation.z=-Math.sin(t*1.37)*.09*a;
            const torso=group.getObjectByName('creatureTorsoRig'),head=group.getObjectByName('creatureHeadRig');
            if(torso){const breathe=1+Math.sin(t*.92)*.018*a;torso.scale.set(breathe,1+Math.sin(t*.92)*.008*a,breathe);torso.rotation.z=bodyWave*.018;}
            if(head){head.rotation.y=Math.sin(t*.39)*.16*a;head.rotation.z=Math.sin(t*.57+1)*.045*a;head.rotation.x=(group.userData.creatureHeadBaseX||0)+Math.sin(t*.47)*.035*a;}
            animateCreatureFace(group,t,a);
        }

        function animateMonsterRig(group,t,a){
            const floatRig=group.getObjectByName('monsterFloatRig'),body=group.getObjectByName('monsterBodyRig'),mouth=group.getObjectByName('monsterMouthRig'),throat=group.getObjectByName('monsterThroat'),teeth=group.getObjectByName('monsterTeethRig');
            if(floatRig){floatRig.position.y=(floatRig.userData.baseY||0)+Math.sin(t*.72)*.22*a;floatRig.rotation.z=Math.sin(t*.47)*.035*a;floatRig.rotation.y=Math.sin(t*.31)*.055*a;}
            if(body){const pulse=1+Math.sin(t*.9)*.025*a;body.scale.set(pulse,1+Math.sin(t*.9+1)*.018*a,pulse);}
            if(mouth){const open=1+(.03+Math.sin(t*1.35)*.025)*a;mouth.scale.set(open,open,1);}
            if(throat){const gulp=1+Math.pow(Math.max(0,Math.sin(t*.62)),5)*.16*a;throat.scale.z=gulp;}
            if(teeth)teeth.rotation.z=Math.sin(t*.38)*.025*a;
            for(let i=0;i<16;i++){
                const eye=group.getObjectByName('monsterEye'+i),aim=group.getObjectByName('monsterEyeAim'+i);
                if(eye){const phase=eye.userData.blinkPhase||i*.7,blink=Math.pow(Math.max(0,Math.sin(t*.55+phase)),32);eye.scale.y=Math.max(.06,1-blink*.94);}
                if(aim){aim.position.x=Math.sin(t*.53+i*.31)*.05*a;aim.position.y=Math.sin(t*.69+i*.47)*.035*a;}
            }
            for(let i=0;i<16;i++)for(let s=0;s<10;s++){
                const segment=group.getObjectByName('monsterTentacle'+i+'_'+s);if(!segment)continue;
                const phase=segment.userData.phase||i*.7+s*.5,travel=t*1.15+phase+s*.58;
                segment.rotation.x=(segment.userData.baseX||0)+Math.sin(travel)*(.13+s*.018)*a;
                segment.rotation.z=(segment.userData.baseZ||0)+Math.cos(travel*.83)*(.11+s*.014)*a;
            }
        }

        function animateGeneratedParts(group,t,a){
            if(!group)return;
            const type=group.userData.animType;
            if(type==='fish'){
                const tail=group.getObjectByName('tailPivot');if(tail)tail.rotation.y=Math.sin(t*3)*.42*a;
                ['finL','finR','topFin'].forEach((n,i)=>{const q=group.getObjectByName(n);if(q)q.rotation.x=Math.sin(t*2.4+i*1.7)*.18*a;});
                group.position.y=Math.sin(t*1.4)*.18*a;
            }
            if(type==='dragon'||type==='dragon_fire'){
                const l=group.getObjectByName('wingLeft'),r=group.getObjectByName('wingRight');
                if(l)l.rotation.x=.18+Math.sin(t*2.2)*.42*a;if(r)r.rotation.x=-.18-Math.sin(t*2.2)*.42*a;
                group.position.y=Math.sin(t*1.1)*.25*a;
                const fire=group.getObjectByName('fireBreath');
                if(fire){fire.scale.x=.82+Math.sin(t*5.3)*.18*a;fire.rotation.x=Math.sin(t*3.7)*.035*a;fire.children.forEach((n,i)=>{if(n.isMesh)n.scale.setScalar(.78+Math.sin(t*7+i*1.7)*.24*a);});}
            }
            if(type&&type.indexOf('human')===0)animateHumanRig(group,t,a);
            if(type==='creature')animateCreatureRig(group,t,a);
            if(type==='monster')animateMonsterRig(group,t,a);
            if(type==='ship'){
                for(let i=0;i<8;i++){const q=group.getObjectByName('ring'+i);if(q)q.rotation.x=t*(.25+i*.08);}
                for(let i=0;i<8;i++){const e=group.getObjectByName('engine'+i);if(e)e.scale.setScalar(1+Math.sin(t*7+i)*.035*a);const exhaust=group.getObjectByName('shipExhaust'+i);if(exhaust){exhaust.scale.x=.82+Math.sin(t*8+i)*.18*a;exhaust.children.forEach((n,j)=>{if(n.isMesh)n.scale.setScalar(.78+Math.sin(t*9+j)*.2*a);});}}
                for(let i=0;i<20;i++){const s=group.getObjectByName('sensor'+i);if(s){const pulse=1+Math.sin(t*4+i)*.08*a;s.scale.set(pulse,.7*pulse,.45*pulse);}}
                group.position.y=Math.sin(t*.8)*.2*a;
            }
            if(type==='steampunk_vehicle'){
                for(let i=0;i<10;i++){const wheel=group.getObjectByName('steamWheel'+i);if(wheel)wheel.rotation.z=-t*1.8*a;const gear=group.getObjectByName('steamGear'+i);if(gear)gear.rotation.z=t*(i%2 ? .8 : -.8)*a;}
                const jet=group.getObjectByName('steamJet');if(jet){jet.scale.x=.78+Math.sin(t*7)*.22*a;jet.children.forEach((n,i)=>{if(n.isMesh)n.scale.setScalar(.75+Math.sin(t*8+i)*.22*a);});}
            }
            if(type==='croc_teeth'){
                const jaw=group.getObjectByName('jawPivot');if(jaw)jaw.rotation.z=-(Math.sin(t*1.15)*.5+.5)*.94*a;
            }
        }

        // ========== АНИМАЦИЯ ==========
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);
            const deltaTime = Math.min((currentTime - lastTime) * 0.001, 0.1);
            lastTime = currentTime;
            if (isAnimating) {
                globalTime += deltaTime * animSpeed;
                if (meshGroup) {
                    meshGroup.traverse(c => {
                        if (c.material && c.material.uniforms) {
                            if(c.material.uniforms.uTime)c.material.uniforms.uTime.value = globalTime;
                            if(c.material.uniforms.uAmplitude)c.material.uniforms.uAmplitude.value = animAmplitude;
                            if(c.material.uniforms.uHatchingIntensity)c.material.uniforms.uHatchingIntensity.value = hatchingIntensity;
                            if(c.material.uniforms.uHatchDensity)c.material.uniforms.uHatchDensity.value = hatchDensity;
                        }
                    });
                }
                // jaw animation
                if (jawPivot) {
                    const jawOpen = (Math.sin(globalTime * 1.2) * 0.5 + 0.5) * animAmplitude * 0.4;
                    jawPivot.rotation.z = jawOpen;
                }
                animateGeneratedParts(meshGroup,globalTime,animAmplitude);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        animate(performance.now());
    </script>
</body>
</html>
