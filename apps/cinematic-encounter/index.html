<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Сцена в пыли · Cinematic Encounter</title>
<link rel="stylesheet" href="/shared/golden-ui-shell.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1011;touch-action:none;font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;color:#fff}
#top{position:absolute;left:max(72px,calc(env(safe-area-inset-left) + 62px));right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(9,11,12,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;color:#fff;text-decoration:none;padding:9px 13px;font-size:12px;box-shadow:0 7px 26px rgba(0,0,0,.16)}
#title{font-weight:800;letter-spacing:.03em}#title small{font-weight:500;opacity:.64;margin-left:7px}
#replay{cursor:pointer;font:700 12px system-ui}
#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.28);font-size:11px;white-space:nowrap;opacity:.78}
#flash{position:fixed;inset:0;z-index:11;pointer-events:none;background:radial-gradient(circle at 31% 43%,rgba(255,241,194,.88),rgba(255,167,70,.18) 25%,transparent 58%);opacity:0;mix-blend-mode:screen}
#vignette{position:fixed;inset:0;z-index:12;pointer-events:none;box-shadow:inset 0 0 20vmax rgba(0,0,0,.52)}
#mobile{display:none;position:absolute;inset:0;pointer-events:none}
.pad{pointer-events:auto;position:absolute;bottom:max(28px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.12);backdrop-filter:blur(3px)}
#movePad{left:max(20px,env(safe-area-inset-left))}
#lookPad{right:max(20px,env(safe-area-inset-right))}
#jumpBtn{pointer-events:auto;position:absolute;right:max(164px,calc(env(safe-area-inset-right) + 164px));bottom:max(56px,calc(env(safe-area-inset-bottom) + 56px));width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.28);color:#fff;font:800 20px system-ui;backdrop-filter:blur(4px)}
.knob{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.32);box-shadow:0 3px 14px rgba(0,0,0,.25)}
@media(pointer:coarse),(max-width:800px){#mobile{display:block}#hint{display:none}#title small{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}
</script>
<script src="/shared/sentry-runtime.js"></script>
</head>
<body>
<div id="flash"></div><div id="vignette"></div>
<div id="ui">
  <div id="top">
    <div class="pill" id="title">СЦЕНА В ПЫЛИ <small>процедурное событие</small></div>
    <button class="pill" id="replay" type="button">↻ Повторить</button>
  </div>
  <div id="hint">WASD / стрелки · мышь — взгляд · Space — прыжок · R — повтор сцены</div>
  <div id="mobile">
    <div class="pad" id="movePad"><div class="knob" id="moveKnob"></div></div>
    <div class="pad" id="lookPad"><div class="knob" id="lookKnob"></div></div>
    <button id="jumpBtn" type="button" aria-label="Прыжок">↑</button>
  </div>
</div>
<script src="/shared/golden-painting-atmosphere.js"></script>
<script src="/shared/graphics/golden-asset-codec.js"></script>
<script type="module" src="./client.js"></script>
<script src="/shared/golden-physics.js"></script>
<script src="/shared/golden-ui-shell.js"></script>
<script src="/shared/quality-telemetry.js"></script>
</body>
</html>
