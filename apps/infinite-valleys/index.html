<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eeede8">
<title>Бесконечные долины — автономный воксельный мир</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e9e5;touch-action:none;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:crosshair}
  #fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;background:#ecece8;color:#111;font:16px system-ui,sans-serif}
</style>
</head>
<body>
<canvas id="world" aria-label="Трёхмерный мир террасированных долин. WASD — движение, мышь — обзор, касание и перемещение пальца — ходьба, два пальца — поворот камеры."></canvas>
<div id="fallback">Для запуска нужен браузер с WebGL 2.</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:true,stencil:false,powerPreference:'high-performance',preserveDrawingBuffer:false});
if(!gl){document.getElementById('fallback').style.display='flex';return;}

// All code, geometry, shaders and assets are embedded. No network, no Three.js, no server.
const VS_TERRAIN=`#version 300 es
precision highp float;
layout(location=0) in vec2 aGrid;
uniform mat4 uVP;
uniform vec2 uCenter;
uniform float uStep;
uniform float uTime;
out vec3 vWorld;
out float vHeight;
out float vMacro;
float soft(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
float heightAt(vec2 p){
 float x=p.x,z=p.y;
 float macro=sin(x*.00115+sin(z*.00051)*1.6)*cos(z*.00091-x*.00022);
 float rolling=sin(x*.00247+z*.00033)*58.0+cos(z*.00183-x*.00071)*49.0;
 float mesa=pow(max(0.0,sin(x*.00163+.4)*cos(z*.00143-.7)),3.0)*130.0;
 float center=sin(z*.00112)*540.0+sin(z*.00267+.85)*185.0+sin(z*.00031+.2)*810.0;
 float d=abs(x-center);
 float bigCanyon=335.0*(1.0-soft(95.0,1200.0,d));
 float branch=abs(z-(sin(x*.00106+1.3)*1700.0-1550.0));
 float tributary=125.0*(1.0-soft(75.0,770.0,branch));
 float h=218.0+115.0*macro+rolling+mesa-bigCanyon-tributary;
 h+=sin(x*.014+sin(z*.008))*4.2;
 return floor(h/18.0)*18.0;
}
void main(){
 vec2 world=uCenter+aGrid*uStep;
 float h=heightAt(world);
 vWorld=vec3(world.x,h,world.y);
 vHeight=h;
 vMacro=aGrid.x;
 gl_Position=uVP*vec4(vWorld,1.0);
}`;
const FS_TERRAIN=`#version 300 es
precision highp float;
in vec3 vWorld;
in float vHeight;
uniform vec3 uEye;
uniform float uTime;
out vec4 outColor;
float hash12(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
 vec3 dx=dFdx(vWorld),dy=dFdy(vWorld);
 vec3 n=normalize(cross(dx,dy));n.y=abs(n.y);
 float up=clamp(n.y,0.0,1.0);
 float sun=clamp(dot(n,normalize(vec3(-.6,1.0,.38))),0.0,1.0);
 float g=mix(.24,.875,pow(up,1.0));
 g+=.09*sun;
 // Subtle visible terrace banding, without textures.
 float rim=1.0-smoothstep(.0,.95,abs(mod(vHeight,18.0)-9.0));
 g+=.018*rim*(1.0-up);
 // Distant canyon floor is the pale winding river.
 if(vHeight< -116.0 && up>.45) g=mix(g,.96,.84);
 float d=length(vWorld-uEye);
 float fog=1.0-exp(-pow(d/9700.0,1.33));
 float horizonColor=.86 +.03*sin(vWorld.x*.00008);
 g=mix(g,horizonColor,clamp(fog,0.0,.92));
 // Slight ordered monochrome grain avoids flat, sterile surfaces.
 float grain=(hash12(floor(gl_FragCoord.xy*.5))-.5)*.009;
 g=clamp(g+grain,0.0,1.0);
 outColor=vec4(vec3(g,g,g*.988),1.0);
}`;
const VS_VOXEL=`#version 300 es
precision highp float;
layout(location=0) in vec2 aCell;
layout(location=1) in vec4 aH;
layout(location=2) in float aS;
uniform mat4 uVP;
uniform float uBlock;
out vec3 vWorld;
out float vFace;
out vec2 vUv;
void main(){
 int vertex=gl_VertexID%6;
 int face=gl_VertexID/6;
 vec2 q;
 if(vertex==0||vertex==3) q=vec2(0.0,0.0);
 else if(vertex==1||vertex==4) q=vec2(1.0,0.0);
 else q=vec2(1.0,1.0);
 if(vertex==5) q=vec2(0.0,1.0);
 float x=aCell.x+q.x*uBlock;
 float z=aCell.y+q.y*uBlock;
 float y=aH.x;
 if(face==1){x=aCell.x+uBlock;z=aCell.y+q.x*uBlock;y=mix(min(aH.z,aH.x),aH.x,q.y);}
 if(face==2){x=aCell.x;z=aCell.y+q.x*uBlock;y=mix(min(aH.y,aH.x),aH.x,q.y);}
 if(face==3){x=aCell.x+q.x*uBlock;z=aCell.y+uBlock;y=mix(min(aS,aH.x),aH.x,q.y);}
 if(face==4){x=aCell.x+q.x*uBlock;z=aCell.y;y=mix(min(aH.w,aH.x),aH.x,q.y);}
 vWorld=vec3(x,y,z);
 vFace=float(face);
 vUv=q;
 gl_Position=uVP*vec4(vWorld,1.0);
}`;
const FS_VOXEL=`#version 300 es
precision highp float;
in vec3 vWorld;
in float vFace;
in vec2 vUv;
uniform vec3 uEye;
out vec4 outColor;
void main(){
 float g;
 if(vFace<.5){
   g=.935;
   float border=min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y));
   float line=1.0-smoothstep(.0,.018,max(0.0,border));
   g-=line*.047;
 }else if(vFace<1.5){g=.32;}
 else if(vFace<2.5){g=.17;}
 else if(vFace<3.5){g=.43;}
 else{g=.24;}
 if(vWorld.y< -116.0 && vFace<.5)g=.985;
 float d=distance(vWorld,uEye);
 float fog=1.0-exp(-pow(d/7600.0,1.38));
 g=mix(g,.87,clamp(fog,0.0,.9));
 outColor=vec4(vec3(g,g,g*.988),1.0);
}`;
const VS_SKY=`#version 300 es
precision highp float;
void main(){
 vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
 gl_Position=vec4(p*2.0-1.0,0.99999,1.0);
}`;
const FS_SKY=`#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;
out vec4 outColor;
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 float g=mix(.87,.965,smoothstep(.0,.88,uv.y));
 float glow=exp(-dot((uv-vec2(.76,.77))*vec2(1.5,1.),(uv-vec2(.76,.77))*vec2(1.5,1.))*9.0);
 g=mix(g,.988,glow*.27);
 float fogband=exp(-pow((uv.y-.42)*5.0,2.0));
 g=mix(g,.91,fogband*.22);
 outColor=vec4(vec3(g,g,g*.992),1.0);
}`;
const VS_HERO=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aColor;
layout(location=2) in float aPart;
layout(location=3) in vec3 aNormal;
uniform mat4 uVP;
uniform vec3 uHero;
uniform float uYaw;
uniform float uTime;
uniform float uWalk;
out vec3 vColor;
out vec3 vNorm;
out vec3 vWorld;
void main(){
 vec3 p=aPos;
 float phase=uTime*10.5;
 if(aPart>0.5&&aPart<2.5){
   float signv=aPart<1.5?1.0:-1.0;
   p.z+=sin(phase+signv*1.57)*1.4*uWalk;
   p.y+=max(0.0,sin(phase+signv*1.57))*.85*uWalk;
 }
 if(aPart>2.5&&aPart<4.5){
   float signv=aPart<3.5?1.0:-1.0;
   p.z+=sin(phase-signv*1.57)*.72*uWalk;
 }
 if(aPart>4.5){
   p.x+=sin(uTime*2.8+p.y*.43)*(.25+.5*(10.0-p.y)/10.0);
   p.z+=cos(uTime*3.1+p.x*.3)*.28;
 }
 p.y+=sin(uTime*2.0)*.10;
 float c=cos(uYaw),s=sin(uYaw);
 vec3 r=vec3(c*p.x-s*p.z,p.y,s*p.x+c*p.z);
 vWorld=uHero+r;
 vNorm=normalize(vec3(c*aNormal.x-s*aNormal.z,aNormal.y,s*aNormal.x+c*aNormal.z));
 vColor=aColor;
 gl_Position=uVP*vec4(vWorld,1.0);
}`;
const FS_HERO=`#version 300 es
precision highp float;
in vec3 vColor;
in vec3 vNorm;
in vec3 vWorld;
uniform vec3 uEye;
out vec4 outColor;
void main(){
 float edge=pow(1.0-abs(dot(normalize(vNorm),normalize(uEye-vWorld))),2.0);
 vec3 c=vColor+edge*.13;
 c+=max(0.0,dot(normalize(vNorm),normalize(vec3(-.4,.8,.45))))*.035;
 outColor=vec4(c,1.0);
}`;

function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw Error(gl.getShaderInfoLog(s));}return s;}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){throw Error(gl.getProgramInfoLog(p));}return p;}
let terrainP,voxelP,skyP,heroP;
try{terrainP=program(VS_TERRAIN,FS_TERRAIN);voxelP=program(VS_VOXEL,FS_VOXEL);skyP=program(VS_SKY,FS_SKY);heroP=program(VS_HERO,FS_HERO);}catch(e){console.error(e);document.getElementById('fallback').textContent='Ошибка WebGL: '+e.message;document.getElementById('fallback').style.display='flex';return;}
const U={};
for(const [name,p,fields] of [['terrain',terrainP,['uVP','uCenter','uStep','uTime','uEye']],['voxel',voxelP,['uVP','uBlock','uEye']],['sky',skyP,['uRes','uTime']],['hero',heroP,['uVP','uHero','uYaw','uTime','uWalk','uEye']]]){
 U[name]={};for(const f of fields)U[name][f]=gl.getUniformLocation(p,f);
}
function smooth(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function heightRaw(x,z){
 const macro=Math.sin(x*.00115+Math.sin(z*.00051)*1.6)*Math.cos(z*.00091-x*.00022);
 const rolling=Math.sin(x*.00247+z*.00033)*58+Math.cos(z*.00183-x*.00071)*49;
 const mesa=Math.pow(Math.max(0,Math.sin(x*.00163+.4)*Math.cos(z*.00143-.7)),3)*130;
 const center=Math.sin(z*.00112)*540+Math.sin(z*.00267+.85)*185+Math.sin(z*.00031+.2)*810;
 const d=Math.abs(x-center);
 const canyon=335*(1-smooth(95,1200,d));
 const branch=Math.abs(z-(Math.sin(x*.00106+1.3)*1700-1550));
 const tributary=125*(1-smooth(75,770,branch));
 return Math.floor((218+115*macro+rolling+mesa-canyon-tributary+Math.sin(x*.014+Math.sin(z*.008))*4.2)/18)*18;
}
const CELL=4,SIDE=64,COUNT=SIDE*SIDE;
const nearData=new Float32Array(COUNT*7);
const nearBuffer=gl.createBuffer(), nearVao=gl.createVertexArray();
gl.bindVertexArray(nearVao);gl.bindBuffer(gl.ARRAY_BUFFER,nearBuffer);gl.bufferData(gl.ARRAY_BUFFER,nearData.byteLength,gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,28,0);gl.vertexAttribDivisor(0,1);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,28,8);gl.vertexAttribDivisor(1,1);
gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,28,24);gl.vertexAttribDivisor(2,1);
gl.bindVertexArray(null);
let lastGridX=NaN,lastGridZ=NaN;
function updateNearby(x,z){
 const gx=Math.floor(x/CELL)*CELL,gz=Math.floor(z/CELL)*CELL;
 if(gx===lastGridX && gz===lastGridZ)return;
 lastGridX=gx;lastGridZ=gz;
 let n=0;
 for(let iz=0;iz<SIDE;iz++)for(let ix=0;ix<SIDE;ix++){
   let wx=gx+(ix-SIDE/2)*CELL,wz=gz+(iz-SIDE/2)*CELL;
   nearData[n++]=wx;nearData[n++]=wz;
   nearData[n++]=heightRaw(wx+CELL*.5,wz+CELL*.5);
   nearData[n++]=heightRaw(wx-CELL*.5,wz+CELL*.5);
   nearData[n++]=heightRaw(wx+CELL*1.5,wz+CELL*.5);
   nearData[n++]=heightRaw(wx+CELL*.5,wz-CELL*.5);
   nearData[n++]=heightRaw(wx+CELL*.5,wz+CELL*1.5);
 }
 gl.bindBuffer(gl.ARRAY_BUFFER,nearBuffer);gl.bufferSubData(gl.ARRAY_BUFFER,0,nearData);
}
function underfoot(x,z){const bx=Math.floor(x/CELL)*CELL,bz=Math.floor(z/CELL)*CELL;return heightRaw(bx+CELL*.5,bz+CELL*.5);}

// One static indexed mesh with a square hole. Each draw changes only cell size.
const GRID=64,HALF=GRID/2,HOLE=16;
function createGrid(ring){
 const verts=[];
 for(let j=0;j<=GRID;j++)for(let i=0;i<=GRID;i++)verts.push(i-HALF,j-HALF);
 const ind=[];
 for(let j=0;j<GRID;j++)for(let i=0;i<GRID;i++){
   const x=i-HALF,z=j-HALF;
   if(ring && x>=-HOLE&&x<HOLE&&z>=-HOLE&&z<HOLE)continue;
   let a=j*(GRID+1)+i,b=a+1,c=a+GRID+1,d=c+1;
   ind.push(a,c,b,b,c,d);
 }
 const vao=gl.createVertexArray(),ibo=gl.createBuffer(),vbo=gl.createBuffer();
 gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(ind),gl.STATIC_DRAW);
 gl.bindVertexArray(null);
 return{vao,count:ind.length};
}
const ringMesh=createGrid(true);
const FAR_LEVELS=[8,16,32,64,128,256,512,1024];

// Single combined character mesh, stylized faceted voxel silhouette.
let heroArray=[];
function tri(a,b,c,col,part){
 let ax=b[0]-a[0],ay=b[1]-a[1],az=b[2]-a[2],bx=c[0]-a[0],by=c[1]-a[1],bz=c[2]-a[2];
 let nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
 let L=Math.hypot(nx,ny,nz)||1;nx/=L;ny/=L;nz/=L;
 for(const v of [a,b,c])heroArray.push(...v,...col,part,nx,ny,nz);
}
function quad(a,b,c,d,col,part){tri(a,b,c,col,part);tri(a,c,d,col,part);}
function box(x,y,z,w,h,d,col,part=0){
 const x0=x-w/2,x1=x+w/2,y0=y-h/2,y1=y+h/2,z0=z-d/2,z1=z+d/2;
 const A=[x0,y0,z0],B=[x1,y0,z0],C=[x1,y1,z0],D=[x0,y1,z0],E=[x0,y0,z1],F=[x1,y0,z1],G=[x1,y1,z1],H=[x0,y1,z1];
 quad(D,C,B,A,col,part);quad(E,F,G,H,col,part);quad(A,E,H,D,col,part);quad(F,B,C,G,col,part);quad(D,H,G,C,col,part);quad(A,B,F,E,col,part);
}
const ink=[.065,.07,.071],deep=[.025,.028,.029],fold=[.12,.127,.13],edge=[.65,.68,.67];
box(-1.35,2.65,.0,1.55,5.0,1.65,deep,1);
box(1.35,2.65,.0,1.55,5.0,1.65,deep,2);
box(-1.35,.53,-.34,1.85,1.1,2.55,ink,1);
box(1.35,.53,-.34,1.85,1.1,2.55,ink,2);
box(0,7.6,0,5.3,6.4,2.9,ink);
box(0,10.1,.1,6.4,1.25,2.9,deep);
box(-3.5,7.65,.2,1.5,5.8,2.15,ink,3);
box(3.5,7.65,.2,1.5,5.8,2.15,ink,4);
box(0,13.07,-.25,3.1,3.25,2.9,deep);
box(0,14.95,.0,4.0,.62,3.3,ink);
box(0,12.95,-1.82,2.1,.28,.34,edge);
box(0,5.95,-1.57,4.2,.35,.4,fold);
// Long asymmetrical cloak flowing from the shoulders.
quad([-2.75,9.3,1.43],[2.75,9.3,1.43],[3.65,2.2,2.25],[-4.05,2.0,2.35],deep,5);
tri([-3.1,2.2,2.35],[3.65,2.2,2.25],[.2,.3,3.5],ink,5);
quad([-2.75,9.3,1.44],[-1.75,9.0,1.6],[-1.75,2.0,2.6],[-4.05,2.0,2.35],fold,5);
// Tiny bright sword on the back.
box(2.28,9.8,2.2,.47,8.9,.45,edge);
box(2.28,7.1,2.3,2.1,.55,.55,deep);
const heroData=new Float32Array(heroArray),heroVertCount=heroData.length/10;
const heroVao=gl.createVertexArray(),heroBuf=gl.createBuffer();
gl.bindVertexArray(heroVao);gl.bindBuffer(gl.ARRAY_BUFFER,heroBuf);gl.bufferData(gl.ARRAY_BUFFER,heroData,gl.STATIC_DRAW);
for(const [loc,size,off] of [[0,3,0],[1,3,12],[2,1,24],[3,3,28]]){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,40,off);}
gl.bindVertexArray(null);

function lookAt(eye,target){
 let zx=eye[0]-target[0],zy=eye[1]-target[1],zz=eye[2]-target[2];let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
 let xx=zz,xy=0,xz=-zx;l=Math.hypot(xx,xz)||1;xx/=l;xz/=l;
 let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
 return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*eye[0]+xy*eye[1]+xz*eye[2]),-(yx*eye[0]+yy*eye[1]+yz*eye[2]),-(zx*eye[0]+zy*eye[1]+zz*eye[2]),1]);
}
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);}
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)o[j*4+i]=a[i]*b[j*4]+a[i+4]*b[j*4+1]+a[i+8]*b[j*4+2]+a[i+12]*b[j*4+3];return o;}
const keys=new Set();
window.addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyQ','KeyE','Space','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='Space')jump();}});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();pointers.clear();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const pointers=new Map();let touchOrigin=null,gestureX=0,gestureY=0,lastTap=0;
function pointerDown(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,mouse:e.pointerType==='mouse',right:e.button===2});
 if(pointers.size===1){touchOrigin={x:e.clientX,y:e.clientY};let now=performance.now();if(now-lastTap<310)jump();lastTap=now;}
 else{let a=[...pointers.values()];gestureX=(a[0].x+a[1].x)*.5;gestureY=(a[0].y+a[1].y)*.5;}
}
function pointerMove(e){let p=pointers.get(e.pointerId);if(!p)return;e.preventDefault();p.x=e.clientX;p.y=e.clientY;
 if(pointers.size>=2){const a=[...pointers.values()];let x=(a[0].x+a[1].x)*.5,y=(a[0].y+a[1].y)*.5;
 cameraYaw+=(x-gestureX)*.004;cameraPitch=Math.max(-.12,Math.min(.23,cameraPitch-(y-gestureY)*.001));gestureX=x;gestureY=y;
 }else if(p.right){cameraYaw+=(p.x-p.sx)*.005;cameraPitch=Math.max(-.12,Math.min(.23,cameraPitch-(p.y-p.sy)*.002));p.sx=p.x;p.sy=p.y;}
}
function pointerUp(e){pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];touchOrigin={x:p.x,y:p.y};}else touchOrigin=null;}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);

let px=825,pz=520,py=underfoot(px,pz),vy=0,onGround=true,heroYaw=0;
let cameraYaw=0.18,cameraPitch=0;
let cx=px+40,cy=py+155,cz=pz+210,tx=px,ty=py-100,tz=pz-450;
let movementAmount=0,worldTime=0;
function jump(){if(onGround){vy=18.5;onGround=false;}}
function frameLogic(dt){
 worldTime+=dt;
 const f=[Math.sin(cameraYaw),-Math.cos(cameraYaw)],r=[Math.cos(cameraYaw),Math.sin(cameraYaw)];
 let side=0,front=0;
 if(keys.has('KeyW')||keys.has('ArrowUp'))front++;
 if(keys.has('KeyS')||keys.has('ArrowDown'))front--;
 if(keys.has('KeyD')||keys.has('ArrowRight'))side++;
 if(keys.has('KeyA')||keys.has('ArrowLeft'))side--;
 if(keys.has('KeyQ'))cameraYaw-=dt*.85;
 if(keys.has('KeyE'))cameraYaw+=dt*.85;
 if(pointers.size===1){let p=[...pointers.values()][0];if(!p.right&&touchOrigin){const dx=(p.x-touchOrigin.x)/68,dy=(touchOrigin.y-p.y)/68;side+=Math.max(-1,Math.min(1,dx));front+=Math.max(-1,Math.min(1,dy));}}
 let len=Math.hypot(side,front);if(len>1){side/=len;front/=len;len=1;}
 movementAmount+=(len-movementAmount)*Math.min(1,dt*11);
 let mvx=f[0]*front+r[0]*side,mvz=f[1]*front+r[1]*side;
 const speed=keys.has('ShiftLeft')||keys.has('ShiftRight')?39:25;
 if(len>.035){
   let nx=px+mvx*speed*dt,nz=pz+mvz*speed*dt;
   let nh=underfoot(nx,nz);
   // A solid vertical terrace wall blocks ascent; descending is allowed.
   if(nh<=py+4.1||!onGround){px=nx;pz=nz;}
   let desired=Math.atan2(-mvx,-mvz);let delta=Math.atan2(Math.sin(desired-heroYaw),Math.cos(desired-heroYaw));heroYaw+=delta*Math.min(1,dt*9);
 }
 vy-=42*dt;py+=vy*dt;
 const floor=underfoot(px,pz);
 if(py<=floor){py=floor;vy=0;onGround=true;}else onGround=false;
 const back=220,height=167,pull=485;
 const goalEye=[px-f[0]*back,py+height,pz-f[1]*back];
 const goalTarget=[px+f[0]*pull,py-82+cameraPitch*500,pz+f[1]*pull];
 const smoothing=1-Math.exp(-dt*3.3);
 cx+=(goalEye[0]-cx)*smoothing;cy+=(goalEye[1]-cy)*smoothing;cz+=(goalEye[2]-cz)*smoothing;
 tx+=(goalTarget[0]-tx)*smoothing;ty+=(goalTarget[1]-ty)*smoothing;tz+=(goalTarget[2]-tz)*smoothing;
 updateNearby(px,pz);
}

let width=0,height=0,resolutionScale=1,slowFrames=0,fastFrames=0;
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,1.55);
 const mobile=window.innerWidth<840;
 const target=Math.min(mobile?0.85:1.0,1200/Math.max(window.innerWidth*dpr,window.innerHeight*dpr));
 resolutionScale=Math.min(resolutionScale,target);
 const w=Math.max(2,Math.round(window.innerWidth*dpr*resolutionScale));
 const h=Math.max(2,Math.round(window.innerHeight*dpr*resolutionScale));
 if(w!==width||h!==height){width=w;height=h;canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
}
window.addEventListener('resize',()=>{resolutionScale=1;resize();});
resize();
const debug=location.hash.includes('stats');let stats=null;if(debug){stats=document.createElement('div');stats.style='position:fixed;left:8px;top:8px;background:#fff8;color:#111;font:12px monospace;padding:6px;pointer-events:none';document.body.appendChild(stats);}
function render(){
 const fov=(window.innerWidth<600?73:65)*Math.PI/180;
 const vp=mul(perspective(fov,width/height,.35,45500),lookAt([cx,cy,cz],[tx,ty,tz]));
 gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.depthFunc(gl.LEQUAL);
 gl.clearColor(.94,.94,.93,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.disable(gl.DEPTH_TEST);gl.useProgram(skyP);gl.uniform2f(U.sky.uRes,width,height);gl.uniform1f(U.sky.uTime,worldTime);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.enable(gl.DEPTH_TEST);
 gl.useProgram(terrainP);
 gl.uniformMatrix4fv(U.terrain.uVP,false,vp);gl.uniform2f(U.terrain.uCenter,px,pz);gl.uniform3f(U.terrain.uEye,cx,cy,cz);gl.uniform1f(U.terrain.uTime,worldTime);
 gl.bindVertexArray(ringMesh.vao);
 // Back to front, all rings share one immutable mesh.
 for(let i=FAR_LEVELS.length-1;i>=0;i--){gl.uniform1f(U.terrain.uStep,FAR_LEVELS[i]);gl.drawElements(gl.TRIANGLES,ringMesh.count,gl.UNSIGNED_SHORT,0);}
 gl.useProgram(voxelP);gl.uniformMatrix4fv(U.voxel.uVP,false,vp);gl.uniform1f(U.voxel.uBlock,CELL);gl.uniform3f(U.voxel.uEye,cx,cy,cz);
 gl.bindVertexArray(nearVao);gl.drawArraysInstanced(gl.TRIANGLES,0,30,COUNT);
 gl.useProgram(heroP);gl.uniformMatrix4fv(U.hero.uVP,false,vp);gl.uniform3f(U.hero.uHero,px,py,pz);gl.uniform1f(U.hero.uYaw,heroYaw);gl.uniform1f(U.hero.uTime,worldTime);gl.uniform1f(U.hero.uWalk,movementAmount);gl.uniform3f(U.hero.uEye,cx,cy,cz);
 gl.bindVertexArray(heroVao);gl.drawArrays(gl.TRIANGLES,0,heroVertCount);
 gl.bindVertexArray(null);
}
let last=performance.now(),tick=0;
updateNearby(px,pz);
function loop(now){
 let dt=Math.min((now-last)/1000,.05);last=now;
 frameLogic(dt);
 tick++;if(tick%45===0){
   if(dt>.032){slowFrames++;fastFrames=0;}else if(dt<.019){fastFrames++;slowFrames=0;}
   if(slowFrames>=2){resolutionScale=Math.max(.45,resolutionScale*.91);slowFrames=0;resize();}
   else if(fastFrames>=5){resolutionScale=Math.min(1,resolutionScale*1.06);fastFrames=0;resize();}
   if(stats)stats.textContent=`${Math.round(1/Math.max(dt,.001))} FPS | ${width}x${height} | (${px|0},${pz|0})`;
 }
 render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
