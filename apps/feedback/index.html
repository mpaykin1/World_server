<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Improve World — Feedback</title><style>body{margin:auto;max-width:880px;padding:24px;font:16px system-ui;background:#0b0d12;color:#eef}header{display:flex;justify-content:space-between;gap:16px;align-items:center}main{display:grid;gap:28px}.hero{text-align:center;padding:40px 0}.roadmap{display:grid;gap:10px}.item{border:1px solid #334;padding:12px;border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:10px}.meta{font-size:12px;opacity:.7}.votes{display:flex;gap:4px;align-items:center}button{padding:6px 9px}a{color:inherit}</style></head><body><header><strong>IMPROVE WORLD</strong><span id=lang></span></header><main><section class=hero><h1 data-i18n=sendFeedback>Send feedback</h1><p data-i18n=feedbackPlaceholder>What should we improve?</p><p><a href="/">← Improve World</a></p></section><section><h2>Community roadmap</h2><div id=roadmap class=roadmap></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/shared/i18n/world-i18n.js"></script><script src="/shared/i18n/world-language-switcher.js"></script><script src="/shared/feedback/world-feedback-outbox.js"></script><script src="/shared/feedback/world-feedback-widget.js"></script><script>(async()=>{await WorldI18n.init();lang.replaceChildren(WorldI18n.createSelector());WorldFeedbackWidget.mount();const cfg=await fetch('/api/config').then(r=>r.json()),sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let {data:{session}}=await sb.auth.getSession();if(!session)session=(await sb.auth.signInAnonymously()).data.session;const render=async()=>{const b=await fetch('/api/feedback-roadmap').then(r=>r.json());roadmap.replaceChildren(...(b.items||[]).slice(0,40).map(x=>{const d=document.createElement('div');d.className='item';const text=document.createElement('div');const title=document.createElement('strong');title.textContent=x.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${x.category} · ${x.occurrences} reports · priority ${x.priority_score} · ${x.status}`;text.append(title,meta);const votes=document.createElement('div');votes.className='votes';const down=document.createElement('button'),score=document.createElement('span'),up=document.createElement('button');down.textContent='−';up.textContent='+';score.textContent=String(x.vote_score||0);for(const [btn,v] of [[down,-1],[up,1]])btn.onclick=async()=>{if(!session?.access_token)return;await fetch('/api/feature-vote',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({candidateKey:x.cluster_key,vote:v})});await render()};votes.append(down,score,up);d.append(text,votes);return d}))};await render()})().catch(console.error)</script></body></html>
