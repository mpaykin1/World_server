<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Server — OLD 1× / NEW 10× voxel viewer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10191e;font:14px system-ui;color:#e8f3ed;overflow:hidden}
canvas{display:block;touch-action:none}main{position:fixed;inset:0}
header{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:2;max-width:min(620px,calc(100vw - 16px));padding:10px;background:#0c1922e8;border:1px solid #3c6675;border-radius:12px;backdrop-filter:blur(8px)}
h1{font-size:17px;margin:0 0 5px}p{margin:0 0 7px;line-height:1.3;color:#b5ced2}
nav,.controls{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.group{display:flex;gap:4px;padding:3px;border:1px solid #39545f;border-radius:9px}
button{cursor:pointer;padding:7px 9px;border:1px solid #567883;border-radius:7px;background:#213c45;color:#e7faf4;font:inherit;min-height:36px}
button[aria-pressed="true"]{background:#388b74;border-color:#82dcc1;color:white}button:focus-visible{outline:3px solid #ffcb69}
#status{margin-top:7px;font-size:12px;color:#c3d9dc;max-width:590px}
footer{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));z-index:2;background:#0c1922c9;border-radius:7px;padding:7px 10px;color:#bfd0d7;font-size:12px}
@media(max-width:620px){
header{right:8px;padding:6px;max-width:none}h1,p,footer{display:none}
nav,.controls{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin-top:3px}
nav::-webkit-scrollbar,.controls::-webkit-scrollbar{display:none}.group{flex:0 0 auto;padding:2px}
button{flex:0 0 auto;padding:5px 7px;font-size:10px;min-height:30px}
#status{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<main id="stage" aria-label="Сравнение восьми оригинальных 3D-моделей World Server"></main>
<header>
<h1>World Server · 8 моделей · OLD 1× ↔ NEW 10×</h1>
<p>Поворот — пальцем/мышью, zoom — pinch/колесом. Debug semantic regions выключен по умолчанию.</p>
<nav id="choices" aria-label="Выбор модели">
<button data-kind="barren" aria-pressed="true">Земля</button><button data-kind="city">Город</button>
<button data-kind="forest">Лес</button><button data-kind="volcano">Вулкан</button>
<button data-kind="energy">Энергия</button><button data-kind="idea">Идея</button>
<button data-kind="river">Река</button><button data-kind="villager">Житель</button>
</nav>
<div class="controls">
<div class="group" id="versions" aria-label="Версия"><button data-version="old">OLD 1×</button><button data-version="new" aria-pressed="true">NEW 10×</button></div>
<div class="group" id="lods" aria-label="LOD"><button data-lod="0" aria-pressed="true">LOD0</button><button data-lod="1">LOD1</button><button data-lod="2">LOD2</button></div>
<div class="group"><button id="animation" aria-pressed="true">Анимация</button><button id="semantic" aria-pressed="false">Semantic debug</button></div>
</div>
<div id="status" role="status" aria-live="polite">Загрузка локальных GLB…</div>
</header>
<footer>Оригинальная procedural voxel-art графика · Blender 5.1 · GLB · 3 LOD · без runtime API</footer>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
