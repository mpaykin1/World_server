<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Server — Мир</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#worldFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#02050b}
#worlds{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:10px 14px;border-radius:999px;background:#07101dcc;border:1px solid #ffffff2d;color:#fff;text-decoration:none;font-weight:800;font-size:13px;backdrop-filter:blur(9px)}
#status{position:fixed;z-index:30;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));max-width:72vw;padding:7px 10px;border-radius:999px;background:#07101dcc;border:1px solid #ffffff22;font-size:11px;opacity:.86}
</style>
</head>
<body>
<iframe id="worldFrame" title="Игровой мир" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe>
<a id="worlds" href="/apps/catalog/">Миры</a><div id="status">Соединяем технологии мира…</div>
<script>document.documentElement.dataset.capabilityWorld=(new URLSearchParams(location.search).get('world')||'external-world').toLowerCase();</script>
<script src="/shared/benchmark-capability-runtime.js"></script>
<script src="./client.js"></script>
</body>
</html>
