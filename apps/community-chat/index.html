<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Improve World — Community</title><style>body{margin:auto;max-width:980px;padding:20px;font:15px system-ui;background:#090b10;color:#eee}header,.composer,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.log{height:55vh;overflow:auto;border:1px solid #334;border-radius:12px;padding:12px;margin:18px 0}.msg{padding:8px;border-bottom:1px solid #223}.translated{opacity:.82;padding-inline-start:18px}.meta{font-size:11px;opacity:.65}.actions{display:inline-flex;gap:5px;margin-inline-start:8px}.actions button{font-size:11px}.composer input{flex:1;min-width:180px;padding:10px}button{padding:8px 10px}.warn{color:#ffcf66}</style></head><body><header><strong data-i18n=chat>Chat</strong><span id=lang></span></header><div class=tools><span id=status data-i18n=connecting>Connecting…</span><button id=voice type=button data-i18n=voice>Voice translate</button><span id=voiceStatus></span></div><div class=log id=log></div><form class=composer id=form><input id=text maxlength=2000 data-i18n-placeholder=messagePlaceholder placeholder="Message…"><button data-i18n=send>Send</button></form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/i18n/world-i18n.js"></script><script src="/shared/multiplayer/world-state-codec.js"></script><script src="/shared/multiplayer/world-player-state-authority.js"></script><script src="/shared/multiplayer/world-offline-outbox.js"></script><script src="/shared/multiplayer/world-community-safety.js"></script><script src="/shared/multiplayer/world-multiplayer-bridge.js"></script><script src="/shared/multiplayer/world-webrtc-voice.js"></script><script src="/shared/multiplayer/world-live-translate.js"></script>
<script>(async()=>{await WorldI18n.init();lang.replaceChildren(WorldI18n.createSelector());const cfg=await fetch('/api/config').then(r=>r.json());const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();session=r.data.session}const uid=session?.user?.id;if(!uid){status.textContent='Auth unavailable';return}const safety=new WorldCommunitySafety(),bridge=new WorldMultiplayerBridge({supabase:sb,user:{id:uid,nickname:'Guest-'+uid.slice(0,5)},locale:WorldI18n.locale});bridge.safety=safety;bridge.addEventListener('status',e=>status.textContent=e.detail.status);bridge.addEventListener('reconnect',e=>status.textContent=`reconnect ${e.detail.attempt}`);bridge.addEventListener('outbox',e=>{if(e.detail.remaining)status.textContent=`offline queue: ${e.detail.remaining}`});bridge.addEventListener('chat',e=>add(e.detail,false));bridge.addEventListener('translation',e=>add(e.detail,true));window.addEventListener('world:locale',e=>bridge.setLocale(e.detail.locale));
function add(m,tr){const key=(m.id||m.client_message_id||'')+'|'+tr;if(key&&document.querySelector(`[data-key="${CSS.escape(key)}"]`))return;const d=document.createElement('div');d.className='msg '+(tr?'translated':'');if(key)d.dataset.key=key;const who=document.createElement('strong');who.textContent=(tr?'↳ ':'')+(m.nickname||'Player')+': ';const txt=document.createElement('span');txt.textContent=m.displayText;d.append(who,txt);if(tr&&m.text&&m.displayText&&m.displayText!==m.text){const a=document.createElement('span');a.className='actions';const correct=document.createElement('button');correct.type='button';correct.textContent=WorldI18n.t('correctTranslation');correct.onclick=async()=>{const suggested=prompt(WorldI18n.t('correctTranslation'),m.displayText);if(!suggested||suggested===m.displayText)return;try{const r=await fetch('/api/translation-correction',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({worldId:bridge.worldId,source:m.sourceLanguage,target:WorldI18n.locale,sourceText:m.text,suggestedTranslation:suggested})});correct.textContent=r.ok?'✓':'!'}catch{correct.textContent='!'}};a.append(correct);d.append(a)}if(!tr&&m.userId&&m.userId!==uid){const a=document.createElement('span');a.className='actions';const mute=document.createElement('button');mute.type='button';mute.textContent=WorldI18n.t('mute');mute.onclick=()=>{safety.mute(m.userId,true);d.remove()};const report=document.createElement('button');report.type='button';report.textContent=WorldI18n.t('report');report.onclick=async()=>{try{await safety.report({accessToken:session.access_token,message:m,reason:'other'});report.textContent='✓'}catch{report.textContent='!'}};a.append(mute,report);d.append(a)}if(m.replayed){const meta=document.createElement('span');meta.className='meta';meta.textContent=' replay';d.append(meta)}log.append(d);log.scrollTop=log.scrollHeight}
await bridge.connect();form.onsubmit=async e=>{e.preventDefault();const v=text.value.trim();if(!v)return;const id=crypto.randomUUID();add({id,nickname:'You',displayText:v,userId:uid},false);await bridge.sendChat(v,{clientMessageId:id});text.value=''};
let voiceMesh=null,translators=[];voice.onclick=async()=>{if(voiceMesh){for(const t of translators)await t.stop();translators=[];await voiceMesh.stop();voiceMesh=null;voiceStatus.textContent='';return}try{voiceMesh=new WorldWebRTCVoice({bridge,accessToken:session.access_token});voiceMesh.addEventListener('capacity',()=>voiceStatus.textContent='SFU required for larger room');voiceMesh.addEventListener('remote-stream',async e=>{if(translators.length>=2){const a=document.createElement('audio');a.autoplay=true;a.srcObject=e.detail.stream;document.body.append(a);return}try{const t=new WorldLiveTranslate({accessToken:session.access_token,targetLanguage:WorldI18n.locale});await t.start(e.detail.stream);translators.push(t);voiceStatus.textContent='voice translated'}catch{const a=document.createElement('audio');a.autoplay=true;a.srcObject=e.detail.stream;document.body.append(a);voiceStatus.textContent='original voice (translator unavailable)'}});await voiceMesh.start();voiceStatus.textContent='voice on'}catch(e){voiceStatus.textContent=e.message;voiceMesh=null}};
})().catch(e=>status.textContent=e.message)</script></body></html>
