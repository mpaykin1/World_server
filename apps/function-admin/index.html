<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Improve World — Function Admin</title><style>body{font-family:system-ui;background:#0b0d12;color:#eef;max-width:1000px;margin:auto;padding:24px}button,input,select{font:inherit;padding:10px;margin:4px;background:#171b24;color:#eef;border:1px solid #394052;border-radius:8px}.card{border:1px solid #303748;border-radius:12px;padding:16px;margin:12px 0}.warn{color:#ffd27a}.ok{color:#9cffb0}code{word-break:break-all}</style><h1>Function Admin</h1><p class="warn">This console never uploads or evaluates code. Code ships only in an immutable revision after Git/GDD/tests/sandbox/provenance.</p><div><input id="token" type="password" placeholder="Admin bearer token"><button onclick="loadCatalog()">Load catalog</button></div><div id="out"></div><script>
const out=document.querySelector('#out');const auth=()=>({'Authorization':'Bearer '+document.querySelector('#token').value,'Content-Type':'application/json'});
async function loadCatalog(){const r=await fetch('/api/function-catalog');const j=await r.json();out.innerHTML=(j.functions||j.packages||[]).map(f=>`<div class=card><b>${f.id||f.function_id}</b> <code>${f.version||''}</code><p>${(f.capabilities||[]).join(', ')}</p><select id="slot-${f.id}"><option>sandbox</option><option>navigator</option></select><select id="roll-${f.id}">${[0,1,5,25,50,100].map(x=>`<option>${x}</option>`).join('')}</select>% <input id="ev-${f.id}" placeholder="evidenceRef"><button onclick="setRollout('${f.id}','${f.version}')">Apply rollout</button><button onclick="setRollout('${f.id}','${f.version}',0)">Disable / rollback function</button></div>`).join('')||'<p>No bundled functions.</p>'}
async function setRollout(id,version,forced){const rollout=forced??Number(document.querySelector('#roll-'+id).value),slot=document.querySelector('#slot-'+id).value,evidenceRef=document.querySelector('#ev-'+id).value;const r=await fetch('/api/function-admin',{method:'POST',headers:auth(),body:JSON.stringify({functionId:id,version,slot,enabled:rollout>0,rolloutPercent:rollout,evidenceRef})});const j=await r.json();alert(r.ok?'Saved. Cloud Run revision traffic is managed separately and still needs release evidence.':JSON.stringify(j))}
</script></html>
