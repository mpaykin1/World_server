<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 3D Factory</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">WORLD SERVER · SERVER-SIDE 3D</div>
        <h1>AI 3D Factory</h1>
        <p>Картинка → depth → TRELLIS.2 → GLB, плюс процедурные здания и города.</p>
      </div>
      <div id="health" class="health">Проверяю worker…</div>
    </header>

    <section class="card controls">
      <label>Режим
        <select id="mode">
          <option value="auto">AUTO: картинка → Depth + TRELLIS.2</option>
          <option value="image_to_3d">Картинка → 3D (TRELLIS.2)</option>
          <option value="depth">Карта глубины (Depth Anything V2 Small)</option>
          <option value="building">Процедурное здание</option>
          <option value="map">Город / terrain / dungeon</option>
        </select>
      </label>

      <label id="fileWrap">Исходная картинка
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
      </label>

      <div id="buildingParams" class="paramGrid hidden">
        <label>Этажи <input id="floors" type="number" min="1" max="50" value="8"></label>
        <label>Длина <input id="length" type="number" min="1" max="40" value="8"></label>
        <label>Ширина <input id="width" type="number" min="1" max="40" value="4"></label>
        <label>Seed <input id="buildingSeed" type="number" value="42"></label>
        <label>Low poly <select id="lowPoly"><option value="0">Нет</option><option value="1">Да</option></select></label>
      </div>

      <div id="mapParams" class="paramGrid hidden">
        <label>Preset
          <select id="preset">
            <option value="METROPOLE">Metropole</option>
            <option value="KLEINSTADT">Kleinstadt</option>
            <option value="DORF">Dorf</option>
            <option value="INDUSTRIAL">Industrial</option>
          </select>
        </label>
        <label>Seed <input id="mapSeed" type="number" value="42"></label>
        <label><span>City</span><input id="mapCity" type="checkbox" checked></label>
        <label><span>Terrain</span><input id="mapTerrain" type="checkbox" checked></label>
        <label><span>Dungeon</span><input id="mapDungeon" type="checkbox"></label>
      </div>

      <details>
        <summary>Продвинутые параметры</summary>
        <textarea id="advanced" spellcheck="false" placeholder='{"decimationTarget": 500000, "textureSize": 2048}'></textarea>
      </details>

      <button id="generate" type="button">Сгенерировать на сервере</button>
    </section>

    <section class="card result">
      <div class="resultHead"><strong id="state">Готово к запуску</strong><span id="percent">0%</span></div>
      <div class="bar"><div id="bar"></div></div>
      <pre id="log">Основные вычисления выполняет AI3D GPU worker. Браузер только отправляет задание и получает результат.</pre>
      <div id="files" class="files"></div>
    </section>
  </main>
  <script src="./client.js" defer></script>
</body>
</html>
