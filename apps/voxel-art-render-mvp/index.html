<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>Voxel Keep · World Server</title>
<link rel="stylesheet" href="/shared/golden-ui-shell.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;touch-action:none;font-family:Inter,system-ui,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card{border:1px solid rgba(255,255,255,.16);background:rgba(5,8,13,.54);backdrop-filter:blur(10px);border-radius:16px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
#brand{font-weight:900;letter-spacing:.12em;font-size:12px}
#stats{font-size:12px;line-height:1.55;text-align:right}
#objective{position:absolute;left:50%;top:max(76px,calc(env(safe-area-inset-top) + 76px));transform:translateX(-50%);max-width:min(84vw,520px);text-align:center;font-size:13px}
#reticle{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#reticle:before,#reticle:after{content:"";position:absolute;background:rgba(255,255,255,.76);border-radius:2px}
#reticle:before{left:8px;top:1px;width:2px;height:16px}#reticle:after{left:1px;top:8px;width:16px;height:2px}
#message{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.44);font-size:12px;opacity:0;transition:opacity .2s}
#message.show{opacity:1}
#restart{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,20,.58);color:#fff;border-radius:999px;padding:9px 13px;font-weight:800}
#mobile{display:none;position:absolute;inset:0;pointer-events:none}
.pad{pointer-events:auto;position:absolute;bottom:max(26px,env(safe-area-inset-bottom));width:118px;height:118px;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(0,0,0,.13)}
#movePad{left:max(18px,env(safe-area-inset-left))}#lookPad{right:max(18px,env(safe-area-inset-right))}
.knob{position:absolute;left:37px;top:37px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28)}
#shootBtn{pointer-events:auto;position:absolute;right:max(154px,calc(env(safe-area-inset-right) + 154px));bottom:max(48px,calc(env(safe-area-inset-bottom) + 48px));width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,206,114,.5);background:rgba(89,49,17,.42);color:#ffe3a5;font:900 20px system-ui}
#desktopHint{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11px;opacity:.62;white-space:nowrap}
@media(pointer:coarse),(max-width:800px){#mobile{display:block}#desktopHint{display:none}#objective{top:max(70px,calc(env(safe-area-inset-top) + 70px));font-size:12px}.card{padding:8px 10px}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}
</script>
<script src="/shared/graphics/golden-quality-director.js"></script>
<script src="/shared/golden-painting-atmosphere.js"></script>
<script src="/shared/graphics/golden-asset-codec.js"></script>
</head>
<body>
<div id="hud">
  <div id="top">
    <div class="card" id="brand">VOXEL KEEP</div>
    <div class="card" id="stats"><div id="crystals">Кристаллы 0/5</div><div id="health">Здоровье 100</div><button id="restart" type="button">↻ заново</button></div>
  </div>
  <div class="card" id="objective">Собери 5 кристаллов. После этого войди в огненный маяк.</div>
  <div id="reticle" aria-hidden="true"></div>
  <div id="message" aria-live="polite"></div>
  <div id="desktopHint">WASD / стрелки — движение · мышь — обзор · F / клик — выстрел</div>
  <div id="mobile">
    <div class="pad" id="movePad" aria-label="Движение"><div class="knob" id="moveKnob"></div></div>
    <div class="pad" id="lookPad" aria-label="Обзор"><div class="knob" id="lookKnob"></div></div>
    <button id="shootBtn" type="button" aria-label="Выстрел">✦</button>
  </div>
</div>
<script type="module" src="./client.js"></script>
<script src="/shared/golden-ui-shell.js"></script>
<script src="/shared/quality-telemetry.js"></script>
</body>
</html>
