<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>World Server Graphics Quality Governor</title>
<style>
:root{color-scheme:dark;--glass:rgba(7,10,14,.72);--line:rgba(255,255,255,.18);--text:#f5efe5;--muted:#aab3bd;--ok:#8df0ae;--bad:#ff8a78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#05070a}
#top{position:fixed;z-index:5;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 16px 55px rgba(0,0,0,.35)}
#badge{padding:9px 11px;border-radius:12px;max-width:72vw}#badge strong{display:block;font-size:12px;letter-spacing:.08em}#badge span{font-size:10px;color:var(--muted)}
#fps{padding:8px 10px;border-radius:12px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#dce4ea}
#controls{position:fixed;z-index:6;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px;border-radius:18px}
button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.065);color:white;font:700 11px ui-sans-serif,system-ui;letter-spacing:.04em}
button.active{background:rgba(255,169,86,.18);border-color:rgba(255,183,99,.72);box-shadow:0 0 28px rgba(255,130,55,.18)}
button.bad.active{background:rgba(255,80,64,.18);border-color:rgba(255,110,90,.7)}
#secondary{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:7px}
#report{position:fixed;z-index:10;inset:max(70px,calc(env(safe-area-inset-top) + 58px)) 10px max(112px,calc(env(safe-area-inset-bottom) + 100px)) 10px;display:none;overflow:auto;padding:13px;border-radius:18px}
#report.show{display:block}#report h2{font-size:16px;margin:0 0 7px}#statusline{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:10px}
.gate{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:11px}.pass{color:var(--ok)}.fail{color:var(--bad)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.metric{padding:8px;border-radius:10px;background:rgba(255,255,255,.045);font-size:9px;color:var(--muted)}.metric b{display:block;margin-top:2px;font-size:12px;color:white}
#hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:max(112px,calc(env(safe-area-inset-bottom) + 100px));padding:7px 10px;border-radius:12px;font-size:10px;color:#d5dde5;white-space:nowrap;pointer-events:none}
#debug{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}#debug.show{display:block}.debug-label{position:absolute;border:1px solid rgba(93,223,255,.62);background:rgba(0,35,48,.4);color:#bff5ff;font:9px ui-monospace,monospace;padding:3px 5px;border-radius:5px}
@media(min-width:700px){#controls{width:620px;left:50%;right:auto;transform:translateX(-50%)}#report{width:460px;left:14px;right:auto}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="debug">
  <div class="debug-label" style="left:5%;top:37%">MESO · arch/support</div>
  <div class="debug-label" style="right:5%;top:47%">MICRO · pipes/panels</div>
  <div class="debug-label" style="left:55%;top:67%">NEAR · survey instrument</div>
  <div class="debug-label" style="left:40%;top:28%">LIGHT · emissive response</div>
</div>
<div id="top">
  <div id="badge" class="panel"><strong>GRAPHICS QUALITY GOVERNOR</strong><span>same recipe · same seed · same camera</span></div>
  <div id="fps" class="panel">FPS --<br>p95 --ms</div>
</div>
<div id="hint" class="panel">Проведи пальцем — чуть осмотреться</div>
<div id="controls" class="panel">
  <button id="primitive" class="bad">PRIMITIVE</button>
  <button id="enhanced">KRIEGER CLASS</button>
  <div id="secondary"><button id="reportBtn">QUALITY REPORT</button><button id="debugBtn">SHOW DEBUG</button></div>
</div>
<div id="report" class="panel"></div>
<script type="module" src="./scene.mjs"></script>
</body>
</html>
